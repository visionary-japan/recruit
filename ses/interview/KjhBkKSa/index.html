    <script id="interview-data" type="application/json">{"slug":"KjhBkKSa","role":"エンジニア","skills":"Java","initial":"S.N","title":"市場価値を知りたい！明確な評価制度が成長のモチベーション","tags":["案件選択制","リモートワーク","好きな場所で働く","評価制度","サポート体制","高還元","チーム参画"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/8001f23483784f5c9fc9b217bb9b0ef1/s-600x412_3180310c-850b-4903-92e9-deee203aeb63.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/e40924d8d3f9433db6845c77ea347df9/interview-KjhBkKSa-top.webp","alt":"市場価値を知りたい！明確な評価制度が成長のモチベーション"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！簡単に自己紹介やこれまでの経歴を教えてください！"},{"type":"answer","text":"これまでのエンジニア歴は7年ほどになります。主にJavaを使ったバックエンドの業務用WEBシステム開発に取り組んできました。今後はさらにJavaの専門性を高め、設計のスキルも更に向上させたいと思い、Visionary AIに入社しました。 現在は大阪に在住し、大手メーカーの国際貿易を管理する発注システムの開発プロジェクトに参画しています。STEP1から3までの段階があり、私はSTEP3の基本設計から関わっています。主要な中核機能を任されており、新たな成長の機会とやりがいを持って働くことができています！ また、Visionary AIの新しい後輩メンバーが増えチーム参画となりました！とても素直で知識の吸収が早い優秀なメンバーなので、教えがいがありますね。詳細設計と製造を同時進行で進めるフェーズなので、一緒に取り組みながら成長していきたいと考えています。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"大阪のベテランメンバーNさんのお話を聞くのを楽しみにしておりました！早速ですが、転職活動を考えたきっかけを教えていただけますか？"},{"type":"answer","text":"転職を考え始めたのは、前職での評価制度や給与体系に懸念を感じたことがきっかけでした。任される仕事のレベルは今と同じくらいでしたが、年収が低く、昇給もほとんど見込めない環境でした。 ふと「エンジニアの市場で見ても、自分の価値はもっと高いのでは...？」と思い、市場価値を知りたいと思い転職活動を始めたんです。 また、前職では営業の方とも関わりが少なく、会社のサポートが十分ではない環境でした。例えば、相談したいことがあり連絡しても、返信が2日後ということが普通でした。困ったことがあっても社内で相談できる相手がいない状況を改善したく、些細なことでも相談しやすい組織を探そうと思いました。"},{"type":"question","text":"そうだったんですね。そのような思いを持ち、転職活動を進めていく中で、Visionary AIを選ばれた理由を教えていただけますか？"},{"type":"answer","text":"様々な会社の求人を見ていく中で、Visionary AIだけは他の会社と明らかに違うと感じました！特に魅力に感じたのは、還元率の高さとサポート体制の充実さでした。 求人サイトの情報からもその充実度が伝わりましたし、面談で小野代表から直接話を伺うことで、実際に入社後のイメージも持つことができました。転職で叶えたいことを全て実現できる環境だと思い、内定を頂いてからすぐに入社を決めました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/6cd13cdb5fb14213a225d773795017ed/interview-KjhBkKSa-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"ありがとうございます！Visionary AIを選んでいただき本当に嬉しかったです！実際に入社してみていかがですか？"},{"type":"answer","text":"様々な変化はありますが、一番の大きな変化は収入面ですね。前職と比べると約2倍になり、手取りが大きく増えました！あまりお金を使うタイプではないですが、貯金を増やすことができて将来への安心感を得ることができました。単価連動制も、自分の市場価値を適正に把握することができるので、キャリアの方向性を定めやすく自分にとても合っている評価制度だと思います。 また、期待以上の充実したサポート体制に感動しました。実際に案件に参画するまでの段階でも、案件の選択肢を多く与えてくださり、自分の意思で案件を選ぶことができる点が特に嬉しかったです。各案件の情報も「勤務形態、リモート可否、担当する工程、開発環境、単価」など全ての情報を具体的に開示して頂けるので、透明度が高く、会社を心から信頼できると感じました。 面談を進める中で、自分の希望やチームの雰囲気がミスマッチの場合も遠慮なく相談でき、ここまでサポートしてくれる会社があるのに驚きました。"},{"type":"question","text":"転職で叶えたいことを全て叶えることができて本当に良かったです...！働き方などに変化はありましたか？"},{"type":"answer","text":"生活自体は大きく変わらないのですが、リモートワークを多めにしたいという希望を叶えることができました！現在は週4リモート、週1出社の働き方を選んでいます。 定期的に出社を取り入れることで1週間にメリハリができますし、4月からは後輩メンバーも増えたので、出社して直接コミュニケーションを取りながら仕事を進めています。元々人に教えることも好きなので、時間があれば5分でも10分でも積極的にコミュニケーションを取って、メンバーの成長に貢献したいと思っています。 また、Slackのtimesチャンネル（各エンジニアが自由に発信できるチャンネル）を見ていると、皆さん自由に趣味や技術に関する発信をしていて、どのようなメンバーがいるのか知ることができるので、とても良いカルチャーだなと感じています。"},{"type":"question","text":"Nさんのパフォーマンスを最大限に発揮できる働き方を実現できているんですね！クライアントからも大変評価が高いNさんですが、仕事のこだわりがあれば是非教えていただきたいです！"},{"type":"answer","text":"まだまだ自分としても発展途上だと思っていますが、そのように評価いただけてとても嬉しいです。 仕事を進める上では『過去の自分の失敗を繰り返さないこと』『相手と認識の違いを起こさないこと』を常に意識しています。経験が浅い頃は、どんなに些細なことでもメモを取り自ら調べ、リーダーに質問して解消するようにしていました。自分が教える立場となった今は、認識のズレがないかをまず相手と確認してからレビューを進めたり、些細な点にも配慮して仕事に取り組むようにしています。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"一人のビジネスパーソンとしても勉強になります...ありがとうございます！現在も大活躍いただいてますが、今後Nさんはどのようなキャリアを築きたいと考えているのでしょうか？"},{"type":"answer","text":"これまでもJavaを使った開発に取り組んできたので、今後はJavaの様々なフレームワークを使いこなせるエンジニアになりたいです。「Nに聞けばわかるよ！」と言われるほどのレベルを目指していきたいです。 また、今の案件で基本設計から挑戦できていますが、設計からテストまで一人称で一貫してできるエンジニアになりたいです。求められるプログラムを組み、そのシステムの仕様や製造に詳しいエンジニアとして頼られる存在を目指したいと思います。 必ずしもPMやPLのポジションでなくてもいいですが、リーダーの補佐や提案ができるポジションにもどんどん挑戦していきたいです。"},{"type":"heading","text":"最後に"},{"type":"question","text":"本当に頼もしいですし、Visionary AIのメンバーのマネジメントもどんどん任せていきたいと考えています。最後に候補者に一言お願いします！"},{"type":"answer","text":"前職や転職活動を進めていた頃は、「自分はどれだけ社会で価値を提供できているのだろう」「自分のスキルはどれほど通用するのだろう」ということがわからず不明瞭でしたが、Visionary AIでは、自分の現在地や市場価値を把握したうえでパフォーマンスを発揮できる環境があります。自分の成長を日々実感し、叶えたい希望を実現できる場所なので、「エンジニアとして成長したい」「収入を上げたい」という思いがある方にとって、最高の環境です！ また、ネガティブなことや悩み、不安も率直に話せるチームの雰囲気や役員、営業のサポートがあり、心理的安全性も担保されている組織だと思います。まずは面談であなたの思いや考えを打ち明けてみてください！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
