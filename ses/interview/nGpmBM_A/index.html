    <script id="interview-data" type="application/json">{"slug":"nGpmBM_A","role":"エンジニア","skills":"Java, React","initial":"R.K","title":"『仕事が楽しい⇒人生も楽しい』好きな仕事で、キャリア＆年収UP","tags":["リモートワーク","人と社風が好き","案件選択制","評価制度","高還元","サポート体制","スキルアップ支援"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/4738a0849b3b40ffbb56b4a4ea6d0f24/interview-nGpmBM_A-thumb-2026-10-28-v2.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/a0d8714d491b4adb934a682aea18afee/interview-nGpmBM_A-top.webp","alt":"仕事が楽しい⇒人生も楽しい』好きな仕事で、キャリア＆年収UP"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"新卒で大手IT企業にエンジニアとして入社し、自社サービス開発を担当していました。その後に、その会社で\"頑張りたい”というモチベーションを持てなくなってしまったことから、一度エンジニアを辞めて、個人事業主として営業代行や業務効率化ツールの販売等もやっていました。 ただ、昔から『ものづくり』が好きで、エンジニアとして働いていたときが「やっぱり楽しかったな、面白かったな」と思い、エンジニアとして再スタートすることに...！ Visionary AIに入社した今は、百貨店向けのAIを使ったシステム開発・改修に携わっていて、念願だったReactを使ったフロントエンドにも挑戦しています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"エンジニアから異業種の個人事業主等、幅広いキャリアの経験を持つKさんのお話を聞くのを楽しみにしていました！一度、エンジニアのキャリアを離れたのは何故だったんでしょうか？"},{"type":"answer","text":"新卒で入社した会社は、SESや自社サービス等も幅広く展開している大手IT企業でした。そのときに「一生懸命仕事を頑張ったり、スキルが身について、評価や報酬に繋がらない」と実感してから“頑張るモチベーション”が湧かなくなってしまって...。 当時は朝の9時から終電まで働くのが当たり前で、エンジニアの仕事は好きなのに、開発業務ではないドキュメント作成等の雑務に追われてしまったり、自分の働く現場を知らない上層部の方から評価される制度だったため「この人は私の何を知って、何を評価しているんだろう」とモヤモヤ感じるようになってしまいました。 当時は忙しすぎて転職活動ができなかったので、一度会社を辞めてキャリアを見つめ直そうと思い、エンジニアという職種からも離れることにしました。"},{"type":"question","text":"エンジニアの仕事が好きなのに、『頑張るモチベーションが湧かない』状況は辛いですよね...そこから改めてエンジニアとして頑張ろうと思ったきっかけがあったんでしょうか？"},{"type":"answer","text":"個人事業主としてやっていたときには様々な仕事を経験することはできたのですが、エンジニアの仕事ほど『楽しい』『没頭できる』という実感はなかったんです。 私は『楽しい』『面白い』と思えることに対してはモチベーション高く努力ができるのですが、そう思えないと飽きてしまう性格でして...。思い返したときに、エンジニアとしてものづくりをしていたときは時間を忘れて開発に4~5時間没頭していることも多かったですし、“わからないことを調べる→コードを書く→想像したとおりにプログラムが動く”この工程を通して得られる達成感が最高に楽しかったなと思いました。その結果、もう一度エンジニアとしてキャリアを築きたい！と思いました。"},{"type":"question","text":"自分がワクワクすること、楽しいと思えることが何だったのか、別のキャリアを経験することで見つけられたんですね！転職活動の結果、Visionary AIに入社した決め手を教えてください！"},{"type":"answer","text":"エンジニアのキャリアとしてはブランクがあったので「採用してくれたら嬉しいな」という思いを持ち、転職サイトやエージェントに登録して転職活動を進めました。 前職で「努力をしても、目に見える評価がない」ことに対して懸念を感じていたので、Visionary AIの求人に記載のあった『案件単価ー会社利益最大月10万円＝収入』というキャッチコピーがとても印象的で応募をしたことは今でも覚えています！私は「稼ぎたい！」という思いも強いので、自分の努力次第で、やればやるほど稼げるシンプルな評価制度はとても魅力的でしたね。 また、前職は3,000名ほどの大規模な会社でアンマッチを感じたので、性格的にもベンチャー企業やスタートアップで「会社を創る一員になれる」環境の方が合っているのではないかとも思っていたので、その点でもマッチ度が高いなと感じていました。 転職活動を始めてすぐの時期に、Visionary AIの面談が決まりまして、そこで代表と話す機会をいただきました！これまでの経歴や自身の価値観、今後エンジニアとして描いていきたいキャリアの話だけではなく「これは面談と言えるのか！？」というような雑談までカジュアルに話すことができ、気づいたら1時間以上楽しく話していました(笑)　意気投合したことも多く、価値観が合う会社だなと思い、内定を頂いてからすぐに入社を決めました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/c2b74b6f8be74c548c61f7fce68d2fb9/interview-nGpmBM_A-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"好奇心や向上心が高く、アクティブなKさんがVisionary AIに入ってくれてとても嬉しかったです！実際に入社してみていかがですか？"},{"type":"answer","text":"職場も、仕事も、プライベートも嬉しい変化がたくさんありました！ 一番嬉しかったのは“選べる案件の豊富さ”ですね。SESとしての働き方は初めてなのですが、前職はやりたいことを選ぶことができず、会社都合で全てが決まる環境だったので...。Visionary AIは案件参画までも本当に営業のサポートが手厚いんです。自分が追いつかないほど魅力的な案件をたくさん紹介してくださったり、営業チーム全員が自分のことを気にかけてくださったり...。前職ではエンジニアも営業も社員との関わりがほぼなかったので、こんなにも人の温かさや応援してもらえることは嬉しいんだなというのは、Visionary AIに入社して気づきました。 この前実施した1on1では「このくらいの単価の案件に入るには、こういったスキルや経験が必要」といったキャリアの方向性や、実際に参画ができそうな案件まで具体的に提示してもらえたので、キャリアのイメージがしやすいなと実感しました！エンジニアの市場についても専門性の高い営業視点でのアドバイスはとても参考になりますね。私は闇雲な努力ではなく、必ず結果につながる努力をしたいので、1on1や案件選択制を活用してキャリアを築いていきたいと考えています。 「努力した分、成長した分、自分のキャリア・報酬に繋がる」というモチベーションがありますし、残業も少なくなったので、勉強する時間を作れるようになりました。改めてエンジニアに復帰してからは「やる意味」が明確だからこそ、勉強時間も楽しめています！"},{"type":"question","text":"キャリアや収入も自分次第ではあるからこそ、Kさんにとってはぴったりな環境だったんですね！Visionary AIのカルチャーはいかがでしょうか？"},{"type":"answer","text":"入社して実感したことではありますが、Visionary AIは『人思いで、技術力も高いエンジニアメンバー』ばかりが集まっていることが凄いなと思います。予定が合えば社内イベントや勉強会にも参加しているのですが、「この人はこんな仕事をしているんだ」「こんなことを頑張っている人がいるんだ」という気づきが必ずあるので、私も意欲的に「頑張ろう！」という刺激をもらえます。 SESは現場に閉じこもりがちで、会社や組織とは疎遠になりがちな印象を持っていたので、Visionary AIは良い意味でSESらしくないなと思います。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Kさんがのびのびと自分らしく活躍していてとても嬉しいです！具体的には今後どのようなキャリアを築いていきたいんでしょうか？"},{"type":"answer","text":"やっぱりものづくりが好きなので、開発に没頭したい...！というのはあるのですが、キャリアを考えると要件定義〜設計ができたり、顧客からのニーズを落とし込んで上流〜工程まで対応できるようにならなければいけないなとは考えています。 私は人と関わることも、エンジニアとして開発することも好きなので、最終的にはリーダーとしてPJ全体を回せるようなキャリアを目指していきたいと考えています！"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！今後の活躍が本当に楽しみです...！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"私はこの会社に入って、一言でいうと『仕事へのやる気』が出ました。仕事を楽しめれば、よりプライベートも楽しめると思います。人生そのものがプラスの方向に繋がるので、本当に良い変化があったなと実感しています。 前職はやることが決まってしまっていて、飽きてしまったという経験がありましたが、Visionary AIであれば「頑張れば、キャリアにも年収にも繋がる」というブレないモチベーションがあるので、色々と挑戦しながら楽しんでいきたいと思います！人生をもっと楽しみたい、挑戦したい！という方はVisionary AIに来るしかないです(笑)！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}],"featuredOrder":3}</script>
