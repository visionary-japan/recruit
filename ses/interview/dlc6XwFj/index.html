    <script id="interview-data" type="application/json">{"slug":"dlc6XwFj","role":"エンジニア","skills":"Java, JavaScript","initial":"N.Y","title":"希望を叶える仕組みと組織に驚き！私らしく働ける理由","tags":["案件選択制","ワークライフバランス","評価制度","社内業務なし","サポート体制","リモートワーク"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/bbb8b6a329fb495e9f9ff6e8fc5826d1/s-600x412_5ea7261c-4846-4384-be8f-389f7f4dc6e6.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/d4f6ec17870f498cac5afd38607cbda0/interview-dlc6XwFj-top.webp","alt":"希望を叶える仕組みと組織に驚き！私らしく働ける理由"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"これまでJavaやJavaScriptを中心とした開発やPMO補佐などを8年ほど経験し、エンジニアとして更にスキルアップしたいと思い、VISIONARY AIに入社しました！ 現在はtoB向けの決済サービスシステムの開発に携わっており、担当は新規機能開発や既存機能改修など幅広く、工程は基本設計から結合テストまで一通り携わっています。フルリモートで働いていて、VISIONARY AIのメンバーとチームで参画しています！日によって作業内容が異なるので自由度も高く、自分のペースで進められるのが特に良いなと感じています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"エンジニアとして長く活躍されているYさんのお話を聞くことを楽しみにしておりました！早速ですが、今回転職を考えたのは何かきっかけがあったのでしょうか？"},{"type":"answer","text":"これまでもSES企業に所属していたのですが、要件定義や設計などの上流工程やPMO補佐としてのプロジェクト管理業務が中心で、エンジニアとしての技術を直接活かせる機会が少なかったんです。 また、会社のイベントや委員会活動も多く、実務以外の業務負担が大きかったため、エンジニアとしての成長がなかなか難しく感じていました。そこで「エンジニアとしてモノづくりに直接関わりたい」「もっと成長したい」という思いが強まり、転職を考え始めました。"},{"type":"question","text":"そうだったんですね！実際にVISIONARY AIに入社するメンバーからも「エンジニア業務に集中したい」という声は多く寄せられています！"},{"type":"answer","text":"そうですよね...！前職では、参画している案件の単価を知る機会がなく、当時の上流工程のポジションの方が社内評価や収入も高かったので「開発工程にもっと携わりたい」と相談しにくい環境でした。 このままでは自分のやりたいことができないと思い、「エンジニアとしての理想のキャリアと収入、両方を実現できる環境を探そう」と転職を決意しました。"},{"type":"question","text":"その環境として、VISIONARY AIを選んでいただきありがとうございます！様々な会社がある中で、当社に入社を決めた理由を教えていただけますか？"},{"type":"answer","text":"VISIONARY AIに入社を決めた理由は「単価連動型の評価制度」と「案件を自分のライフスタイルに合わせて選べる」という2つのポイントに魅力を感じたからです。 前職では、自分が参画している案件の単価が分からず、評価項目も様々でした。エンジニアとして顧客にどれだけ価値提供できるのかを把握できる評価制度は理想通りの環境でした。案件情報も全て開示されるので、透明度も高く安心できました。さらにフルリモートの働き方が実現できる点も決め手になりました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/2d83581f67d842a3a4f486af1f999ab2/interview-dlc6XwFj-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"Yさんに入社していただいてとても嬉しかったです！実際に入社してみていかがですか？"},{"type":"answer","text":"正直、最初はVISIONARY AIの制度に対して「本当にこんな希望が全て叶うのか」と疑っていたんです（笑）以前、転職活動をしていたときにギャップが生じたこともあったので...。特に直近はPMO補佐の期間が長かったので「開発に携わりたい」という希望が叶うのか不安もありましたが、案件に参画するまでの期間、営業チームの皆さんから希望条件に合った案件を続々と紹介してもらい不安はすぐに解消されました！ 面談前には想定質問の共有や対策など、営業チームから手厚いサポートを受けて安心して面談に挑むことができました。いくつか案件を受け、開発工程とフルリモートの両方が叶う案件に参画を決めました！ 案件参画後も営業チームや現場のサポートが充実していたおかげで、開発業務にもスムーズに復帰できました。"},{"type":"question","text":"現場の方からもチームVISIONARY AIが活躍していると話を聞いています！働き方に何か変化はありましたか？"},{"type":"answer","text":"自分の時間や家族とゆっくり過ごす時間が増えました。前職では会議や委員会など業務時間以外に対応することも多く、往復2〜3時間の通勤時間もあって時間の余裕がなかったので...。今はパートナーもフルリモートで働くエンジニアなので、お昼休憩に一緒に自炊した料理を食べながらリフレッシュできるなど、理想の充実した日々を過ごせています。 単価連動型で入社後に収入がUPしたことも嬉しかったです。今後も自分の頑張り次第で収入がUPすることが明確なので、日々のモチベーションになりますね。"},{"type":"question","text":"エンジニア同士のご夫婦...想像するととても素敵です...！ちなみに先日開催された全社会は参加してみていかがでしたか？"},{"type":"answer","text":"全国のエンジニアメンバーと直接会うことができてとても嬉しかったです。表彰プログラムでは、オンライン上でしか知らなかった様々なメンバーの活躍や人となりを知ることができ、私自身も「もっと頑張ろう」というモチベーションに繋がりました。次回の開催も楽しみにしています！ また、以前の会社では強制参加の社内イベントが多かったのですが、VISIONARY AIでは社内イベントや勉強会などが自由参加で自分のペースで参加できるので、居心地の良さを感じながら働くことができています。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"全員の思いを大切にしたいという思いで組織づくりに取り組んでいるので、そのように思っていただけて嬉しいです！ちなみに、今後はどのようなキャリアを積んでいきたいのでしょうか？"},{"type":"answer","text":"まずはエンジニアとして技術スキルの向上を最優先に取り組みたいです。開発工程のブランクを解消し、自信を持てるレベルまでスキルを高め「Yさんがいれば大丈夫・安心」と任せてもらえるような存在を目指していきたいです。その後は、より開発規模の大きい案件にも挑戦したいと思っています。 また、参画している案件でクライアントから「VISIONARY AIのメンバーを増やしたい」と言われるようなパフォーマンスを発揮し、現場拡大にも貢献していきたいです！私自身も他のメンバーをリードできる立場になりたいと思っています。今一緒に参画しているVISIONARY AIのMさんとも「もっとうちのメンバーを増やしていきたいね！」と話しています！（笑）"},{"type":"heading","text":"最後に"},{"type":"question","text":"本当に心強いですしかっこいいです！今後もYさんが理想のキャリアを築けるようサポートしていきたいと思います！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"私自身もキャリアを考える中で不安がありましたが、VISIONARY AIは一人ひとりと向き合って、実現に向けてしっかりサポートしてくれる環境です。手厚いフォローが待っていますと自信を持って伝えたいです！ 最初は不安もあるかもしれませんが、ぜひ一度お話を聞いてみてください！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
