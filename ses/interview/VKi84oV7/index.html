    <script id="interview-data" type="application/json">{"slug":"VKi84oV7","role":"エンジニア","skills":"Java, PHP","initial":"A.S","title":"『自分らしく』いられる心理的安全性の高い組織","tags":["高還元","評価制度","リモートワーク","人と社風が好き","ワークライフバランス","心理的安全性","サポート体制"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/eb493f649d2d48eaba3c38d51a263c6b/s-600x412_2b9386a9-2b6d-4761-84e6-16d4fd80be6e.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/e4982942be114e8fa2b2ae77bb38f6f9/interview-VKi84oV7-top.webp","alt":"『自分らしく』いられる心理的安全性の高い組織"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"いつも社内を盛り上げてくれるSさんのお話を聞けるのを楽しみにしていました！本日はよろしくお願いいたします！まずは、簡単にこれまでの経歴を教えていただけますか？"},{"type":"answer","text":"こちらこそよろしくお願いいたします！ 私は新卒からエンジニアとして勤務していて、今年で社会人2年目になります。エンジニア歴はまだまだ未熟ですが、前職の環境では『努力が評価に繋がらない』『自分らしくいることができない』という経験から、日々葛藤を感じるようになり転職を決意しました。 Visionary AIに入社して、現在はJavaをメインに使う株価関連のシステム開発案件に参画しています。わからない点がありつつも、リーダーの方から丁寧に教えていただきながら一歩ずつ成長しています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"案件先でもSさんの評価はとても高くて、ポジティブな声を多く頂いています！改めて、入社までのエピソードをお伺いできますか？"},{"type":"answer","text":"そうなんですか！まだ未熟でわからないことも多いので、今は周りからとにかく学んで走り続けています(笑)！ 転職活動は、前職の評価制度と組織やカルチャーに違和感を感じるようになり「この環境では、自分のパフォーマンスを発揮しづらい息苦しさがあるな」と感じるようになったことをきっかけに始めました。前職の環境が悪かったのではなく、私が組織やカルチャーと合っていなかったなと思います。私はお笑いが好きなので、それを受け入れてくれて一緒に笑ってくれるような先輩や同期がいると安心や信頼につながるのですが、そういった雰囲気を出せる組織ではなかったので社内でも孤独を感じるようになりました。 また、実際の仕事自体は楽しみながら取り組めていたのですが、上長や営業の方に相談しても案件情報については教えてもらえないのが当たり前でしたし、なにかの拍子で案件単価を知ったときにも「結局、私に還元される給料はこんなに少ないんだ...」という事実を目の当たりにしました。 とにかく努力して案件先で評価されていても、社内では全然評価されなかったんです。会社の方針としても『エンジニアとしての評価＝資格取得が重要』という考え方があり、資格を取得しないとそもそも認められないような環境でした。"},{"type":"question","text":"そのような経緯があったんですね...。今のSさんがキラキラと活躍しているのを見ると全く想像ができないです...！様々な会社がある中で、Visionary AIを選んだ決め手を教えてください！"},{"type":"answer","text":"一番は、Visionary AIの『人』に惹かれたからだと思います！5社くらい面接を受けていて、Visionary AIの面接を受ける前は「他の会社で内定もらっていたしそこにしようかな」と思っていたのですが、代表との面接を通してVisionary AIの人やカルチャーについて聞いたときに『この会社なら自分を偽らずに、自分らしくいられる』と思い、入社を決めました！面接では大好きなお笑い芸人についても語ったんですけど、代表がめちゃめちゃ笑ってくれて、とても安心したことを覚えています(笑)！ また、シンプルで透明度の高い評価制度にも惹かれましたね。前職は案件情報も開示されなかったですし、案件先での活躍が社内の評価に繋がらないことに違和感を感じていたので...全てのモヤモヤが解消されました！案件情報も全て教えてもらえるので信頼もできますし、単価連動制であれば案件先の評価が自分の成果に直結するので、スキルアップのモチベーションにも繋がります！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/c10bce6c8d52400a8519856f159b87f9/interview-VKi84oV7-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"仕組みや組織に共感いただけてとても嬉しいです！働き方やプライベートの過ごし方も変わったとお聞きしましたが..."},{"type":"answer","text":"そうなんです！Visionary AIに入社して初めてリモートワークが出来るようになりました！念願だったので嬉しすぎて友達にも自慢しちゃいました(笑)！ 年収も上がったので、時間にも生活にも余裕ができた分、仕事後に疲れ果てて休むだけだった生活から、「オムライスだけではなくてスープも作れる！」とか「近所をゆっくり散歩できて、新しい発見があった！」とか、ちょっとした幸せを感じる時間が増えたことがとても嬉しいです...！余計なことも出来るようになるって嬉しいですよね！"},{"type":"question","text":"これまでできなかった“余計”なことができるようになるってとても嬉しいですよね！一緒に働くメンバーの印象も教えてください！"},{"type":"answer","text":"エンジニアメンバーも営業メンバーも、出会う人がみんな本当に温かい人ばかりなので、何かあったときにも助けてもらえるという安心感を感じます！心理的安全性が担保されているというか...前職では常に薄氷を踏むような不安があったんですけど、Visionary AIは安定した大地、大陸！みたいな環境ですね。誰とでも話せる安心感があるので『無差別アットホーム感』と命名しています(笑)！ Visionary AIという会社もメンバーも大好きだから、昨年のQiitaのアドベントカレンダー記事執筆イベントにも参加しました！定期的な勉強会もありがたいですし、毎月の社内イベントも本当に楽しみにしているんです！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"そう言っていただけてとても嬉しいです...！Sさんは今後Visionary AIでどのようなキャリアを築いていきたいですか？"},{"type":"answer","text":"キャリアではなく、プライベートの目標になるのですが、若いうちに黒のクラウンを買いたいなと思っていて...笑　女性でクラウン乗ってたら渋くてかっこいいじゃないですか！！Visionary AIであればスキルアップ次第で年収も上げることが出来るので、たくさん勉強してどんどんエンジニアとしてのスキルを高めて実現したいと思います！"},{"type":"heading","text":"最後に"},{"type":"question","text":"とても素敵な目標ですね！実現できるよう私たちも全力でサポートします！最後に、転職を考えている候補者に一言お願いします！"},{"type":"answer","text":"転職を少しでも検討している方がいれば、「迷わず転職してみてほしい！」と思います。特にVisionary AIであれば年収も増えますし、リモートや副業との両立等、希望の働き方も選択できます。案件を自分で選べるので納得感を持って仕事と向き合えますし、何かトラブルが起こった際にも、頼れる経営陣や営業メンバーがいるので安心して働くことができます。私も思わず周りに自慢したくなっちゃう会社なので、本当にオススメです！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
