    <script id="interview-data" type="application/json">{"slug":"3crVK99Y","role":"エンジニア","skills":"JavaScript, React","initial":"M.I","title":"最適なキャリア設計と透明度の高さが信頼に","tags":["サポート体制","評価制度","スキルアップ支援","リモートワーク","人と社風が好き"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/51a431d2b616489baa5671dcdd054f6a/s-1024x683_v-fs_webp_08636c72-905c-41c6-bac4-34432673e889.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/ada3f7e74e6a4ec591d866ffd4a7e84d/interview-3crVK99Y-top.webp","alt":"最適なキャリア設計と透明度の高さが信頼に"},"blocks":[{"type":"heading","text":"入社背景"},{"type":"question","text":"様々な選択肢がある中で、VISIONARY AIを選んだ理由を教えてください。"},{"type":"answer","text":"社員のことを本気で思い、考えている会社だと感じたためです。 前職では具体的なキャリア設計や気軽な相談が出来ず、将来に不安を感じていました。エンジニアのキャリアサポートが手厚い会社を探している中で、VISIONARY AIと出会いました。 目標、身に着けたいスキル、希望の働き方も細かく聞いて理解して頂いた上で、最適なキャリア設計を一緒にして頂き、案件を見つけてくれる点から、社員のことを大切にしてくれていると感じました。 ビックリしたのが、案件を自由に選べる他に、案件単価や契約内容、会社の利益も全て公開してくれるところです。透明性が高い点も信頼に繋がりました！(笑)"},{"type":"question","text":"実際に入社してみてどのような雰囲気を実感しますか？"},{"type":"answer","text":"実際に入社して気づいたのですが、経営層だけでなく営業メンバーやエンジニアも、気にかけて助けてくれる人が多いことに驚きました！ 困ったことがあれば気軽に相談に乗ってくれるメンバーが多かったり、一人ひとりの専門性を活かしたエンジニア主催の勉強会が開催されていたり、皆でご飯に行ったりなど、人思いな方が本当に多いと実感しています！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/4656d8f0a43b4a4888dbe451a603f7f9/interview-3crVK99Y-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"実際の働き方について教えてください！"},{"type":"answer","text":"今はフロントエンドエンジニアとしてReactの実装案件に入っていて、フルリモートを希望したのでフルリモートで勤務しています。通勤時間が無くなったので、空いた時間を使って朝散歩したりと、有意義に時間を使えています！ 残業はあっても1日30分程度なので、仕事が終わったら資格勉強したり、Reactの勉強をしたりと、自己学習の時間を作れています！いち早く一人前のエンジニアになりたいので、学習時間が作れるのは嬉しいです！"},{"type":"heading","text":"今後の目標"},{"type":"question","text":"オンオフのメリハリを付けられるのはいいですね！今後の目標はありますか？"},{"type":"answer","text":"まずはエンジニアとしてスキルアップし、技術者として自信が持てるようになることが直近の目標です！ エンジニアとしてスキルアップ＝案件選択の幅も広がるので、将来的にはライフワークバランスの取れた案件に参画したいですね！旅行が好きなので、海外旅行などにも行ける頻度を増やしていけたらいいなと思っています！"},{"type":"heading","text":"最後に"},{"type":"question","text":"転職を考えている方に一言お願いします！"},{"type":"answer","text":"やりたいことはもちろん、分からないことや不安が無いか気にかけてくれるメンバーが多かったりと、本当に温かい会社です！働き方や描いているキャリアプランなど、希望が叶うので自分らしく働けます！是非、皆さんお待ちしております！"}],"featuredOrder":3}</script>
