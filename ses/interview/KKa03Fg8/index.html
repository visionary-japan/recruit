    <script id="interview-data" type="application/json">{"slug":"KKa03Fg8","role":"エンジニア","skills":"JavaScript, React","initial":"E.K","title":"刺激し合える仲間と共に！アウトプット機会が成長へ","tags":["評価制度","リモートワーク","人と社風が好き","リファラル入社","心理的安全性","スキルアップ支援"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/8ccc082edcae491aabebe761997db24f/s-600x412_e5c95c24-0e0b-4017-a642-08a3c39ec53e.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/3f2f5e7737114ee1a1d3b997106454e7/interview-KKa03Fg8-top.webp","alt":"刺激し合える仲間と共に！アウトプット機会が成長へ"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"現在はフロントエンドエンジニアとして、主にReactを使い小中学校で使用されるWEB教科書のコンテンツを開発しています。VISIONARY AIからはチームで参画しています！ 前職でも元々エンジニアとして勤務していたのですが、エンジニアは私一人だけで...一緒に切磋琢磨できる仲間が欲しいと思うようになり、VISIONARY AIに転職しました！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"前職ではエンジニア一人だったのですね...。転職活動の詳しいエピソードを教えてください！"},{"type":"answer","text":"前職は小規模の会社で、正社員が3人しかいなかったんです！毎日出社していたので顔を合わせる機会は多かったのですが、3人とも別の職種なので直接的に関わり合うことが少なかったり、エンジニアとして技術関係の相談ができなかったり...。「熱量のあるエンジニアと切磋琢磨して一緒に働きたい！」と思うようになり転職を決意しました。 また、小規模の会社あるあるだとは思うのですが、一人ひとりの担当する範囲も広く、複数のプロジェクトを担当していました。ただ、働いている時間に対する収入が低く、収入をもっと上げたいと思ったのも転職を考えた理由の一つでしたね。"},{"type":"question","text":"規模の小さな環境だと裁量も大きい分、タスクも増えてしまいますよね。転職活動を進める中で、VISIONARY AIを知ったきっかけを教えてください！"},{"type":"answer","text":"たまたまVISIONARY AIのエンジニアメンバーと知り合いランチに行った時に雑談で「会社のメンバーと一緒にグランピングにいった」「勉強会が積極的に開催されている」「VISIONARY AIが好きで、骨を埋めようと思ってる（笑）」と自分の会社を楽しそうに話す姿を見て、素敵だなと思ったんです！ 「そこまで思える会社ってどんな会社なんだろう？」と興味を持ち、すぐにVISIONARY AIを紹介してほしいとお願いしました（笑）！ その後の代表との面談も本当にカジュアルで何でも話すことができましたし、営業メンバーのみなさんも含め、出会う方皆さんが魅力的だなと実感しました。最終的にVISIONARY AIで働く人の魅力や単価連動制のシンプルな評価制度に惹かれ、入社を決めました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/7814c5a204e744c4998310b4947fad49/interview-KKa03Fg8-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"実際に入社してみていかがでしょうか？"},{"type":"answer","text":"とにかくサイコーです！！特に期待していた『人』の魅力は社内イベントを通して実感しましたね。 事前にVISIONARY AIのエンジニアメンバーの雰囲気は聞いていましたが、想像以上に皆さんが良い人で、多種多様なエンジニアと関わり合うことができるのが本当に嬉しいです！僕自身、インフラやバックエンド、フロントエンド等の経験もあり知識の幅には自信があったので、色々なエンジニアと専門的な会話ができるのがこれまでにはない新鮮な経験でとても嬉しいです（笑） 毎月のオフラインイベントは無料で参加できますし、イベントを通じて仲良くなった人と一緒にプライベートでもご飯を食べに行ったり、新たな趣味ができたり、とても充実した時間を過ごすことができています！"},{"type":"question","text":"Kさんのおかげで毎回イベントが盛りがるのでとても頼もしいです！Kさんは自主的に勉強会も主催してくださっていますよね！"},{"type":"answer","text":"そうですね！勉強会を開催している一番の理由は、自分のスキルアップに繋がるからなんです。受動的に学ぶ知識より能動的に学ぶ知識の方が質は高まると思うので、アウトプット機会の場として積極的に勉強会を主催するようにしています！ 前職では、土日は疲れて勉強する余裕がなかったのですが、今は勉強会を開催するために新たな知識をインプットする時間として土日を過ごしたりと、自己研鑽の時間が増えましたね。実際に勉強会を主催するようになってから、エンジニアとしての成長も実感するようになったので、今後も勉強会はずっと続けたいと思ってます。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"いつもありがとうございます！ちなみに、Kさんの今後の目標を教えてください！"},{"type":"answer","text":"短期〜中期的な目標でいうと、勉強会をずっと続けたいです。現在参画している案件でも成長機会が多くあるので、3~4年かけてエンジニアとしてどんどん成長していきたいです！ また、長期的な目標だと、私がフロントエンド領域をメインでやっているので、スペシャリストになって会社のフロントエンドエンジニアのリーダー的ポジションを担えるようになりたいですね！"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"VISIONARY AIで働いていて一番良かったと思う点は、なんといっても会社の多くのメンバーと繋がれることです。月に一度オフラインイベントが開催されていたり、週3回有志によるオンライン勉強会が開催されていたりと、他のエンジニアメンバーと関われる機会が多いことが当社の特徴だと思います。 エンジニア同士交流を深めたい、アウトプット機会を増やしたいという方も是非応募してみてください！入社後にお会いできるのを楽しみにしています！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
