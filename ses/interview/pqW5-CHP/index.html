    <script id="interview-data" type="application/json">{"slug":"pqW5-CHP","role":"エンジニア","skills":"Java, JavaScript","initial":"A.I","title":"安定した収入×成長機会が決め手！福岡で築く新たなキャリア","tags":["ワークライフバランス","評価制度","サポート体制","好きな場所で働く","人と社風が好き","スキルアップ支援"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/7d9c450e374c4980bb1ede07ec1bb1d4/s-600x412_1948e4a3-5e2c-46c1-b61d-ee32a19fb4f6.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/b70d986bce06410ebab04e5f5f740598/interview-pqW5-CHP-top.webp","alt":"安定した収入×成長機会が決め手！福岡で築く新たなキャリア"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"簡単に自己紹介をお願いします。"},{"type":"answer","text":"前職もIT企業で、SESエンジニアとして仕事していました。 結婚を機に転職を決意し、Visionary AIに入社してからは、地元福岡で大手電力会社の案件に参画中です。"},{"type":"question","text":"ご結婚おめでとうございます！大きなライフイベントである「結婚」を機に転職を考えるようになったんですね。"},{"type":"answer","text":"そうなんです。元々SES企業でJavaの開発工程を担当していたのですが、ある時現場から撤退する事になり、今度はマネージャーとして社内での部下の育成を頼まれました。 ただ、ちょうどそのタイミングで結婚したこともあり、将来のライフスプランを見直したときに、「安定した収入を得られる評価制度のわかりやすい環境で働きたい」「もっとエンジニアとしてスキルを高めたい」「中長期的に不安なく長く働きたい」と思うようになりました。 その結果、前職の環境では実現が難しいと判断し、転職を決意しました。"},{"type":"heading","text":"入社してみて"},{"type":"question","text":"しっかり稼げて長く働ける会社を探していたんですね。実際にVisionary AIに転職してみてどうですか？"},{"type":"answer","text":"自分次第でライフ・キャリアプランも自由に描けるので、努力次第で自分の希望はすべて実現できるなと思いました！！ 案件を選ぶときにも、単価や仕事内容、出社頻度など全て細かく教えてもらえるので、自分の経験や希望に合わせることができました。 現在はスキルを高めるために経験を積むことに集中して、案件を選んでいますが、将来的にはマイホームのような大きな買い物の為に単価の高い案件に挑戦できるべるようになりたいですね！ 前職と比較すると残業もかなり減ったので、定時で帰宅して家族とゆっくり過ごしたり、毎日ランニングや勉強時間をそれぞれ1時間確保できるようになりました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/c8cce73f1f934a059914fdb36efaa8ff/interview-pqW5-CHP-body.webp","alt":""},{"type":"heading","text":"働き方について"},{"type":"question","text":"現在福岡で勤務していると思いますが、働く中で困っていることなどはありますか？"},{"type":"answer","text":"一人ひとりをバックアップしてくれる環境が整っているので、困っていることは今のところ思いつきませんね！(笑)。 エンジニア一人ひとりに専用のSlackチャンネルが用意されているので、仕事やキャリアについても気軽に相談できます。今後トラブルが起きたとしても、すぐに相談できると思えるのは心強いですね。 また、エンジニア同士でも最新技術の情報や現場で学んだこと等、情報交換が積極的に行われているので、普段一緒の場所にいなくても帰属意識を持って働くことができているなと思います！努力家のメンバーが多いので、「僕も頑張ろう」と刺激をもらっています。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"今後の目標を教えてください。"},{"type":"answer","text":"今まで以上に安心して家族に過ごしてもらうためにも、将来的にはPMやPLとしてマネジメント領域でも活躍していきたいです。 その為には自分自身のスキルアップが不可欠なので、目の前の仕事や普段の勉強を一生懸命頑張って、少しずつレベルを上げていきたいと思います！"},{"type":"heading","text":"最後に"},{"type":"question","text":"転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"「エンジニアとして市場価値を高めたい」「安定した収入を得たい」「家族を大切にしたい」など、全ての希望が叶えられる環境だと思います。 そんな環境はなかなか無いと思うので、今まで以上にスキルアップしたい方や挑戦したいことがある方は、一緒に頑張りましょう！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
