    <script id="interview-data" type="application/json">{"slug":"-4VZKnCM","role":"エンジニア","skills":"SQL, Linux","initial":"S.T","title":"営業力×案件選択制で、キャリアも収入も希望を実現！","tags":["リモートワーク","人と社風が好き","案件選択制","評価制度","営業力の高さ","高還元"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/65e3ac5883174380a70daaf08eccf099/s-600x412_f3ac005e-c0eb-49fe-b5f0-26e598fcec99.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/b2de9221f2894005ad73a5e9fce451ae/interview--4VZKnCM-top.webp","alt":"営業力×案件選択制で、キャリアも収入も希望を実現！"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"新卒からエンジニアとして働いていて、今年で3年目になります。Visionary AIに入社してからは、SQLを使って購買状況を一元管理するシステムや物流関連の開発〜運用業務に携わっています！ リーダーと話す機会も多いので、積極的に挑戦できる仕事がないか聞きながら、色々と挑戦することができています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"初めての転職でVisionary AIを選んでくれてとても嬉しいです！転職活動を始めたきっかけについて教えてください！"},{"type":"answer","text":"前職では、業務を一生懸命に取り組んで現場で成果を出していても、社内評価や収入UPに繋がらない環境でして...仕事を頑張りたい！と考えている以上、自分の努力や結果を評価してくれる環境で働きたいなと思い、求人を見始めました。 また、前職は社内コミュニケーションがほぼなく、活気もあまり感じられない職場でした。エンジニアと営業の間には常に壁を感じていましたし、他のエンジニアと会うのも年に1回の帰社日のみで...人と会話をする機会がないことは不安になりましたし、何でも良いから会話ができる環境で働きたいなと思いました。"},{"type":"question","text":"人と関わることが好きなTさんにとっては辛い環境だったんですね...。転職活動を通して、Visionary AIに入社した決め手も教えていただきたいです！"},{"type":"answer","text":"様々な会社を見ていた中で、高還元と選べる案件数が多い環境を重要視していました。Visionary AIは求人を見たときから仕組みや制度が全て整っているなと感じていましたし、面談で代表と話して「すぐに入社したい」と思いました！ 特に案件を選べる会社は色々あると思うのですが、Visionary AIの営業力の高さはとても魅力的に感じました。案件を選べたとしても希望とマッチしていなかったり、そもそも紹介数が少なかったら自分の思い描くようなスキルアップが難しいと思うので..."},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/72c502db82ee412b9b51f48ba67232e0/interview--4VZKnCM-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"実際に入社してみて、HPや求人で記載していた内容とギャップを感じた点はありませんでしたか？"},{"type":"answer","text":"ギャップはなく、転職をして「良かったな」と思うことしかないです！営業力の高さは実際に最初の案件が決まるまででとても強く実感しましたね。 Visionary AIの営業チームは熱量や活気があって、案件紹介数の多さや紹介してくれる案件のマッチ度の高さにも驚きました。また、常にエンジニアへ積極的に声をかけてくれるので、前職で感じた孤独感やコミュニケーションの少なさに対する懸念もすぐに解消されました！ 他のエンジニアメンバーとは普段顔を合わすことがなくてもSlackでいつでも交流できますし、月に一度の社内イベントでは同世代のエンジニアと会話を楽しめるのでとても嬉しいです！"},{"type":"question","text":"Tさんはイベントですぐに他のエンジニアとも打ち解けていた印象があります...！収入面や働き方にも新たな変化はありましたか？"},{"type":"answer","text":"かなり変化がありました！ 収入がかなり増え、自由に使えるお金が増えました。早速新しいPCを買うことができて嬉しいです。まだまだ私自身、スキルは未熟で伸びしろしかないと思っているので、今後もスキルアップしながら収入を上げていきたいなと考えています！ また、働き方がフルリモートになりプライベートの時間も増えたので、今の案件で日々学んでいることの復習や独学の時間を作れるようになりました。最近はAWSにも触り始めています。 通勤時間がなくなった分運動の機会は減ってしまったので、散歩の時間を増やしたりと、生活にもゆとりを持って時間を使えるようになりました。趣味のゲームもしっかり楽しむ時間を確保できています。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"向上心が高くポジティブなTさんの今後の活躍が楽しみです！エンジニアとしてはどのようなキャリアを築いていきたいのでしょうか？"},{"type":"answer","text":"まずはスキルを上げることを最優先に取り組んでいきたいと思います。スキルアップは大前提で上流工程の経験を増やして、ゆくゆくはPL／PMも担えるようなエンジニアを目指していきたいですね。 これまでも2~3個の案件を経験して色々なタイプのリーダーと出会い、自分ならどのような立ち回りができるのかな？と自然に考えるようになりましたし、今後は自分もその役割を担いたいなと考えています。"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"エンジニア・営業メンバー関係なく、出会う人がみんな『エンジニアへの思いが強い』と感じます。主体的なメンバーも多いですが、積極性がなくても助けてくれるような組織やカルチャーがあるので、安心して働けるのではないかなと思います！転職で叶えたいことが一つでもある方なら、必ず希望を実現できると思うのでオススメの環境です！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
