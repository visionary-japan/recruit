    <script id="interview-data" type="application/json">{"slug":"e3V6cgUG","role":"エンジニア","skills":"Java, SQL","initial":"M.H","title":"「ここにいて良いんだ」と思える組織で自分らしく活躍！","tags":["リモートワーク","人と社風が好き","サポート体制","案件選択制","ワークライフバランス","スキルアップ支援","心理的安全性"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/fbae6f4cae19481b9071f1f8ca4bd55b/s-600x412_a0a2802d-29e8-4155-9bc7-4e41be77d13d.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/f7c9275874df4daa84d932d73c777931/interview-e3V6cgUG-top.webp","alt":"「ここにいて良いんだ」と思える組織で自分らしく活躍！"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"社会人になってから直ぐにエンジニアになったわけではなく、最初は公認会計士を目指していました。ただ、勉強していく中で数字に弱いことに気づいて...（笑）以前からIT業界に興味があったこともあり、エンジニアとしてのキャリアを歩むことを決意しました。しかし、最初に入社した企業がいわゆるブラックで...。「働く環境を変えたい」と思い転職を決意し、最終的にVisionary AIに入社することを決めました。 現在は、某大手食品企業の物流系システム開発案件に参画しています。要件定義からリリースまで一連の流れを担当しています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"前職は、色々と大変な思いをされたとお聞きしましたが..."},{"type":"answer","text":"そうですね...。「質問しても回答を教えてもらえない」「案件も自分で決められない」「熱が出ても休めない」「ハードワークを強いられる」等、とても辛い思いをしました。エンジニアとして初めて入社した会社だったということもあり「IT業界=キツイ」という印象が定着してしまいましたね。"},{"type":"question","text":"IT業界にネガティブなイメージを持っていたHさんが、新たにエンジニアとしてのキャリアを進む道として、Visionary AIを選んでいただけたのは何故だったのでしょうか？"},{"type":"answer","text":"前職の経験もあったので「主体的に案件を選べるか」「自分が描いているキャリアを歩むことができるのか」「年休120日以上あってしっかり休めるのか」といった点を重要視して転職活動を進めていました。ただ、そのような会社の制度や仕組みを整えている企業は複数あったので、最終的にはその会社で働く『人』が自分と合いそうかを面談時に見ていました。 そんな中で、Visionary AIを選ぶ一番の決め手となったのが、代表の人間性でした。私の将来のなりたい姿や描いているキャリアを丁寧に聞いてくれたうえで、達成の方法を一緒に考えてくれました。面談では、キャリアのことだけではなくプライベートのことも結構話したんです！私は趣味がゲームなのですが、時期によっては大会に出場するほど熱中していて...！仕事以外にも、人生で大切にしていることが沢山あるのですが、その話を楽しく聞いてくださり「ありのままの自分を受け入れてくれる」と思いました。 話していくうちに徐々に「自分としっかり向き合ってくれる会社だな」「自分らしく働ける会社だな」と確信して入社を決めました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/13b43907e0e94f858d2d67d596d1c97e/interview-e3V6cgUG-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"Hさんが入社してくれて本当に嬉しかったです！実際に入社してみていかがでしょうか？"},{"type":"answer","text":"実際に入社して驚いたのは、主体性のあるメンバーが多いことです。毎週自主的に勉強会を開催している人、副業で一人でアプリ開発をしている人など、人生や仕事に対しても前向きなメンバーがとても多いです。そんなメンバーたちと話すと「自分も頑張ろう」と常に高いモチベーションが維持できるので、とても良い環境だと思っています！"},{"type":"question","text":"個性豊かな色々なメンバーが集まっていますよね！他にもあれば教えてください！"},{"type":"answer","text":"本当に個性豊かで素敵ですよね（笑）また、営業のサポート体制もしっかりしていると思います。皆さん気さくで話しやすく、気軽に相談できます！Slackで有給取得の報告をすると「ゆっくり休んでね！」等の労いの言葉をかけてくださったり、テキストのやり取りからも温かみを感じます！"},{"type":"question","text":"Hさんが安心して働けていて良かったです...！案件が決まるまでも不安はなかったでしょうか？"},{"type":"answer","text":"この業界でよくある「貴方のスキル感だとこの案件しかないです」のような提案が一切なく、事前に伝えてある希望にマッチした案件を沢山紹介していただけるのでとても助かってます！ 仮に自分の希望度の低い案件の紹介があっても、気軽に断れる雰囲気です。私の場合は、上流工程に携われることと、顧客折衝の経験を積めることの2点を希望としてお伝えしたのですが、実際に今参画している物流系システム開発の案件ではその２つの希望がしっかり叶えられているので、とても満足しています！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"良かったです！上流工程も卒なくこなすHさんは、今後どのようなキャリアを築いていきたいのでしょうか？"},{"type":"answer","text":"「一緒に働く仲間から頼ってもらえるリーダー」のようなマネージャー的なポジションを目指したいと考えています！私は仕事もプライベートもやりたいことが多すぎて、まとめられない性格だなと思っているのですが、『人のために何かをする』ことは自分の全ての行動の原動力になるんです。なので「頑張りたい」「成長したい」などの思いを持つメンバーを支えながら一緒に伴走することで「私に聞いてよかった、頼ってよかった！」と思ってもらえるようになりたいんです！ そのためにはエンジニアとしても成長しなければいけないので、とりあえず今は春に受ける応用情報技術者試験の勉強を頑張っています！来年はプロジェクトマネージャー試験も受ける予定なので努力し続けたいと思います！"},{"type":"heading","text":"最後に"},{"type":"question","text":"素敵な目標ですね！弊社一同応援しています...！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"一言で当社を表すとしたら「ここにいて良いんだと思える組織」だと思います。分からないことなどは他のエンジニアにも気軽に相談できますし、営業メンバーも他人行儀ではなく心から寄り添ってくれるので、孤独を感じた事は一切ありません。 「人間関係」「評価制度等の仕組み」「キャリア形成」どれをとってもVisionary AIに入社したら絶対に後悔はしないと思うので、まずは気軽に応募してみてください！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
