    <script id="interview-data" type="application/json">{"slug":"_N59ghWi","role":"エンジニア","skills":"Java","initial":"R.H","title":"代表の思いや理念に紐づく会社づくりに共感！新たなキャリアの実現へ","tags":["案件選択制","リモートワーク","上京して就職","モダンな開発環境","人と社風が好き","ワークライフバランス","理念共感"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/c04a304d4f494ad79576e343cb06bff0/s-600x412_c6dc658e-8b60-4902-9a38-708360efae9b.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/df87a13f45c2409da193b8d1fe62831a/interview-_N59ghWi-top.webp","alt":"代表の思いや理念に紐づく会社づくりに共感！新たなキャリアの実現へ"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴を教えてください！"},{"type":"answer","text":"ファーストキャリアでは地元の広島県の病院で作業療法士として働いていました。8年間勤務した後、自分のキャリアを見つめ直し、ITエンジニアに転職しました。現在、エンジニア歴は4年目です。 Visionary AIに入社してからは、大手自動車メーカーのシステム開発に携わり、AWS環境で、Java(Springboot)、SQL、Pythonなどを使い要件定義から関わっています。今はリバースエンジニアリングがメインで、日々コードを解読して修正する作業をしており、もう少しで設計フェーズに移行できそうです。難易度の高い作業もありますが、モダンな開発環境でやりがいを感じながら働いています！"},{"type":"question","text":"ありがとうございます！Sさんの話を聞けることを楽しみにしていました！今の案件ではどのような技術や工程に挑戦されているのですか？"},{"type":"answer","text":"現在は詳細設計から結合テストまでを担当しており、上流工程にも携わることでプロジェクトの全体像を理解する力も身につけることができています。技術環境もReactやAWSといったモダンな技術を使っているので、自分のスキルアップにも繋がっています。 また、新たに研究費が下りて、画像AIの研究も行っているんです！こちらはPythonを使用しています。画像AIに関する開発環境は統計ヒストグラムなどの専門性も求められ、難しい点も多いのですが、新しい技術を学ぶことができてとても嬉しいです！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"Visionary AIには様々なバックグラウンドのメンバーがいるのですが、元医療従事者は珍しいです...！なぜIT業界にキャリアチェンジしたのでしょうか？"},{"type":"answer","text":"確かに珍しいかもしれませんね（笑）作業療法士として働いていた時も仕事や患者さんが大好きで、医療業界の「人との関わり」が自分に合っていると感じていました。 しかし、勤務していた病院では電子カルテや勤怠システムがあるにもかかわらず、スタッフが使いこなせずアナログな環境でした。この現状を見て「医療業界はマンパワー不足と言われているが、不要な事務作業に時間を費やしているため、患者様と向き合う時間が減っているのではないか」と感じました。 その結果、「一人ひとりの患者様と向き合うよりも、医療従事者全体の働き方を改善する仕組みを作る方が問題解決に繋がるのではないか」と考え、システムを作る側のITエンジニアを目指しました！"},{"type":"question","text":"作業療法士の経験が糧となり、医療業界をより良くする手段として自らITエンジニアを志したのですね。本当にかっこいいです...！"},{"type":"answer","text":"ありがとうございます！作業療法士の仕事を辞めることに最初は迷いがありましたが、8年間という長い期間しっかりキャリアを築いたことで、「今、作業療法士のキャリアをストップしても、もう0にはならない」という自信を持てました。そのおかげで、新しい仕事に挑戦する決断を思い切りよく踏み切れたんじゃないかなと思っています！"},{"type":"question","text":"一つの道を極めたからこそできる決断ですね。エンジニアとして新たなキャリアを築く中で、今回転職を検討した理由は何だったのでしょうか？"},{"type":"answer","text":"一番の理由は「よりエンジニアとしてのスキルの幅を広げるために、自分で参画する案件を選びたい」と考えたためです。前職は受託とSESが半々で、案件も全て会社都合で決まる環境でした。レガシーな開発環境の案件が多く「この環境では自分の学びたいスキルを伸ばせず、キャリアも運任せになってしまう」と感じました。 また、医療業界のように「人」の繋がりが強い環境にいたためか、前職の”人のスキルや成果・成長＜勤続年数や残業時間が評価・報酬に繋がる環境”が自分に合っていないと感じてしまっていました。"},{"type":"question","text":"そうだったんですね...！数ある会社の中で、Visionary AIを選んでくださったことがとても嬉しいです。入社の決め手は何だったのでしょうか？"},{"type":"answer","text":"決め手は3点あります！ 1点目は『営業力が高く、豊富な案件からキャリアを選ぶことができる』点です。他社の話も数社聞いていましたが、Visionary AIが最も保有している案件数が多く、営業組織の営業力を活かした顧客基盤があることが信頼に繋がりました。 2点目は『自分のエンジニアとしてのレベルに応じて報酬が決まる単価連動制』です。前職では年功序列の評価制度で、現場で成果を上げたり、案件単価が上がっても、給与に反映されることはなかったです。そのため、顧客の評価や自身の成長と連動するシンプルな評価制度に惹かれました。 3点目は『代表の理念に紐づく会社づくりとそこに懸ける思い』です！正直最初は「なぜここまでエンジニアへの高待遇が実現できるんだろう」と疑問に思い、面談で代表に質問したんです。そのときに、Visionary AIが掲げる理念【大切な人に誇れる会社で在り続ける】を実現するために『社員が幸せでよりよい人生を送ってほしいからこそ、一つの手段として高待遇も実現できる仕組みを整えている』という思いと、その仕組みを聞きました。そこで、会社の考え方や背景を詳しく知ることで、より強く共感しました。また、”人ありきで会社を創っていく”という姿勢も、自分の価値観と合っているなと思いました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/916af5648b5442bda10d300d18ebf2d6/interview-_N59ghWi-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"代表の小野も、面談のときからHさんとはフィーリングが合っていたと話していました！Hさんに入社いただけて本当に嬉しいです！実際に入社してみていかがですか？"},{"type":"answer","text":"入社時に叶えたいと思っていたことは全て叶えられました。案件を選ぶ際にも、正直どれに参画しようか迷うほど魅力的な案件がありましたが、最終的に新しい技術に触れられ、プロジェクト規模が大きく、今後も様々な選択肢が生まれやすい案件を選びました。念願だったPythonにも触れられてとても嬉しいです！ これまでは会社から指示された案件に参画していたので、案件参画前に面談を受けるのも初めての経験でした。自分のスキルを整理して相手に伝えることや、顧客の求めるスキルとすり合わせることも新鮮でとても学びになりました。"},{"type":"question","text":"Hさんは面談時から顧客の評価が本当に高かったです！Hさんの実力もあり、今の案件に参画できたと思います。営業のサポート体制はいかがでしょうか？"},{"type":"answer","text":"専属の担当というわけではなく、営業チーム全体でサポートしてくださるので安心して働けます。前職では契約終了のタイミング以外に連絡がなく、営業との関わりがほぼありませんでした。「何かあったときに頼れる」「状況に応じて交渉も相談できる」という信頼があるVisionary AIの営業組織はとても心強いです。"},{"type":"question","text":"ありがとうございます！Hさんは入社と同時に岡山から上京されたと伺いましたが、働き方やプライベートにも変化はありましたか？"},{"type":"answer","text":"そうなんです。転職活動を進める中で、コロナ後の今はフルリモートの案件が減っていることや出社のメリットを提唱する企業の増加を踏まえ、「エンジニアとしてのスキルを高める」ためには、モダンな開発環境かつ案件の選択肢が多い関東で働く方が目的を達成できると考えました。それで思い切って上京しました！ 前職はフル出社や案件によっては3ヶ月ホテル暮らしの時期もあり、時間や場所の制約が厳しかったのですが、今は神奈川で暮らしながらフルリモートでフレックス勤務が実現できています！自分の時間が増え、朝に洗濯したり自炊したりと、時間の余裕が生まれました。"},{"type":"question","text":"上京した今もHさんらしく働けていて嬉しいです！『人』を大切にされているHさんから見たVisionary AIの組織の印象はどうですか？"},{"type":"answer","text":"Visionary AIに入社して、IT業界のイメージが変わりました。一言で言うと、『人が好き』なエンジニアが多い印象です！話していても同じマインドの方が多く、皆さんが代表や経営陣のマインドに惹かれている共通項があるからだなと思いました！ 先日の全社会では、同世代のエンジニアと話す機会があり、技術面や仕事の姿勢、趣味の話など様々な話ができて、とても有意義な時間を過ごせました。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"本当に人として魅力的なメンバーが多いなと私も日々実感します！目標も明確に考え行動されているHさんの今後の展望をお伺いできますか？"},{"type":"answer","text":"エンジニアとしてのキャリアはまだ4年しか経っていないので、まずはもっと自信を持って取り組める業務を増やしていきたいと考えています。設計工程も一人称で自信を持って任せてもらえるようになりたいですね。今後も様々な言語、システム、ツールに触れながら、何でも対応できる技術力の高いエンジニアを目指していきたいです！ ただ、スペシャリストばかりの組織でもマネジメントが行き届いていなければ意味がないと考えています...！マネジメント機能によってプロジェクトのメンバーのパフォーマンスも上がると思うので、ゆくゆくはマネジメント領域にも挑戦し、プロジェクト全体を見ていけるようなエンジニアを目指していきたいと考えています。"},{"type":"heading","text":"最後に"},{"type":"question","text":"Hさんなら必ず目標を実現できると思いますし、今後の活躍を弊社一同楽しみにしています！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"Visionary AIは『人』を大切にする会社です。一緒に働く仲間も経営陣も素晴らしく、エンジニアとして成長できる環境が整っています。自分のスキルを磨きたい、今後叶えたい目標があると考えている方にはぴったりの会社だと思います！少しでも魅力に感じる点がある方はぜひ一度応募してみてくださいね！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
