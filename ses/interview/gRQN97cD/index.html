    <script id="interview-data" type="application/json">{"slug":"gRQN97cD","role":"エンジニア","skills":"Java, React, Python","initial":"M.S","title":"案件選択制を活用して、人生もキャリアもより豊かに！","tags":["案件選択制","リモートワーク","人と社風が好き","ワークライフバランス","好きな場所で働く","高還元","社内業務なし"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/c00a06dbf9994e5fbaddd488bd3826df/s-600x412_18c98a03-6ba8-41a3-9ca0-43867a0578a5.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/773efd04a44945f69febadb117fcf263/interview-gRQN97cD-top.webp","alt":"案件選択制を活用して、人生もキャリアもより豊かに！"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴を教えてください！"},{"type":"answer","text":"エンジニア歴は今年で5年目になります。これまでは主にWEBアプリの開発に携わり、Java、JavaScript(React)、Pythonなどを使用してきました！ 現在はVisionary AIに入社し、製造業向けのIoTアプリ開発プロジェクトに参画しています。大手電力会社のサービスの一部も開発しており、今後多くのユーザーが利用することが予想される大規模なプロジェクトなので、日々やりがいを感じながら働いています。 これまでWEBアプリの開発経験はありましたが、産業向けの実機と連携を含む開発は初めてです！これまでの経験を活かしつつ、新しい知識や技術を身につけることができているので、成長の機会にもつながっています！"},{"type":"question","text":"ありがとうございます！Sさんの話を聞けることを楽しみにしていました！今の案件ではどのような技術や工程に挑戦されているのですか？"},{"type":"answer","text":"現在は詳細設計から結合テストまでを担当しており、上流工程にも携わることでプロジェクトの全体像を理解する力も身につけることができています。技術環境もReactやAWSといったモダンな技術を使っているので、自分のスキルアップにも繋がっています。 また、新たに研究費が下りて、画像AIの研究も行っているんです！こちらはPythonを使用しています。画像AIに関する開発環境は統計ヒストグラムなどの専門性も求められ、難しい点も多いのですが、新しい技術を学ぶことができてとても嬉しいです！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"やりがいを感じながら成長できる環境なんですね！早速なのですが、今回転職を考えたきっかけを教えてください！"},{"type":"answer","text":"パートナーと同棲を開始しようと話したことが転職を考えるきっかけになりました。今後2人で生活していく上で、私自身も自立した生活を送りたいと思い、前職の給与や評価制度に少し不安を感じていました。 前職は受託開発企業だったので、自分が携わりたい案件を選ぶことはできず、会社から指示された通りに参画するスタイルでした。案件の参画期間が2~3年と長期だったため、チームメンバーも変わらず、業務や知識が限定的になりがちだったんです。今後はより技術力を高めたり、様々な方と働きながら学ぶことができる環境が良いなと思いました！ また、代表の考える会社の方針や思いがわからないという不透明さや、社内業務が多く開発だけに集中できない環境なども改善したいと思い、転職活動を始めました。"},{"type":"question","text":"仕事もプライベートも改めて色々と見直す機会になったんですね！転職活動を進めていく中で、Visionary AIを選んだ理由を伺いたいです！"},{"type":"answer","text":"様々な観点で考えた結果、私の希望を最も叶えられる環境だと思いました！特に「案件を自分で選べること」が一番の決め手でした。他の会社では案件がないと言われたり、遠方に出社が伴う案件を紹介されたりすることが多かったため、営業力が高く選べる案件の選択肢が多いVisionary AIに惹かれました。 また、面談で話した時に小野代表とフィーリングが合うと感じました。これまでも一緒に働く組織や人を重視して職場環境を選んでいたのですが、小野代表の作る会社であれば、信頼できるし自分らしく働けると感じました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/5b89fc7c56f04bc080e1c54d63bfd143/interview-gRQN97cD-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"ありがとうございます！小野代表からも面談の後「絶対にVisionary AIが合っている」とお聞きしました（笑）実際に入社してみていかがですか？"},{"type":"answer","text":"営業チームの皆さんから様々な開発環境に携われる案件を紹介していただき、希望通りの案件に参画することができました！元々受託しか経験がなかったため、最初は参画に不安がありましたが、営業の皆さんのサポートもあり、慣れてきた今では新しい環境で様々な方と一緒に働くことで新たな技術を学び、成長の機会にも繋がっています。 また、残業や社内業務の負担が大幅に減ったので、パートナーと過ごしたりとプライベートの時間をより大切にできるようになりました。年収もかなりアップしたので、結婚式の準備でも美味しい料理をたくさん提供できるプランを選んだりと、嬉しいことがたくさんありました！ 評価制度についても、単価連動型はモチベーションを維持しやすく、私に合っていると感じています。努力や成長が正当に評価されて給与に繋がるのでやりがいも感じています。"},{"type":"question","text":"改善したいと考えていたことをどれも叶えることができて私達も嬉しいです...！一緒に働く人を重視されているSさんにとってVisionary AIの組織やカルチャーはいかがですか？"},{"type":"answer","text":"良い意味で社員の皆さんが想像以上にフランクで驚きました！前職では控えめな方が多く、私は発言が多い方だったんです（笑）Visionary AIのエンジニアは社交的な方が多く、日常的にSlackでコミュニケーションを取ったり、勉強会などで盛り上がっています。遠方で暮らしていても、どんな方と一緒に働いているのか知ることができて嬉しいです。 また「社内イベントに参加したい」といつも思っていたので、4月の全社会で皆さんにお会いできたのがとても嬉しかったです。本社メンバーの皆さんが頑張って準備してくださったと思いますが、満足度も期待以上でした。また開催してほしいなと今から楽しみにしています！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Sさんにも楽しんでいただけて良かったです！Sさんは今後エンジニアとしてどのようなキャリアを築きたいと考えているのでしょうか？"},{"type":"answer","text":"目標は「人に優しく教えられるエンジニアになりたい」と思っています。そのためには、私がもっと知識をつけて技術力を上げる必要があるので、上流工程の経験を増やし、技術系の資格も取得していきたいです。 昔、私を育ててくださった先輩が優しく、時には厳しく指導してくれたことに影響を受けており、おかげで成長できたと感謝しているんです！私もそのような存在になりたいですし、マネジメントスキルも身につけて、PMやPLとしてチームを引っ張っていけるようにもなりたいと思ってます！"},{"type":"heading","text":"最後に"},{"type":"question","text":"素敵な目標ですね！ぜひVisionary AIを引っ張っていくメンバーとして、今後も活躍していってほしいです！最後に候補者に一言いただけないでしょうか？"},{"type":"answer","text":"Visionary AIは活気があって、一人ひとりが伸び伸びと働ける環境です。希望するキャリアを実現できる環境が整っており、成長機会も豊富にあります！私自身も入社してから多くのことを学び、成長することができたと実感しています。皆さんもぜひ、Visionary AIで新たな一歩を踏み出してみてくださいね！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
