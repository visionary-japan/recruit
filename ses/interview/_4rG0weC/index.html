    <script id="interview-data" type="application/json">{"slug":"_4rG0weC","role":"エンジニア","skills":"Kotolin, Dart","initial":"M.T","title":"地元大阪にUターン！営業力の高さが信頼に","tags":["リモートワーク","人と社風が好き","案件選択制","好きな場所で働く","モダンな開発環境"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/08293ca0b53a46a0b0ed8e643634c38a/s-600x412_d7773712-0c69-4010-a727-9e53faf10abc.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/7cd52adec3f24ff992ade3fe033d65c1/interview-_4rG0weC-top.webp","alt":"地元大阪にUターン！営業力の高さが信頼に"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"元々は営業としてキャリアをスタートさせたのですが、次第にエンジニアに興味を持つようになり、思い切ってIT業界に飛び込みました。エンジニアとしてのキャリアをスタートさせてからは、3社ほど経験し、Visionary AIは4社目の企業になります。 現在は東京から地元大阪にUターンし、Flutterを用いたモバイルアプリ開発を担当しており、設計〜テスト工程までアジャイルで幅広く対応しています。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"珍しいキャリアですね！営業→エンジニアにキャリアチェンジしようと思ったきっかけを教えていただけますか？"},{"type":"answer","text":"ITの導入や活用を検討している企業様に対して、導入支援を行う会社で営業を担当していました。営業活動の一環として、エンジニアと同行してお客様先にお伺いすることが多く、エンジニアの仕事を間近で見るうちに、次第に技術側に興味を持つようになりました。ある時、お客様からの要望で私自身がパソコンを触る機会があったのですが、それがきっかけで「エンジニアに挑戦してみたい」と思うようになり、思い切ってIT業界に飛び込んでみました（笑）！"},{"type":"question","text":"とても勇気のいる決断ですね.！実際にエンジニアになってみてどうでしたか？"},{"type":"answer","text":"営業の仕事をしている時は上司の指示や考え方に納得できないことが事が多々ありました。一方でエンジニアの仕事は因果関係が明確で、突き詰めれば不明瞭なことは無く正解がある仕事です。 納得感をもって仕事をしたい私にとっては、エンジニアの仕事はまさに「自分の性格に合ってるな」と思いますし、面白さと楽しさの両方を感じながら働くことができてます！"},{"type":"question","text":"自分の好きな仕事と出会えてよかったです！エンジニアとしてキャリアをリスタートし、Visionary AIに入社した経緯を教えてください！"},{"type":"answer","text":"実はIT業界に入ってからは何社も渡り歩き、Visionary AIが4社目の企業になります。1社目は未経験から開発に携われると聞いて入社したのですが、全く開発することができない社内SEとして働いていました。2社目はSES企業に入社し、開発案件に入れたものの、会社が倒産してしまって...3社目は人間関係や案件自体もとても気に入っていたのですが、急遽、会社都合で案件を退場になってしまいまして...。 「自分が主体で案件を選べる会社に行きたい」と思い、転職活動を進めていました。Visionary AIの面談では、営業力の高さや案件選択制、高還元等の詳細を伺い、「この会社なら完璧な環境だ」と思いました！内定を頂いたときにとても嬉しかったことは今でも覚えています。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/967fcefaa028455ea9a0a28b9e3135cd/interview-_4rG0weC-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"実際にVisionary AIの“案件選択制”を活用してみていかがでしょうか？"},{"type":"answer","text":"前職は実務で経験している技術であっても、中々マッチした案件を紹介していただけませんでした。Visionary AIに入社してからは、営業の方に「Flutterに挑戦したい」と伝えると、マッチ度の高い希望通りの案件を沢山紹介していただけたので、とても驚きました。 また前職では、営業の方に連絡しても中々返信がもらえず、不安になることも多かったのですが、Visionary AIの営業は驚くくらいレスが早いので助かっています。むしろ早すぎて「もっとゆっくりでも良いですよ」って言いたいくらいです！ 案件も自由に選べますし、安心して働くことができているので「やっとこの会社で落ち着けるな」と思っています（笑）！"},{"type":"question","text":"Visionary AIの営業組織はエンジニアメンバーのレスを最優先するというルールがあるので、全員レスが早いんです（笑）！他にもカルチャーに対する印象はありますか？"},{"type":"answer","text":"全体的にエネルギッシュな方が多い印象ですね！勉強会もエンジニアが主体的に開催していますし、Qiitaはエンジニアだけでなく営業メンバーも執筆していたり...様々なSES企業に在籍していましたが、ここまで活発な会社は今までありませんでした。 一方で、社員全員に対して活発的になることを求めている訳ではなく、頑張りたい人は頑張って、ゆっくりしたい人はゆっくりできます。自分のペースで過ごすことができるので、居心地も良いなと思います"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Kさんがまた東京に来る機会があればお会いしたいです！今後、エンジニアとしてはどのようなキャリアを築いていきたいですか？"},{"type":"answer","text":"そうですね。営業の知識や経験を活かして、エンジニアとしても人と関わる仕事にチャレンジしたいです！具体的には要件定義、スクラムマスター、PM・PL等...プロジェクトをまとめたり管理する側にも挑戦してみたいですね！その為にもまずは目の前の仕事を全力で頑張って、今以上にモバイルエンジニアとしてのスキルを高めたいです！"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"「こんな技術に挑戦してみたい」「もっと上流工程にチャレンジしたい」等、エンジニア自身が100%案件を選ぶことができるので、実現したいキャリアがある人にこそピッタリの会社だと思います！少しでも気になる方には是非一度話を聞きに来てほしいです！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
