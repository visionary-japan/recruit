    <script id="interview-data" type="application/json">{"slug":"hpWlVnVj","role":"エンジニア","skills":"Java, PHP","initial":"A.F","title":"キャリアアップを目指し福岡から東京へ！心強いサポート体制が安心に","tags":["リモートワーク","人と社風が好き","高還元","サポート体制","スキルアップ支援","ワークライフバランス","上京して就職"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/d4d979db3ac849eb926d6351996024bf/s-600x412_8ca5fcea-4e27-47ad-81e5-de3db5703d02.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/f8de358478fb4d47a953b0ef7bbac5b6/interview-hpWlVnVj-top.webp","alt":"キャリアアップを目指し福岡から東京へ！心強いサポート体制が安心に"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"元々は新卒で入社した九州のIT企業でエンジニアとして働いていたのですが、転職をきっかけに上京してきました！ 初めての転職だったので、会社選びにものすごく迷いましたが、結果的にVisionary AIに入社することに決意し、今は印刷会社で使用される画像処理システム開発の詳細設計からテストまで携わっています。言語はC#を使用しています。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"Visionary AIが初めての転職先でとても嬉しいです！何社か選考を受けていたとお伺いしていますが、その中でもVisionary AIを選んだ決め手を教えてください！"},{"type":"answer","text":"前職ではC#を使用した画像処理に関連するシステムを中心に開発していました。ただとてもニッチで限定された業務だったので「もっと色々な言語をできるようになりたい！」と思うようになり、転職活動を始めました。 また、社内の関わりがほぼなく、営業やエンジニアの方と話す機会もほとんどないような環境でした。そのため、孤独に感じてしまうこともあり「もっと社員を大切にしてくれる環境で働きたい」「社内で繋がりを感じられる環境で働きたい」とも感じていました。 転職活動を進めていく中で、SES企業だけでなく受託企業の選考等も受けていたのですが、Visionary AIの面談を受け、代表からも一番熱量を感じ「この会社なら私も一緒に頑張れそう」「エンジニア一人ひとりを大切にしてくれそう」と思ったのが入社の決め手になりました。"},{"type":"question","text":"そう言っていただけてとても嬉しいです！九州から東京に上京するにあたって、不安等はありませんでしたか？"},{"type":"answer","text":"元々高校生の時も寮生活だったこともあり、家を出ることに抵抗はなかったので特段不安はありませんでした！ ただ、都心の不動産を探すのが大変だったので、当社の福利厚生にある「引越し支援制度」を用いて不動産を紹介していただけたのはとても助かりました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/1f71b7778c114ff3b4eaf075ee17daca/interview-hpWlVnVj-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"前職では自社開発に携わっていたと思いますが、初めてSESに挑戦してみていかがでしょうか？"},{"type":"answer","text":"案件参画前のスキルシートの作成が初めてだったので少し不安はあったのですが、営業メンバーが事前に書き方のポイントを教えてくれたり、細かく添削をしてくれたりと親身に寄り添っていただいたので不安は払拭されました！ 案件決定の前に、営業メンバーの方に「どの案件に参画するのか」を相談に乗っていただけたこともとても嬉しかったです。最終的に複数のオファーをいただいたのですが、案件内容や今までの経験が活かせるか、描いているキャリアに繋がるのか等、細かくアドバイスしてくれたので納得感を持った状態で参画する案件を選ぶことができました。"},{"type":"question","text":"実際に入社して、良かったと思う点はありますか？"},{"type":"answer","text":"収入、人間関係、働き方全て想像以上だったのですが、一番驚いたのは収入面です！初めて自分の給与を伝えられた時、あまりにも前職よりも金額がUPしていたので、思わず「え、そんなにもらえるんですか！？」って言ってしまったくらいです（笑）！買い物も値段を気にせず買えるようになったり、好きなアーティストのLIVEにも行きやすくなりました！ 入社前はメンバー同士の交流はほぼないのでは...と思っていましたが、実際に入社してみると、エンジニアメンバー同士のコミュニケーションがとても活発で驚きました。毎月社内イベントが開催されるのですが、普段なかなか顔を合わせられないメンバーと直接会える機会なのでとても嬉しいです！毎月参加するのを楽しみにしています（笑）！ また、エンジニアメンバーが自由に発信できるSlackのチャンネルがあるのですが、実際に現場で起こったトラブルやその解決策等を共有している方もいるので、「そういうこともあるんだ」と学べるのも嬉しいですね。オススメの書籍やサイト等を紹介している方もいるので、新しい情報もキャッチアップできますし、エンジニアメンバーにも相談しやすい環境だなと感じています！"},{"type":"question","text":"ぜひSlackも活用してみてくださいね！ちなみに、働き方の変化等はありますか？"},{"type":"answer","text":"前職ではフル出社で残業も多かったので、休日はベッドから動けないくらい疲れ果ててました...（笑）。今は基本リモートで残業も少ない案件なので、体力的にも余裕が作れるようになりました！土日に自分が好きな事に時間を使えるようになったのでとても嬉しいです！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"健康的に過ごせるようになって良かったです！Fさんの今後の目標やキャリアプランを教えてください！"},{"type":"answer","text":"健康的に過ごせるようになって良かったです！Fさんの今後の目標やキャリアプランを教えてください！"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！今後の活躍が本当に楽しみです...！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"自分で案件を選べることが当社の魅力の一つだと思います。入社前は「本当に案件を選べるの？」と半信半疑でしたが、本当にエンジニアが自由に案件を選ぶことができます。また、案件を選ぶ際も「困ったことは無い？」「オファー貰っても、自分で行きたい案件を選べるからね」と営業の方から不安を解消しに来てくれるので、安心して働ける環境だと思います！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
