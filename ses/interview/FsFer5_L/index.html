    <script id="interview-data" type="application/json">{"slug":"FsFer5_L","role":"エンジニア","skills":"C#","initial":"K.I","title":"技術力を高めたい！“SIerからSES”へ転職した理由","tags":["案件選択制","リモートワーク","ワークライフバランス","社内業務なし","心理的安全性","スキルアップ支援"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/79efeb1bd2a7439eb47f83723712fb5b/s-600x412_c025bcc5-9b3a-4cee-9558-c3d7952eb998.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/b6a762a4bd6841ff98e3cb14f7fdf584/interview-FsFer5_L-top.webp","alt":"技術力を高めたい！“SIerからSES”へ転職した理由"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！簡単に自己紹介やこれまでの経歴を教えてください！"},{"type":"answer","text":"はじめまして！エンジニア歴は5年ほどでC#をメインに扱ってきました。今後は開発スキルを高められる環境でキャリアを築きたいと思い、VISIONARY AIに入社しました！ 現在は、自動車関連の設計者向け管理システムの開発〜ツール移行プロジェクトに参画しています。C#、ASP.netを用いて基本設計から参画しています。要件定義寄りの詳細を詰めていくヒアリングなども担当し、初めて顧客折衝を経験できています！ 言語の仕様理解に時間がかかることもありますが、優秀なプロジェクトメンバーから日々学び成長を実感しています。プロジェクトの全体像を把握できる、とても良い経験を積ませていただいており、今後は詳細設計や実装工程に取り組む予定です。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"早速ですが、転職活動を考えたきっかけを教えていただけますか？"},{"type":"answer","text":"エンジニアとして技術力を上げていきたいと考えたことがきっかけでした。 これまでメーカー企業の社内SEや大手SIerのSEを経験してきましたが、どちらの環境でも社内向けプロジェクトが多く、学べることや経験できることが限定的でした。また、開発工程よりもPL補佐のような管理ポジションが多く、当時会社からも「2年目以降はコーディングやテスト工程よりもPL候補として活躍してほしい」と話がありまして...。『エンジニアとしてもっと技術レベルを高めたい』という思いを実現するのが難しいと感じたんです。 さらに、現在同棲しているパートナーとの今後のライフプランを真剣に考えた結果、異動が多いパートナーに合わせて私が働き方を選べる方が良いと思いました。そこで、労働時間や働く場所の自由度が高い環境を求め、転職活動を始めました。"},{"type":"question","text":"キャリアもライフプランも転機のタイミングだったんですね！そのような思いを持ち、転職活動を進めていく中で、VISIONARY AIを選ばれた理由を教えていただけますか？"},{"type":"answer","text":"前職の案件でプロパーとして参画していた時に、SESで参画しているエンジニアの方が活躍しているのを見て、『SESの働き方も選択肢として良いのではないか』と考えるようになりました。そう思い、求人サイトでSES企業の求人をいくつか見た結果、VISIONARY AIが最も透明度が高く、自分の希望が実現できる会社だと感じたんです！ 求人サイトの情報だけでなく、口コミサイトやブログ記事などを読み、選考前から会社のことを詳しく知ることができましたし、面談で小野代表と話した際に、それぞれの仕組みが本当に実現されていると感じました。 打ち出している情報と実際の働き方にギャップがないことから、一貫性の高さが信頼に繋がりました。また、SESの中でもエンジニアが主体に案件を選べる点や、帰社日や社内業務がない点も魅力的に感じました。ここなら、自分の希望するキャリアや働き方が実現できると確信し、内定をいただいてすぐに入社を決めました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/4294895412544d1da911bcba5aa0f16f/interview-FsFer5_L-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"様々な選択肢からVISIONARY AIを選んでいただきありがとうございます！実際に入社してみていかがですか？"},{"type":"answer","text":"入社前から期待していたことが全て実現でき、満足して働けています！特に社員同士のコミュニケーションが非常に取りやすく、前職よりも他の部署やプロジェクトの社員と話す機会が豊富なのが嬉しいですね！勉強会やSlackを活用したりと、相談しやすい環境が整っており、心理的安全性が担保されています。今後、他のエンジニアメンバーとチーム参画の機会があっても、互いに支え合い高められる組織だと感じています！ また、自分のスキルや経験次第で働く場所を自由に選べることや、時間の融通が利く点も嬉しいです。今後のライフプランを考えやすくなり、パートナーとの時間も優先して作れるようになりました。現在参画を決めた案件では、初めて顧客折衝から携わることができ、プロジェクトの全体像を把握しながら開発業務に取り組んでいるので、日々成長とやりがいを感じています。"},{"type":"question","text":"転職で叶えたいことを全て叶えることができて本当に良かったです...！先日参加した全社会はいかがでしたか？"},{"type":"answer","text":"様々なプログラムがあり、とても充実した時間を過ごせました。第一部の経営陣のトークセッションでは、会社の今後の方針やキャリアアップに繋がる内容を知ることができ、とても学びになりました。 また、全国各地で活躍するエンジニアメンバーと直接会うことで、組織の『人』の良さを改めて実感しました！良い意味で個性があり魅力溢れる、互いに尊重し合う素敵なカルチャーがあると感じました！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"ありがとうございます！Iさんも今後さらに成長されるのではないかと楽しみにしています！具体的にはどのようなキャリアを築きたいと考えているのでしょうか？"},{"type":"answer","text":"まずは、転職の軸として掲げていた『開発工程に携わり、エンジニアとしての技術レベルを上げていきたい』と考えています。今参画しているプロジェクトでもパフォーマンスを発揮し、ゆくゆくはチーム参画もできたら良いなと思っています！ 中長期的にはチームのマネジメントやPM・PLにも挑戦できるようなエンジニアを目指していきたいです。また、VISIONARY AIには魅力的なメンバーが揃っているので、自社プロジェクトにも積極的に参加していきたいです。"},{"type":"heading","text":"最後に"},{"type":"question","text":"素敵な目標ですね！チームVISIONARY AIで参画できるよう私達もサポートします！最後に候補者に一言お願いします！"},{"type":"answer","text":"VISIONARY AIは、入社前から入社後まで一貫して『透明度の高い会社』だと実感しています。仕組みや制度が整っているだけでなく、信頼できる組織で働くことができ、希望のキャリアも実現できる環境です。 選考の中で気になった点や質問に対しても、親身に包み隠さず話してくれるので、何でも聞いてみると良いと思います！描くキャリアや希望の働き方などマッチする方は、ぜひ一緒に働きましょう！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
