    <script id="interview-data" type="application/json">{"slug":"tSrl_h6m","role":"エンジニア","skills":"Java, React","initial":"T.N","title":"ブリッジSEを目指す！地元に戻り理想のキャリアを描く","tags":["案件選択制","リモートワーク","高還元","好きな場所で働く","ワークライフバランス","スキルアップ支援"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/3d3de057bce9429d91f8bae69b331422/s-600x412_4f4113cb-d9fe-4758-af6a-491070189bb6.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/0ce6685fcaec4b959d316ce565e41584/interview-tSrl_h6m-top.webp","alt":"ブリッジSEを目指す！地元に戻り理想のキャリアを描く"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！簡単に自己紹介やこれまでの経歴を教えてください！"},{"type":"answer","text":"エンジニア歴は今年で4年目で、JavaやReactを使ったWebアプリ開発に携わってきました。また、Visionary AIに入社を機に地元の愛知県にUターン転職しました！ 現在、大手自動車メーカーの国内外で利用される貿易関連システムの開発に携わっています。チームで協力しながら進める大規模なプロジェクトでやりがいを感じます！具体的には、調査〜要件定義〜設計〜開発〜リリースまでの全ての工程を経験でき、今は要件定義が完了し、設計の流れや期間・工数の見積もりを進めています。技術環境は主にJavaで、Android端末向けにC#も使用しています。今後は設計から開発工程にシフトしていく予定なので楽しみです！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"ありがとうございます！本日はよろしくお願いします！早速ですが、転職活動を考えたきっかけを教えていただけますか？"},{"type":"answer","text":"転職活動のきっかけは『地元の愛知に戻り、プライベートの時間を充実させたい』と思ったことです。東京の生活も充実していましたが、友人や家族と過ごす時間をもっと増やしたいと思いまして...！ 前職でもフルリモートで働ける案件には参画していたのですが『首都圏に住むことが前提』だったため、Uターンは難しかったんです。経験やスキル次第でリモートワークも可能な職種なので、働き方を柔軟に選べる環境を探そうと考え、求人やエージェントを通じていくつかの会社を見ていました。"},{"type":"question","text":"そうだったんですね...！様々な会社を見ていたと思いますが、最終的にVisionary AIを選んでいただいた決め手は何だったんでしょうか？"},{"type":"answer","text":"『単価連動型×高還元』『スキルアップ支援体制』『案件情報の全開示』の3点が決め手でした。 前職では案件の詳細を教えてもらえず、営業組織とも関わりが少なかったんです。キャリアに繋がる案件選びをサポートしてもらえる点がとても心強く感じました。 また、スキルアップ休暇や勉強会など成長環境が整っており、スキルや経験が収入に直結するシンプルな単価連動制の評価制度が、中長期的にモチベーションも高く保てると思い入社を決めました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/2943080d4f3b4785a8244ba454755b82/interview-tSrl_h6m-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"Visionary AIを選んでいただいて本当に嬉しいです！実際に入社してみていかがですか？"},{"type":"answer","text":"期待していた点が全て実現でき、充実した日々を過ごしています！前職では自分から営業に声をかけないと気にかけてもらえない環境でしたが、今は地方で働いていても、営業チームの皆さんが定期的に連絡してくれます。一度現場でトラブルがあった際にも、すぐにミーティングを組んで対応していただき解決したので安心しました。 年収もかなり上がったので、生活に余裕が生まれて趣味も楽しめるようになりました！一番の趣味である旅行も、今後はもっと回数を増やせそうで嬉しいです。海外旅行も年1回くらいのペースで行きたいと思っています！ もちろん東京で過ごした4年間も楽しかったですが、大好きな地元名古屋での生活は家族や友達と過ごす時間を増やすことができ「周りの人を身近で大切にしたい」という思いが実現できてとても嬉しいです。"},{"type":"question","text":"転職がより充実した人生のきっかけに繋がり、私たちも嬉しいです！人を大切に思うNさんにとって、Visionary AIのカルチャーや組織はいかがですか？"},{"type":"answer","text":"遠方のため直接他のメンバーと会う機会は少ないのですが、距離を感じさせないほどSlackが活発に動いていて驚きました（笑）前職では月1回の帰社日で少し関わるくらいで、主体的に発信するメンバーがほとんどいなかったので、それぞれの人となりや誰がいつ入社したのかなどもわからなかったんです。 Visionary AIでは、主体的に自己開示するメンバーが多く、日常的に技術のことやプライベートのことなど様々な話題がSlackで発信されていますし、エンジニア主催で毎週勉強会も開催されているので「自分ももっと頑張ろう」と自然にモチベーションを高く維持できる活気ある組織だと思います！"},{"type":"question","text":"エンジニアの皆さんがそれぞれの現場で活躍しているので、様々な情報やトレンドを社内Slackから得ることができますよね！先日Nさんもtimesチャンネル(各エンジニアメンバーのつぶやきチャンネル)で発信されていましたよね！"},{"type":"answer","text":"旅行が好きなので、早咲き桜を見に行った際の写真をシェアしました！timesチャンネルを通して、普段会うことのできないエンジニアメンバーの皆さんのことを知ることができるので、いつも楽しみにしています！ また、先日の全社会では多くのエンジニアメンバーと直接会うことができて嬉しかったです！前職ではこのようなイベントがなかったので、とても有意義な時間になりました。 第1部の代表や経営陣からのお話も今後のキャリアを考えるうえでとても参考になりました。個人的には、学生時代に勉強を頑張っていた時期に聞いていた曲がエンドロールの映像とともに流れて嬉しかったです(笑)"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"私も同じく受験期に聞いていた曲でテンション上がりました！今後もエンジニアとして描きたいキャリアがあるNさんの今後の展望を教えてください！"},{"type":"answer","text":"まずは技術力の向上に集中したいと考えています。今年から来年にかけてJava Goldや応用情報技術者試験を取得し、今極めているJavaのスペシャリストとして自信を持てるようになりたいです。 その後はプロジェクト内でマネジメント領域にも挑戦し、元々好きな語学力の向上にも取り組んでいきたいと思います。昔から海外が好きで、プライベートでも英語や中国語を勉強していたんです。最近はオフショア開発がかなり増えてきているので、語学力とエンジニアのスキルを活かして30代前半には『ブリッジSE』として、海外の方と一緒に仕事ができるよう準備を進めていきたいと思います！"},{"type":"heading","text":"最後に"},{"type":"question","text":"『ブリッジSE』はNさんの強みを生かした最適なキャリアですね...！今後も会社全体でキャリアをサポートしていきます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"Visionary AIは「好きな場所で働きたい」という希望を叶えたいエンジニアにとっても最適な環境です。選べる案件も豊富ですし、高還元の仕組みが整っているため、中長期的にも収入を上げることもできます。もし迷っている方がいれば、まずはぜひ話を聞いてみてください！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
