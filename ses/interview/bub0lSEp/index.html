    <script id="interview-data" type="application/json">{"slug":"bub0lSEp","role":"エンジニア","skills":"Java, C#","initial":"K.M","title":"「挑戦したい」が叶う！フルスタックエンジニアへの道","tags":["人と社風が好き","案件選択制","営業力の高さ","モダンな開発環境","スキルアップ支援","リモートワーク"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/6b44756f744c4ab7a6131a9077d5a95c/s-600x412_d5b86b1f-8e04-4a12-8e1d-c3a0d1341cac.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/49866af5b84e4271aa4086b7623e16b2/interview-bub0lSEp-top.webp","alt":"「挑戦したい」が叶う！フルスタックエンジニアへの道"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"元々エンジニアとして働いていたのですが、前職ではキャリアやスキルアップできる環境が少なく「もっとスキルを上げたい」と思うようになり、Visionary AIに転職しました！ 現在は、フロントエンド／バックエンドの両方を経験できる案件に参画しています。ReactやSpringBoot等を活用し、開発工程を一人で一貫して担当しています。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"前職に対してはあまり不満はなかったということでしたが...それでも転職を考えた理由を詳しくお伺いできますか？"},{"type":"answer","text":"そうなんです。実は、前職の会社に対して特段大きな不満等はありませんでした。ただ、保有している案件がレガシーなものが多く「この会社で理想のキャリアを築けるのだろうか」「この会社に居続けていいのだろうか」となんとなく漠然とした不安があって... 案件も自分自身で選べる環境でしたが、複数案件の中から面談を受けたい案件を選ぶのではなく、紹介された案件を一つずつ受けるかどうかを判断し、合否次第で別の案件を紹介するという流れだったため、「本当にこの案件がやりたいのか」という判断をするのが難しいと感じていました。そういった思いもあり、「他の会社も見てみようかな？」と考え始めたことをきっかけに転職活動を始めました。"},{"type":"question","text":"Visionary AIを選んだ決め手を教えてください！"},{"type":"answer","text":"Visionary AIの営業力の高さを活かした案件選択制に惹かれました。キャリアから逆算して最適な案件を選ぶことが出来るので、「新しいことに挑戦できそう」と感じたことが一番の決め手ですね！ また、前職は誰が社内にいるのかわからないほど交流がない環境だったので、同世代の向上心の高いエンジニアメンバーが在籍していて、勉強会や社内イベント等で交流が盛んであることにも魅力を感じました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/3c4e402bc17f4a2393e323419cc594fe/interview-bub0lSEp-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"ありがとうございます！実際に当社に入社してみて、いかがですか？"},{"type":"answer","text":"転職前に感じていたような将来に対する不安は一切なく、解消されました！Visionary AIは営業力の高さを活かした案件選択制が整っているので、自分が「本当にやりたい」と思う案件を選ぶことができます。スキルアップ出来る案件に参画して、技術的に新しい事に挑戦できる環境なのが嬉しいですね。営業の方も頼れて案件数も豊富ですし、とてもレスが早いので相談しやすいです。 また、スキルをどんどんあげていこう！ってメンバーも多く、自主的に勉強会の開催やスキルアップ制度も整っているので、僕にとっては理想の環境だと思います！"},{"type":"question","text":"希望のスキルアップが出来る案件を選ぶ上で、重要視していた点を教えてください！"},{"type":"answer","text":"重要視していた点は2点あります。1点目が「その現場でしか使えないツールや独自のフレームワークを使っていない」点です。どうしても特定の現場でしか使えないツールやフレームワークは、キャリアアップにはつながらないので、そのような現場は避けていました。 2点目は「モダンなフレームワークに挑戦できる」点です。前職では企業独自のフレームワークを使っていまして...。キャリアアップのためにSpringBootやReact等のモダンなフレームワークを使いたいと思っていたので、実現できる環境を希望しました。"},{"type":"question","text":"現在参画している案件について、詳しく教えてください！"},{"type":"answer","text":"今はWebページ制作ツールのシステム開発案件に参画しています。プロジェクト規模は大きくはないのですが、基本設計から開発工程まで一人で担当しています。開発環境はフロントがReact、バックはSpringBootでライブラリ等も自由に選定できたので、自分の技術が上がるライブラリを選択しました。フロントもバックも一気通貫して携われているので、とても良い経験になっています。もちろん初めて挑戦することも多いですが、希望通りにスキルアップできる環境なのでやりがいがあります！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Ｍさんの今後の活躍がとても楽しみです！ちなみに、Ｍさんは今後どのようなキャリアを築いていきたいと考えているのでしょうか？"},{"type":"answer","text":"一番はフルスタックエンジニアになる事です。その中でも特に挑戦してみたい技術はAI分野ですね。今後は益々AIが増えていくと思いますし、何より私自身AIに強く興味があるので挑戦してみたいです！ただ、その為にも今は出来ることを少しずつ頑張ってスキルアップしていきたいです。"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"様々なSES企業があると思いますが、本当に自分の希望が通る会社は少なく、むしろ希望通りにならない事が普通ではないかと思います。そんな中でも、Visionary AIは挑戦したい事等希望が叶えられる会社だと思います。 もし僕の周りにエンジニアがいたら絶対に勧めたいですし、それくらい自信をもって人に紹介出来る会社だと自負しています。転職中の方や転職を悩んでいる方がいたら、まずは一度カジュアル面談でうちの代表と話してほしいです！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
