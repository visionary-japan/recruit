    <script id="interview-data" type="application/json">{"slug":"san7rsWP","role":"エンジニア","skills":"Network, Linux","initial":"D.K","title":"23時から定時帰宅に！SESの印象が360°変化した、理想のエンジニアライフ","tags":["リモートワーク","サポート体制","評価制度","社内業務なし","高還元","ワークライフバランス"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/59446bd18ec4497ba4c7f2f950098903/s-600x412_d7a5a7ca-0f16-452d-b540-15c86cb4e3a4.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/957c89b8caee4550966ead56fbd7c75a/interview-san7rsWP-top.webp","alt":"23時から定時帰宅に！SESの印象が360°変化した、理想のエンジニアライフ"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"Visionary AIで参画している案件では、リーダー補佐としてオフィスへの無線導入前の電波調査から導入後の顧客フォローまで一気通貫で携わっています。 前職でも、ネットワークエンジニアとして様々な案件に参画していました。ただ現場があまりにも忙しく、身体を壊しそうになったことをきっかけにワークライフバランスを整えたいと思うようになり、Visionary AIに転職しました。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"とてもハードな働き方をされていたのですね...転職活動について詳しくお伺いできますか？"},{"type":"answer","text":"前職で参画していた案件がコンサル寄りの案件だったこともあり、かなり忙しかったんです。毎日帰宅も23時を超えてしまい、あまりのハードワークで身体を壊しかけてしまいまして...。「もう少しワークライフバランスを整えて働きたい」と思い、転職活動を始めました。"},{"type":"question","text":"Kさんとの初めての出会いは転職フェアでしたね！そもそもなぜ転職フェアに参加しようと思ったのでしょうか？"},{"type":"answer","text":"最初は求人広告やエージェント経由で転職活動をしてました。ただ、選考前に「どんな人と一緒に働けるのか」や「どんなキャリアプランが実現できるか」を事前に聞いたうえで選考に進んだほうが、入社後自分が働くイメージが湧くのではないかと思い、転職フェアに参加しました。"},{"type":"question","text":"数多くの企業が出展している中で、Visionary AIのブースに来て頂けてとても嬉しかったです！"},{"type":"answer","text":"実は、転職活動を始めた当初は社内SEのポジションで働きたいと思っていたので、転職フェアでSES企業のブースに行く予定は無かったんです。たまたま「どこのブースにしようか」と考えていたときに、声をかけていただいたVisionary AIの営業Mさんから、会社の仕組みや組織について熱量高く語っていただき「もっと詳しく話を聞いてみたい」と思い、ブースに足を運びました。 実際にブースで詳細を聞く中で、Visionary AIなら今後のキャリアプランを見据えて案件を柔軟に選ぶことができたり、ワークライフバランスも理想を実現できそうだと思い、フェアの面談をきっかけに選考に進みました。 その後改めて面接を通して、Visionary AIに在籍しているエンジニアが主体的に希望を実現していることがわかり、『SESのエンジニアは受け身でエンジニアが意見を中々通せない』という印象がガラッと変わったことを今でも覚えています。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/d70503420d4542f29b3ca3fdeb691135/interview-san7rsWP-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"ありがとうございます！実際に入社してみていかがでしょうか？"},{"type":"answer","text":"色々とポジティブな変化がありました！ 1つ目は収入面です。前職では、一緒の現場に参画しているわけではない上司に当たる方に評価される仕組みだったので、不透明な評価制度に疑問を感じていました。Visionary AIに入社した今のほうが、収入もかなり上がっています。 また、Visionary AIではエンジニア同士に縦割りの関係はなくフラットな環境なので、社内に評価者がいるわけではないですし、「案件単価ー会社利益10万円＝収入」というシンプルな単価と連動した評価制度のため、とてもわかりやすいです。また、帰社日や日報等の社内業務もないので、現場の業務だけに集中できるように仕組みが整えられています。 2つ目は営業のサポート体制です。まだ入社して日が浅いため、不明点について質問する機会も多いのですが、その際は営業メンバーの方からすぐに回答していただけます。Slackで一貫して連絡を取れるので楽ですし、営業メンバーのレスポンスも早いので分からない事はすぐに解消でき、業務に集中できることがとてもありがたいですね。 3つ目はプライベートの過ごし方です。前職では平日は9時~23時頃まで稼働する事も多く、ほぼプライベートの時間がありませんでした。今は定時で帰れるようになったので、仕事終わりに本屋にいったり、飲食店に足を運んだりと、自分のやりたいことに時間が使えるようになったのがとても嬉しいです。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Kさんが理想のエンジニアライフを実現できていてとても嬉しいです！今後はどんなキャリアを考えていますか？"},{"type":"answer","text":"ネットワークエンジニアとして対応できる案件の幅を広げるためにも、AWS等のクラウドやゼロトラストにも積極的に挑戦したいと考えています。色々新しい技術も触ってしっかりキャッチアップしつつ、今まで築いてきたネットワークエンジニアのスキルも活かして頑張っていきたいです。"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"SESに疲れた人こそ一度話を聞きに来てほしいです。「SES」と聞くと、裁量を持てない企業が多いイメージが強いと思います。しかし、Visionary AIなら案件単価や契約内容等の情報をしっかり教えてくれたうえで、裁量持ってエンジニア主体で案件を決めることができます。「こんなキャリアを実現させたい」「こんな働き方がいい」等、自分の叶えたい事がある人はぜひ、一度話を聞きに来てください！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
