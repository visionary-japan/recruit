    <script id="interview-data" type="application/json">{"slug":"7NeFv2QR","role":"エンジニア","skills":"Cloud, AWS","initial":"H.U","title":"自分の幸せを追求⇒キャリアと家庭の両方を叶えられる環境へ","tags":["高還元","営業力の高さ","ワークライフバランス","家庭と仕事の両立","リモートワーク","案件選択制"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/175c624772284309950a3e6e360ee09f/s-1024x683_v-fs_webp_3b90d9bb-8e10-4ea0-959f-d3830bdb4a95.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/165308a8b2c64d41abb09a4a5ca03287/interview-7NeFv2QR-top.webp","alt":"自分の幸せを追求⇒キャリアと家庭の両方を叶えられる環境へ"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"簡単に自己紹介をお願いします。"},{"type":"answer","text":"社会人になってから一貫してIT業界に身を置き、上流から下流まで一通り経験してきました。現在はAWSのプレミティアサービスパートナー昇格を目指す企業にて、MSP認定取得を行うべく運用サービスの設計業務に携わっています。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"Visionary AIが6社目だと聞きました。上流から下流まで一通り経験し、一貫してIT業界で活躍されてきたUさんが、Visionary AIを選んだ理由を教えていただきたいです！"},{"type":"answer","text":"理由はいくつかありますが、「自分の幸せ＝キャリアと家庭の両立｣であることを考えたときに、Visionary AIであれば理想とする働き方が実現できると思ったからです。 実は他にも幾つか内定をもらっていて、最終的にコンサル会社とVisionary AIのどちらにするのかを迷っていました。これまでの経験をより活かすことができるコンサル会社のほうが理想のキャリアは実現できるかもしれないと考えましたが、案件が自由に選択できず、遅くまで働く日も増えてしまうだろうという懸念がありました。 また、結婚をきっかけに「ライフステージに合わせプロジェクトを選びたい」「家族を大切にしたい、守れるようになりたい」という思いもありました。\"より自分も幸せになれるのはどちらか\"を考えた結果、案件を自由に選ぶことができ、キャリアも働き方も理想を実現できるVisionary AIを選びました。"},{"type":"question","text":"ありがとうございます。そのように言っていただけてとても嬉しいです！案件を自由に選べる会社は他にもあると思いますが、それ以外にも決め手に繋がった点はありますか？"},{"type":"answer","text":"確かに案件を選べる会社は他にもありましたが、その中でもVisionary AIが一番還元率が高かったのは決め手の一つですね。会社の利益が固定されたシンプルな単価連動制のため、希望年収も考慮して案件を決められるという点にも魅力を感じました。 また、実際に案件参画までの過程では、営業チームの皆さんから提案される案件数の多さ、希望とのマッチ度にも驚きました。自分で案件を100%自由に選べるので、自身の描いているビジョン（ライフプランやキャリアプラン）に最適な案件を選ぶ事ができるのは嬉しいです。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/ae73fc0225884f888cf8e3f5a38720a5/interview-7NeFv2QR-body.webp","alt":""},{"type":"heading","text":"今後の展望"},{"type":"question","text":"今後の展望を聞かせてください。"},{"type":"answer","text":"まずは、AWSをはじめとしたクラウドサービスなら何でも任せてもらえるようなプロフェッショナルを目指していきたいと考えています。 将来的にはPMやPL・コンサルティング等の役割も再び担い、お客様へ貢献していきたいです。その為にもまずは目の前の仕事を通して、着実にスキルアップをしていきたいと考えています。"},{"type":"heading","text":"最後に"},{"type":"question","text":"転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"Visionary AIでは案件を裁量を持ってエンジニア自身が選べますし、案件の更新の有無も一任されています。豊富な案件の中から、自身の描いているビジョンに最適な案件を選べるので、将来像を明確に持っている人には特におすすめしたい会社です。 高い還元率の元、理想のワークライフバランスも実現できるので、一緒に頑張っていきましょう！"},{"type":"question","text":"素敵なメッセージを有難う御座いました！"}],"featuredOrder":4}</script>
