    <script id="interview-data" type="application/json">{"slug":"lvRsJqdg","role":"エンジニア","skills":"JavaScript","initial":"M.T","title":"気軽に話せるフラットな組織！会社と社員の繋がりが安心に","tags":["リモートワーク","人と社風が好き","心理的安全性","ワークライフバランス","サポート体制","上京して就職","高還元"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/8b656d62d1074a6791319eca9a09adc3/s-600x412_46298fe5-1858-448f-a4c1-652650cc57e5.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/c863f12bda76402faea342fd8d7b7aab/interview-lvRsJqdg-top.webp","alt":"気軽に話せるフラットな組織！会社と社員の繋がりが安心に"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"現在は、クレジットカードの取引を管理するプラットフォーム開発プロジェクトで、要件定義〜設計、コーディングまで幅広く担当しています。サイトの画面数がかなり多い大規模プロジェクトなので、開発チームも人数がとても多いです。 社会人になるタイミングで地元の福岡から上京し、ずっとエンジニアとして働いています。前職もSESで勤務していたのですが、会社の方向性とのズレを感じることが増えたり、会社の将来性に不安を感じるようになったことをきっかけに転職活動を始めました。何社か選考を受けていたのですが、Visionary AIの面接が一番コミュニケーションの取りやすさを実感し、入社することを決めました。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"上京してキャリアを築こうという姿勢がとてもTさんらしくてかっこいいです！入社までのエピソードを詳しく教えてください！"},{"type":"answer","text":"前職は新卒から4年間在籍していたのですが、入社前〜入社後で何回も代表が代わって会社の方針が変化したり、現場でのトラブルを会社の制度では解消できなかったりと色々なことを経験しました。とはいっても新卒で入社した初めての会社だったので、1~2年は会社に対して不安を感じてはいなかったですし、現場で業務を覚えたりスキルアップすることに精一杯でしたね。 ただ、その後に参画していた案件が案件内容も働き方も自分の希望と合っていなかったり、当時の代表の考えに共感できなくなってしまい「この会社でどのように頑張ればいいのだろう」と考えるようになってから転職を決意しました。"},{"type":"question","text":"大変な状況だったんですね...！Visionary AIに入社しようと思った決め手は何だったのでしょうか？"},{"type":"answer","text":"前職の会社では、コミュニケーションエラーでのトラブルも多かったり、相談出来る方がいなかったりという経験もあったので、転職軸の1つとしても、社内でのコミュニケーションの取りやすさを重要視していました。 転職活動中も、面談担当の方にはコミュニケーション頻度や社員同士でのコミュニケーションの様子等、コミュニケーションの取りやすさについて重点的に質問してましたね（笑） その中でVisionary AIの面談で話した役員の方の対応が、他の会社に比べて「いいな」と思ったんです。直観的に話しやすさがあったといいますか、ありのままの自分でも受け入れてくれそうだなと思いました。話を聞いていく上でエンジニアとしても成長できそうだし、仕組みにも魅力を感じたので最終的にVisionary AIを選びました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/545344d6a3fe48e2baa0687279ab227b/interview-lvRsJqdg-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"SESだと、特にコミュニケーションの取りやすさって気になりますよね。実際に入社してからギャップを感じることはないですか？"},{"type":"answer","text":"期待以上にコミュニケーションが取りやすかったので驚きました！コミュニケーションツールはSlackを使用しているのですが、Slackを通して会社内の連絡を完結できる点がとてもシンプルで良いなと感じています。「各エンジニアメンバー＋経営陣＋営業組織」のチャンネルでは、勤怠や仕事の連絡、キャリアの相談等もいつでも行えます。フランクに経営層や営業メンバーともコミュニケーションが取れるのが嬉しいですし、安心にも繋がります！ また、Visionary AIはエンジニアメンバー同士でも役職等がなくフラットな組織なので、縦割りの関係を気にしなくても良い点も魅力的に感じています。エンジニアメンバー全員に「個人timesチャンネル」という学んだことや趣味等を自由に発信できるSNSみたいなチャンネルが用意されているのですが、そのチャンネルを活用して他のエンジニアメンバーと趣味の話で盛り上がったり、現場での悩みを相談出来るのもとても助かっています。"},{"type":"question","text":"他のエンジニアとコミュニケーションが取れるのは嬉しいですよね！"},{"type":"answer","text":"そうですね！本当に個性豊かなメンバーが多いので、話していて楽しいです（笑）Visionary AIでは定期的にオフラインのイベントも開催しているのですが、毎月新たなメンバーが入社しているので、参加するたびに新鮮な楽しみがあります。 また、私自身、社会人になるタイミングでエンジニアになったのですが、別業種からエンジニアになった人もたくさんいるので、そのような経緯を持つ方たちの話を聞くのもとても面白いですね！"},{"type":"question","text":"プライベートでは、新たにどのような変化がありましたか？"},{"type":"answer","text":"転職活動で想像していた以上に収入が増えまして、、、前職の1.5倍くらいになりました！収入が増えた分、より一層趣味の推し活を楽しめるようになりましたね（笑）あとは、友人と過ごす時間も増えました！毎月のように親友とご飯を食べに行ったり、推しのイベントに行ったり、貯金の金額も増やすことができたりと、プライベートもとても充実してます！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"推し活も充実していてよかったです！主体的に活躍しているTさんの今後の目標をお伺いできますか？"},{"type":"answer","text":"長期的な目標としては、フルスタックエンジニアを目指しています！設計から保守まで様々な作業領域を網羅できるようになれば、エンジニアとしてキャリアを築く上で選択肢もかなり増やせると思うので、マルチに活躍できるようになりたいです！最終的には、PMやPL補佐としてサポートできるような役割にも挑戦してみたいと考えています！ 短期的な目標としては、まずはスキルを身に着けて単価を上げていきたいですね。もっと推し活に注力したいので（笑）"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"Visionary AIの特徴は、なんといってもコミュニケーションの取りやすさだと思います。企業によっては他の現場に入っているエンジニアとコミュニケーションが取れないことも多くあると思いますが、Visionary AIではいつでも全国にいる社員とコミュニケーションを取れるので、会社として社員との一体感を感じます！ 全員がフラットで経営層とも気軽にコミュニケーションを取れるので、人との関わりやサポート、交流も大切にしている人は一度、話を聞きに来て欲しいです！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
