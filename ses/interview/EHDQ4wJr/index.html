    <script id="interview-data" type="application/json">{"slug":"EHDQ4wJr","role":"エンジニア","skills":"Java, Salesforce","initial":"A.M","title":"会社を“箱推し”！地元大分でエンジニアのキャリアを再出発！","tags":["案件選択制","人と社風が好き","好きな場所で働く","リモートワーク","高還元","ワークライフバランス","サポート体制"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/89615a6b79034326b397d80d3ea7cff4/s-600x412_684a5ebc-a47f-4c50-9606-32710b6e51a0.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/0feee6c2474d4b17a4f6fbc6fb0a0413/interview-EHDQ4wJr-top.webp","alt":"会社を“箱推し”！地元大分でエンジニアのキャリアを再出発！"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴を教えてください！"},{"type":"answer","text":"はじめまして！エンジニア歴は6年でJava言語やApexを用いたSalesforceの案件にこれまで携わっていました。また入社する前の1年間は、Webライターとして活動していました！ 現在は、大好きな地元の大分県でフルリモートで働き、エンジニアとしてキャリアを再出発しています。Salesforceの案件に参画しており、保険の契約から支払いまでを一気通貫してサポートする顧客契約管理システムの開発に携わっています。 具体的には、上長の補佐として要件定義フェーズから関わり、会議で実装方法の提案をしたり、資料作成なども担当しています。新商品の開発に携わっているため、ヒアリングした要件をApexやトリガーでバックエンド実装したり、Visualforceを使った画面開発を行ったりしています。幅広く経験を積むことができていて、とてもやりがいを感じています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"明るくどんな人からも愛されるMさん！今日はお話を聞くのを楽しみにしていました！直近1年はWebライターとして活動されていたと思うのですが、これまではどのようなキャリアを築いてきたのでしょうか？"},{"type":"answer","text":"元々、学生の頃からITを専門として学び、社会人になって上京しITエンジニアとしてキャリアを築いてきました。当時は様々な現場で経験を積んでいたのですが、自分にとってキャパオーバーを感じる実力以上の仕事を任されることが多く、期待に応えられないことにプレッシャーを感じるようになりました。 周囲からのプレッシャーや、自分のエンジニアとしての土台が不安定であることなどの状況を踏まえ、『改めて、今後私はどのようなことをやっていきたいのか』とキャリアを見つめ直した結果、ずっと興味のあったWebライターの道に挑戦することを決意しました。 入社前の1年間はWebライターとして活動し、その楽しさや面白さを経験できましたが、キャリアチェンジの難しさを実感したり、エンジニアの道を諦めたことへの後悔もあり、もう一度エンジニアとして土台をしっかり築いていきたいと思うようになりました。そこで、『大分県で暮らしながら、自分のペースでエンジニアとしてキャリアを築ける環境で働きたい』と思い、転職活動を始めました。"},{"type":"question","text":"自分のペースで働ける環境はキャリアを築く上でも大切ですよね！転職活動を進める中で、VISIONARY AIを選ばれた理由を教えていただけますか？"},{"type":"answer","text":"「こんなに良い条件の会社はないだろう」と思いながら、求人サイトで希望の働き方・キャリア・年収を検索したところ、VISIONARY AIがヒットしたんです！応募の時点で「この会社が自分に一番合っているような気がする！」と直感的に感じたのを覚えています。 入社の決め手は一言で言うと『VISIONARY AIの全てに惹かれたから』です。面談前から、HPやSNS、note、Qiitaなど様々なメディアを通じて「どのように働くことができるのか」を想像できたことで信頼に繋がりましたし、希望の働き方、キャリア、年収を全て妥協せずに実現できるという点が何よりも嬉しかったです。 また、面談で小野代表と話した際にもフィーリングが合うと感じましたし、1年のブランクがあることへの不安を払拭してくれる営業組織のサポート体制にも惹かれ、内定をいただいてすぐに入社を決めました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/d8c074fcf4f44fdfa3e620cc270021c9/interview-EHDQ4wJr-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"大変嬉しいお言葉ありがとうございます！私達もMさんが仲間としてジョインしてくれたことが心から嬉しかったです...！実際に入社してみていかがですか？"},{"type":"answer","text":"大分県で暮らしているため、直接皆さんにお会いできる機会は少ないのですが、常に「VISIONARY AIに入社できて良かった」「もっと関わりを増やして会社に貢献したい」と実感しています。 ライターからエンジニアに復帰することに当初不安はありましたが、会社のサポート体制が想像以上で、皆さんが支えてくれていることを常に感じられるので、不安もすぐに解消されました。ブランクはありましたが、業務や知識についても問題なく案件先にもすぐに馴染むことができました。 前職と仕事内容は大きく変わらないはずなのに、心に余裕があるためか、プレッシャーから解放されて私らしく働けていると感じます！これまでは会社都合の案件参画でしたが、今は自分の意思で案件を選ぶことができるので、自身で納得したうえで前に進めていることも不安なく働けている理由のひとつなのではないかと思います。"},{"type":"question","text":"Mさんが自分らしく働くことができて本当に良かったです！フルリモートで働いている今、私生活にも変化はありましたか？"},{"type":"answer","text":"前職も東京で暮らしながらリモートメインではありましたが、地元の大分県に引っ越したことで、より穏やかな日常を送れるようになりました。東京で感じていた“忙しなさ”や“時間に追われるような感覚”がなく、時間がゆっくりと過ぎるので、肩の力を抜いて生活できるようになりました。 結婚をきっかけにUターンしたのですが、私もパートナーもフルリモートなので生活リズムが合うことも嬉しいです。最近ではエンジニアのフルリモート勤務が減ってきていると聞くので、この働き方ができるのは会社や案件先から信頼されている証拠だと思います。時間に余裕ができた分自炊もできるので、最近は主婦業も捗っています！私もパートナーも地元が大分なので、家族や友人と過ごす機会が増えました！ また、以前と比較して給料が約2倍になりました！私は『給料＝会社からの愛』だと思っているんです。社員に対する愛情があるからこそ、ここまで高水準の高還元が実現できているんだなと実感しています。こんなに社員のことを心から思ってくれる会社は他にないです！ フラットな評価制度なので、学歴や経歴に関係なく全員が平等ですし、今後のライフプランを充実させていくうえでも、余裕を持って生活できることが嬉しいなと思います。"},{"type":"question","text":"大切な人たちと過ごす時間や収入面でもプラスの変化があり嬉しいです...！先日の全社会では東京までお越しいただきありがとうございました！"},{"type":"answer","text":"私もようやく皆さんに直接お会いすることができて嬉しかったです！全社会のおかげで、会社や皆さんとの距離がぎゅっと縮まったと思いますし、毎月都内で開催されている社内イベントが羨ましくなっちゃいました（笑） 普段のSlackなどでも交流はできますが、全社会では、多くのエンジニアメンバーの顔と名前が一致しましたし、エンジニアチームを盛り上げてくださっているメンバーとも話すことができて「やっと実際にお会いできた！こんな方なんだ！」と感動しました...！ 小野代表から「九州メンバーが集うイベントも開催する」とお聞きしたので、今からとても楽しみです！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"私も実際にMさんとお話することができてとても嬉しかったです！日々大活躍中のMさんですが、今後VISIONARY AIではどのようなキャリアを築きたいと考えているのでしょうか？"},{"type":"answer","text":"まずはエンジニアとしての実力をさらに伸ばしていきたいです！エンジニアとしての土台をしっかり作り、将来的には様々なスキルをかけ合わせて、多角的なアプローチができるビジネスパーソンになりたいと思っています。まだ中長期的なキャリアを明確に設計できていないのですが、PL・PMに挑戦することも選択肢の一つとして考えていきたいですね。"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！Mさんの今後の活躍もとても楽しみです...！最後に、転職を考えている方に一言お願いします！"},{"type":"answer","text":"私がエンジニアの夢を一度諦めた時、将来の可能性を潰してしまったのではないかと思ったこともあったのですが、VISIONARY AIで改めてエンジニアのキャリアを再出発することができましたし、「本当の幸せってつかめるんだ！」と思いました！ もし、何かしらの理由でエンジニアの道を一度諦めてしまった方がいたら、再出発できる環境がここにはあると胸を張ってお伝えしたいです。私もまだまだ未熟なので是非一緒に頑張りましょう！ 私にとって人生で一番ラッキーだったことはVISIONARY AIに出会えたことだなと本気で思っていて、運を使ってしまった分、また地道に徳を積んでいこうと考えています（笑） この会社が大好きなので、今後もVISIONARY AIを“箱推し”して、私自身も頑張っていきたいと思います！"},{"type":"question","text":"最後までMさんらしくてとても素敵です！心のこもったメッセージを有難う御座いました！"}]}</script>
