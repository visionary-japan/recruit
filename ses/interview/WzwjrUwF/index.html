    <script id="interview-data" type="application/json">{"slug":"WzwjrUwF","role":"エンジニア","skills":"C#","initial":"A.T","title":"大手からスタートアップへの転職！代表の思いやVISIONが決め手に","tags":["リモートワーク","人と社風が好き","案件選択制","ワークライフバランス","理念共感","評価制度"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/63a44d47663c4ed78522ddb28415869c/s-600x412_002f8681-4665-4260-b54b-236ae77944ce.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/4a8144fba19d43d78c625cc2fbeab043/interview-WzwjrUwF-top.webp","alt":"大手からスタートアップへの転職！代表の思いやVISIONが決め手に"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"新卒からずっとエンジニアとして働いていて、今年でエンジニア歴は7年目になります。今は大手人材会社の求人プラットフォームシステム開発の設計から携わっています。基本的にはC#で、SQLなども使っています。入社してからはフルリモートで働いています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"エンジニア歴が長く、日々活躍されているTさんの話を聞くのを楽しみにしていました！前職は新卒からずっと長く勤めていたとお伺いしていましたが.."},{"type":"answer","text":"ありがとうございます！前職は新卒から7年間ずっとお世話になっていた会社で、全国にも各地拠点があるような大手SIerに勤めていました。 実は同じ案件に7年間参画していて、顧客とも信頼関係は築くことができていたのですが「思うようにスキルが伸びないな」「他の技術にもっとふれていきたいな」と考えるようになりまして...！7年間も勤めたからこそ、他の案件や技術にも挑戦したいなと思った際に「それならいっその事、転職をしても良いかも」と思い転職活動を始めました。"},{"type":"question","text":"7年間在籍していた会社からの転職は、とても思い切った決断ですね！転職活動は、どのような軸で進めていたんですか？"},{"type":"answer","text":"まずはどのような会社があるのかな？と興味本位で求人を見ていたのですが、SESでも『会社によってこんなに仕組みや制度が異なるんだ』と驚きました。 様々な会社を見ていく中で「案件は自分で選べる環境が良い」「リモートワークで朝はゆっくり過ごしたい」「社員同士の仲が良い会社に行きたい」こんなことを実現したいなと思い、案件選択制や社内の雰囲気がわかる会社を中心に見始めました。 前職は会社から指示のあった案件に行くのが当たり前で、希望のヒアリングは一切なかったので、“案件が選べる”という会社があることに驚きました...！また、前職では社内の繋がりがほとんどなく、支店ごとに月1回ミーティングがある程度でした。そのときも売上の話がメインで、正直「楽しいな」と思える内容ではなく、普段エンジニアメンバーと顔を合わせることもないので、気づいたら後輩がやめていたこともありました。 せっかく転職するなら、一緒に働く組織・人も大切だなと思い、面談でお会いする方の雰囲気や社風も見ていました！"},{"type":"question","text":"たしかに、7年前と比較するとエンジニアの採用市場はかなり変化しましたよね！様々な会社がある中でVISIONARY AIを選んで頂けた理由を教えてください！"},{"type":"answer","text":"複数の会社から内定も頂き、最後はVISIONARY AIともう1社で迷っていました。 それでもVISIONARY AIを選んだのは、選考の途中でエンジニアメンバーとのカジュアル面談の機会をいただき、実際に働いているエンジニアの話を聞くことで、この会社なら自分の希望が叶いそうだと感じたこと、そして代表の小野さんから頂いた「VISIONARY AIに入社したら後悔させない」という言葉が嬉しくて「この代表の創る会社の一員になりたい」「ついていきたいな」と思ったことが決め手ですね！ 今でも覚えているのですが、VISIONARY AIが最初から代表面接だったのは驚きましたね(笑)前職では、代表と会う機会なんてほとんどなかったので！"},{"type":"question","text":"当時はまだ30名ほどの規模で創業間もない時期だったと思います...！大手から創業期の間もない会社に行くことに不安はなかったんでしょうか？"},{"type":"answer","text":"もちろん不安はありました。ただ、選考の際に代表から「今入社するメンバーは、今後の会社を担っていくメンバー。信用・信頼関係を作って頼っていきたい」という言葉がとても印象的で「それなら私も創業期の一員として頑張ろう」と思いました。それに、不安に感じている点は全て事前に質問をして解消していただけたので、入社するときには全く不安はなかったです！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/9c9a74482fb141189f2c522e8de79f83/interview-WzwjrUwF-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"Tさんにそのように共感いただけたのは本当に嬉しいです！実際に入社してみてギャップに感じることはなかったですか？"},{"type":"answer","text":"良い意味でのギャップはたくさんあります。まず、最初の案件に参画するまでの案件紹介数の多さに驚きました！むしろ、転職活動よりもその当時は忙しかったのでは？と思うほどです(笑)　かなり面談を受けていたので大変でしたが、そのおかげで今希望通りの案件に参画できています！ そして、年収が前職よりも200万円近くUPしたので、先延ばしにしていた引っ越しも実現できました！今思うと前職の評価制度はあまり明確ではなく、スキルアップしても給与は数十円単位でしか上がらなかったので、VISIONARY AIの単価連動制はシンプルかつわかりやすいなと思います。 また、普段はフルリモートで1名参画のため、他の社員とは関わりも少ないのかな？と思っていたのですが、全くそんなことはなかったです！役員や営業の方が定期的に気にかけてくださりますし、都合が合えば参加している社内イベントでは、多くのエンジニアの方と話すことができるので...！前職よりも、年代が同じの方が多いので楽しいですし、毎回「行ってよかったな」と実感します。"},{"type":"question","text":"そのように言っていただけて本当に嬉しいです！Tさんは組織や会社の方針等にも高く共感していただいていますよね。"},{"type":"answer","text":"そうですね。VISIONARY AIに入って一番に思うのは、“明るい人が多く、常に活気がある”ということですね！一般的に見れば若い方も多いのですが、コミュニケーションを通して一人ひとりが本当にしっかりしているなと思います。大切にしている自分の軸があったり、VISIONを持って取り組んでいる方が多いのは素敵ですよね！ 先日参加した社内イベントでも、執行役員が「案件先で困っていることがないか」と気にかけてくださりました。相談したところ、寄り添ってアドバイスまでしてくれて「頼もしいし信頼できる経営陣だなぁ」と思いました。VISIONに掲げている通り、日本を代表する会社の一員になることが今からとても楽しみにしています！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"VISIONを有言実行できるよう、成長し続けます！長くIT業界でご活躍されているTさん、今後はどのようなキャリアを築いていきたいのでしょうか？"},{"type":"answer","text":"今はC#がメインではありますが、今後は様々な技術領域にも挑戦していきたいと思います。また、現状だと1人での参画にはなりますが、今後はVISIONARY AIのメンバーとも参画できたら嬉しいなと思います！前職でも後輩の面倒を見たり新人教育を担当していたので、マネジメント領域もどんどん挑戦していきたいですね。"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"仕事もプライベートも大切、それを両立できるのがこの会社の良いところです。社内業務も最低限で強制されることがほとんどないので、勉強、趣味、誰と過ごすのかも自由！一人ひとりの価値観を受けて入れもらえる会社だと思います。 また、SESでは珍しいのではないかな？と思うくらい帰属意識が高く、メンバーも素敵な方ばかりで「またコミュニケーションを取りたいな」と感じる組織です！転職活動を通して、自分の仕事の価値観を大切に会社を選びたいという方がいれば、是非おすすめしたいです！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
