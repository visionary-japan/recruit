    <script id="interview-data" type="application/json">{"slug":"4c5cfH66","role":"エンジニア","skills":"Java","initial":"N.I","title":"自分が主体で案件が選べる！理想のSESで新たなエンジニアライフへ","tags":["案件選択制","リモートワーク","高還元","ワークライフバランス","サポート体制","社内業務なし","営業力の高さ"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/1456e8b19839413cb0cb66195a4d9a64/s-600x412_f5f69fcf-951e-4f8d-a61e-95b0d8b4dd72.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/6c8719887d17447e91b77fc57b9f3bf9/interview-4c5cfH66-top.webp","alt":"自分が主体で案件が選べる！理想のSESで新たなエンジニアライフへ"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴を教えてください！"},{"type":"answer","text":"はじめまして！エンジニア歴は5年程で、これまでは主にJavaを用いた業務システム開発に携わってきました。今後はWeb系の開発分野でキャリアを積んでいきたいと思い、VISIONARY AIに入社しました。 現在は医療系WebサービスのAPI新規開発に携わっており、バックエンド領域を担当しています。主にAWS環境でJava(SpringBoot)を使用して開発しています。工程は基本設計から結合テストまで一気通貫で対応し、後にテストコードを作成・検証しながら機能追加を行っています。 希望していたWeb系、API開発の案件に参画でき、チームでも裁量を持って自由度高く業務に取り組めているのでとてもやりがいを感じています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"ありがとうございます！早速ですが、転職活動を考えたきっかけを教えていただけますか？"},{"type":"answer","text":"転職活動のきっかけは「自分で参画する案件を選びたい」と思ったことです。 これまでに2社SESを経験してきましたが、前職では会社や営業の都合で参画する案件が決まる環境でした。新卒の比率が高い組織だったため、必ず新人とチームで参画する分、選べる案件や領域もかなり限定されているように感じました。 ある時、会社の指示で確実に炎上している案件にも行かざるを得ない状況になり「会社の都合で自分のキャリアが決まってしまうこと」に不安を感じました。また「業務系ではなくWEB系の開発に挑戦してみたい」という思いもあり、転職を決意しました。"},{"type":"question","text":"人生の大部分を占める仕事だからこそ、やりたいことに挑戦したいですよね...！そのような思いを持って転職活動を進める中で、VISIONARY AIを選んでいただいた理由を教えてください！"},{"type":"answer","text":"『自分で案件を選択できること』『営業力が高く案件数が豊富であること』『高還元・単価連動型の評価制度』の3点が決め手でした。案件選択ができる会社はいくつか見かけましたが、VISIONARY AIの求人を見たときの「会社利益は月10万円で、それ以外は全て収入に還元される」という制度がとても印象的でした（笑） 自分の経験やスキルがそのまま収入に直結するという評価制度もシンプルで分かりやすく、技術力向上のモチベーションに繋がるなと思いました。また、面談で話した際にも入社後のキャリアや働き方、条件などにもギャップがなかったので、この組織・環境なら信頼して働けると思い入社を決めました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/3e520b4f93824dd7beae1ec0ce720f1a/interview-4c5cfH66-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"VISIONARY AIを選んでいただいて本当に嬉しいです！実際に入社してみていかがですか？"},{"type":"answer","text":"『自分のやりたかったこと』に挑戦できたことが何よりも嬉しかったですし「本当に希望が叶うんだ！」と驚きました。営業前の希望の案件に関する詳細のヒアリングから案件の決定まで、営業の皆さんのフォローの手厚さを日々感じましたし、一人ひとりに親身に寄り添ってくれる姿勢が行動に表れていて安心・信頼に繋がりました。 前職では、営業の方と直接コミュニケーションが取れないルールになっていて、案件に関するメールに対して了承の返事だけを行っていました。今思い返すと、社内で気軽に相談できる相手がいなかったなと思います。 今は何か困ったことがあっても、Slackの自分専用のサポートチャンネルですぐに相談できるので心強いです！"},{"type":"question","text":"Iさんの希望を叶えることができ、私たちも嬉しいです！収入面や働き方にも変化はありましたか？"},{"type":"answer","text":"収入面も大幅にアップしましたし、今後もまだまだ経験次第で上がっていきそうなので嬉しいです！働き方もかなり変化がありましたね。前職では月20~30時間の残業が当たり前だったのですが、VISIONARY AIに入社してからは残業はほぼゼロになりました...！往復2時間の通勤からも開放され、フルリモートで働くことができているので、より業務にも集中できますし、自分の時間を増やすことができました。個人的には出社とリモートで成果が変わらないのでリモートのほうが嬉しいなと思います！ そして時間に余裕ができた分、平日毎日ジムにも行くようになり、自然と運動習慣が身につきました。元々お酒も大好きだったのですが、運動をすることで身体にも気を遣うようになりまして、お酒を飲まなくなりました（笑）パートナーと過ごす時間も大切にできるようになりましたし、プライベートがとても充実したなと実感しますね。"},{"type":"question","text":"生活習慣にも変化があったんですね！ちなみに、これまでと変化があった点でいうとVISIONARY AIの組織にはどのような印象を受けましたか？"},{"type":"answer","text":"そうですね。皆さんそれぞれ現場で活躍していることも社内のSlackを見ていると伝わりますし、技術そのものや、エンジニアという仕事が好きな方、主体性が高い方が多い印象を受けました。帰社日などは設けられていませんが、Slackを通して他のエンジニアメンバーについて気軽に知ることができるので、自然と帰属意識も高まる組織だと実感しています。技術に関するニュースやトレンドなども発信しているメンバーが多く、自分も頑張ろうという刺激にも繋がります。 私はあまり発信はしていませんが、一人ひとりの「自分らしさ」を大切にするカルチャーなので強制されることは一切なく、どんなエンジニアにとっても居心地の良い組織だと思います。今後何か自身のイベントがあれば、timesチャンネル（個人のつぶやきチャンネル）で発信してみたいなと思います！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"ありがとうございます！Iさんの投稿も楽しみです...！Iさんは今後エンジニアとして、どのようなキャリアを築いていきたいのでしょうか？"},{"type":"answer","text":"現在参画している案件でもやりたいことが実現できていて、挑戦したい技術にも触れることができているので、まずは目の前の業務から更にスキルを広げていきたいと思います。Webアプリの開発を一通り経験したら、今後はネットワークやクラウド関連の技術・知識も身につけていきたいです。 どんな技術領域でも対応できる高い技術力のあるエンジニアが一番かっこいいと思っているので、将来的にはそんなエンジニアを目指したいです。日々勉強しながらキャリアを築いていけるよう精進したいと思います。"},{"type":"heading","text":"最後に"},{"type":"question","text":"今後のIさんのご活躍も応援しております！最後に、転職を考えている方に一言お願いします！"},{"type":"answer","text":"私の転職活動を振り返ると、VISIONARY AIに入社することで転職活動で叶えたいと思っていたことを全て実現することができました。「案件を自分で選びたい」「自分で理想のキャリアを描いて実現したい」「学びたい技術がある」そんな思いのある方にとって特に最適な環境だと思います。 自分のペースで成長できる環境なので、ぜひ一緒に頑張りましょう！"},{"type":"question","text":"最後までMさんらしくてとても素敵です！心のこもったメッセージを有難う御座いました！"}]}</script>
