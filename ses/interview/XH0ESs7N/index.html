    <script id="interview-data" type="application/json">{"slug":"XH0ESs7N","role":"エンジニア","skills":"Java","initial":"S.Y","title":"沖縄×フルリモート！新たな働き方に","tags":["ワークライフバランス","サポート体制","好きな場所で働く","人と社風が好き","リモートワーク","高還元"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/4e948b67fc894b4e960d0e5900d12a96/s-600x412_933f15aa-e661-496c-be8c-0d78e1252d2e.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/2390b3a2e7264a2f8724c71c21b5eedf/interview-XH0ESs7N-top.webp","alt":"沖縄×フルリモート！新たな働き方に"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"簡単に自己紹介をお願いします。"},{"type":"answer","text":"実は最初からエンジニアだったわけではなく、元々は繊維業の会社で、洋服の生地を提案する営業をしていました。 営業していく中でモノ作りに興味を持つようになり、将来性のあるITエンジニアにキャリアチェンジし、未経験からITエンジニアとして働くことができるSES企業に転職しました。 そこで一通りエンジニアとして経験を積み、環境自体には満足していたのですが、結婚を機に沖縄に引っ越すことになり、フルリモートでも同じように働けるVisionary AIに転職を決めました！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"現在は沖縄に住んでいるんですね！羨ましいです、、、！"},{"type":"answer","text":"そうなんです（笑）家族との時間は僕の中でも重要視していたので、沖縄でフルリモートで働ける会社を探していました。 また、これからのライフプランを踏まえ、沖縄に移住しても東京水準の給与を得たいと考えていました。 転職活動を進めていく中で、Visionary AIと出会ったのですが、選考中の面談で沖縄から参画できる案件を教えてもらったり、業界最高水準の高還元の仕組みに惹かれて入社を決めました！"},{"type":"question","text":"転職活動では、フルリモートと給与の2軸を重要視していたんですね。"},{"type":"answer","text":"それ以外にも「人」という軸も重要視していました。 様々な企業を見ていましたが、Visionary AIの選考で代表や役員と面談した際に、雰囲気や人間性などを含めて信頼できそうだと思い、最終的に入社を決めました。 役員だけでなく営業メンバーも、Slackや電話で一人ひとりのエンジニアにこまめに連絡を取っているのを見て、リモートでも安心して相談できそうだと思ったのも大きかったですね。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/0354e3ab035243cd8921a093fb9808e6/interview-XH0ESs7N-body.webp","alt":""},{"type":"heading","text":"働き方について"},{"type":"question","text":"働く中で困ったこと等はありませんか？"},{"type":"answer","text":"沖縄でのフルリモート業務には慣れない部分もありますが、働き方はとても充実してます！ エンジニア一人ひとりに専用のSlackチャンネルがあって役員や営業メンバーが日々フォローしてくれますし、エンジニアメンバーも皆さん積極的にナレッジを発信していたり、趣味の話をしていたりと、コミュニケーションが活発なのがいいですね！ 入社後ずっと沖縄で勤務しているので、今度東京に行く機会があればメンバー同士で飲みに行きたいです（笑）"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"東京に来た際は是非、みんなで飲みに行きましょう（笑）将来についてはどう考えているのですか？"},{"type":"answer","text":"元々営業をやっていたこともあって人と関わるのが好きなので、今後はその営業力やリーダーシップを活かして会社の力になりたいですね。 営業力を活かして自分で受託案件を取ってきたり、PMやPLとして後輩を教えたり、色々なことに挑戦したいです！ 今はその目標を達成すべく、まずは技術者としてスキルアップに集中し、少しずつ成長していければなと思っています。"},{"type":"heading","text":"最後に"},{"type":"question","text":"転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"フルリモートと聞くと、「他の社員とコミュニケーションが取りにくく、関係構築が難しそう」と考える人も多いと思います。 Visionary AIでは他のエンジニアに技術の相談をしたり、趣味が同じ人と雑談をしたり、営業に案件の相談をしたりと、社員同士がコミュニケーションを取れる仕組みが整っているので、安心してフルリモートの働き方ができると思いますよ。是非一緒に頑張りましょう！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
