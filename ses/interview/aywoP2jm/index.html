    <script id="interview-data" type="application/json">{"slug":"aywoP2jm","role":"エンジニア","skills":"Java, JavaScript","initial":"K.O","title":"キャリアも家庭も「ありたい姿」を実現","tags":["案件選択制","サポート体制","リモートワーク","高還元","ワークライフバランス","家庭と仕事の両立","評価制度"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/cabf5f7061174f87b8002691d69901f2/s-1024x683_a41b4ae6-7a23-4d95-90ce-fd424e4523a6.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/8346a28b40504924b4e2b901d1d99c3c/interview-aywoP2jm-top.webp","alt":"キャリアも家庭も「ありたい姿」を実現"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"現在は、大手美容カタログシステムの開発に携わり、JavaのSpringBoot、AWSを活用した新規開発や保守まで幅広く担当しています。エンハンスチームのリーダーを経て、次月より大玉案件のリーダーを任せていただいたりと、様々な業務に挑戦しています。 キャリアを振り返ると、医者を目指していた時期があったり、医療系の会社で人事を経験したりと、様々なことに挑戦してきましたね...。5年前にエンジニアにキャリアチェンジをし、SESを2社ほど経験した後に、VISIONARY AIに入社しました。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"これまでも様々なキャリアを通して活躍されていたんですね！転職活動を始めたきっかけを教えて頂けますか？"},{"type":"answer","text":"転職活動を始めたきっかけは2点あります。 1点目は「30代前半、どのような人生を過ごしていくのか」を見つめ直し、改めてエンジニアとしてどのようなキャリアを築きたいのかを考えた時に「もっとスキルアップ・キャリアアップをしていきたい」と感じたことですね。 そして2つ目は、ライフイベントである結婚が重なり「これからのライフプランをどのように充実させたいのか」を考えるようになったことです。"},{"type":"question","text":"キャリアを考え直す機会やライフイベントがきっかけでだったんですね！"},{"type":"answer","text":"そうですね。前職も同じくSES企業で、案件参画前には複数の面談を受けることはできたのですが、会社が保有している案件の数や、参画する案件の単価、契約等の詳細情報は一切開示されませんでした。 実際に、火消し役で案件に配属されたり、会社都合で案件を変更しなければいけないことも多くありまして...。それでもクライアント先で頑張り、パフォーマンスを発揮することで評価や給与UPに繋がると思っていたのですが、なかなか会社からの評価に繋がらなかったんですよね。このような経緯があり、この環境でどのようにキャリアを築けば良いのか、どうしたら評価されるのか等が不透明になってしまいました。 そういった思いを解消したいと思い、転職活動を通して出会ったのがVISIONARY AIでした。"},{"type":"question","text":"様々な会社がある中で、VISIONARY AIを選んだ決め手は何だったんでしょうか？"},{"type":"answer","text":"「案件単価ー会社利益は10万円＝収入」という仕組みで実現できる高還元、シンプルかつクリアな評価制度、そして自らが主導権を持てる案件選択制の3つに魅力を感じ、入社を決めました。 エンジニアが主体で案件を選べることは、キャリア形成においても重要だと考えていました。また、契約内容や単価等も全て教えてもらった上で案件を選ぶことができるので、会社や営業担当の皆さんを信頼して働けるなと感じました。 クライアントからの評価がそのまま自分の収入に繋がる、シンプルな単価と連動している評価制度は、キャリアアップのモチベーションにも繋がりますね。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/f997b9fad1754ba38b6dc666b52de800/interview-aywoP2jm-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"そのように言っていただけてとても嬉しいです...！実際に入社してみていかがですか？"},{"type":"answer","text":"様々な仕組みが整っているのはもちろんですが、営業チーム皆さんのフォローの丁寧さや手厚さには驚きましたね。今の案件に切り替える際にもとても親身に寄り添っていただいたり、レスのスピードや情報共有の細かさは信頼に繋がりましたし、こちらの要望をヒアリングしてからの実行力も高いのでとても心強いなと感じました。実際に自分の希望が叶う案件をすぐに見つけてきてもらえました！ また、前職だと他のエンジニアメンバーや他部署との関わりはあまりなかったのですが、VISIONARY AIは常にSlackが稼働していて、主体性の高いメンバーが多いなという印象を受けますね。 SESだと「社内の誰が何をしているのかよくわからない」と感じるケースが多いと思うのですが、VISIONARY AIは「どんなメンバーがいるのか」「何を情報としてキャッチアップしているのか」等をSlackで気軽に知ることができるので、良い意味でカルチャーにギャップを感じています！通知もコントロールできるので、見たいときや時間があるときにチェックしています！"},{"type":"question","text":"ありがとうございます！私生活でも変化はありましたか？"},{"type":"answer","text":"実は、VISIONARY AIに入社して年収が200万円以上上がりました（笑）！ 妻が出産を控えているため、私生活もとても大切な時期に差し掛かっているのですが、収入面でも余裕を持って準備を進めることができたり、妻をサポートすることができています。家族が増えたら家族が「やりたい」と思うことを精一杯やってあげられる父親を目指したいと思います。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"おめでとうございます！今後はライフステージも変わり、人生も大きく新たな一歩を踏み出しているんですね！"},{"type":"answer","text":"そうですね！そのためにも「より、自分の仕事に誇りや自信を持ちたい」と考えています。まずは、様々な業務を通してスキルを身につけ、磨いていきたいです。その後は、これまでのキャリアで培ってきたマネジメントスキルを活かし、PMやPLを目指していきたいなと想います！チームの中心で活躍したり、会社の後輩メンバーの育成にも携わったり...色々挑戦していきたいなと考えています。"},{"type":"heading","text":"最後に"},{"type":"question","text":"会社のコアメンバーとして成長されるOさんの今後がとても楽しみです...！最後に、転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"もちろん転職活動の軸によると思いますが、「エンジニアとしてこんなキャリアを築いていきたい」「ワークライフバランスを見直したい」等、自分が主体となって仕事をしたい方にとって特に最適な環境だと思います。 のびのびと活躍しているメンバーが多く、SlackやQiitaで学びを自由にアウトプットするカルチャーもあるので、目標を持っていたり主体性の高いメンバーと働きたい方にもマッチしていると思います！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}],"featuredOrder":2}</script>
