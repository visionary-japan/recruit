    <script id="interview-data" type="application/json">{"slug":"B793yTuK","role":"エンジニア","skills":"Java, C#","initial":"T.K","title":"北海道×フルリモート！東京のモダンな案件に参画","tags":["案件選択制","リモートワーク","営業力の高さ","モダンな開発環境","高還元","好きな場所で働く","評価制度"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/0620134a46b94e27a143955b54bae924/s-600x412_92639b3a-c1db-47c7-b1ab-f031eafa7ce3.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/8f00f286e46140a49f0e191990d191be/interview-B793yTuK-top.webp","alt":"北海道×フルリモート！東京のモダンな案件に参画"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！簡単に自己紹介やこれまでの経歴を教えてください！"},{"type":"answer","text":"エンジニア歴は約9年で、主にJavaやC#を使ったWebアプリケーション開発に携わってきました。上流工程やプロジェクト管理の経験もあり、それらを活かしながらさらにスキルアップを図りたいと思い、Visionary AIに入社しました！ 現在は大手会計ソフトのWebアプリ開発のバックエンドを担当しています。技術的にはAWS環境で主にC#を使用しており、要件定義からリリースまで一貫して携わっています。1チーム15名、全体で20チームの大規模なアジャイル型のプロジェクトでとてもやりがいを感じてます。 また、北海道で暮らしながら東京の案件にフルリモートで参画という新しい働き方を実現しています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"ありがとうございます！早速ですが、転職活動を考えたきっかけを教えていただけますか？"},{"type":"answer","text":"前職では札幌拠点のあるSES企業に所属していましたが、評価制度が不明瞭で、自分の成果や努力が還元されないことに懸念を感じていました。給与体系が変わるという話もあり、「状況が改善されるかもしれない」と期待していたのですが、ほとんど変化がありませんでした。「この先どんなに頑張っても収入が増えない」と感じたことが、転職活動を始めるきっかけになりました。 また、営業の方に案件の単価や単価が上がったことを教えてもらえなかったことも、不透明さを感じた理由の一つでしたね。"},{"type":"question","text":"そうだったんですね...実際に転職活動ではどのような会社を探されていましたか？"},{"type":"answer","text":"評価制度が明確でクリアであることを重視し、且つフルリモートが可能な会社を探していました。前職では北海道内の企業の案件が多く出社が基本でした。コロナ禍の数ヶ月だけリモートで、その後はほとんどがフル出社でした。 転職活動を進める中で「フルリモートなら北海道以外の企業で働ける」と気づき、選択肢が広がりました。そのような会社を探していく中で、Visionary AIに出会いました！"},{"type":"question","text":"ありがとうございます！具体的には当社のどのような点に魅力を感じたのでしょうか？"},{"type":"answer","text":"『単価連動型のシンプルな評価制度』『案件情報の透明度の高さ』『北海道から東京の案件に参画できること』の3点です！ 特にVisionary AIは営業力が高く、豊富な案件が揃っている点が魅力的でした！北海道からでも東京のモダンな開発環境の案件に携われること、具体的な案件事例を面談で教えてもらえたことが信頼につながりました。 案件を選ぶ際も、単価・業務内容・工程などすべての情報を提供してもらえるので、自分の市場価値を把握したうえで案件を選ぶことができ、キャリアを築く環境として最適だと感じました。 また、前職は年功序列で、役職につかなければ年収が上がらない環境でした。平均年齢も高く、中堅層が埋まっている状態だったので「次に昇格するのは誰か」が予想できてしまう状況だったんです。Visionary AIの面談で提示された年収を達成するには、前職では10〜20年かかるだろうなと思い「今後の人生をより良くするためにも、このままではダメだ」と感じ、転職を決めました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/81940bda397f47a7b4e545e5c4ff2d6b/interview-B793yTuK-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"当社を選んでいただき本当に嬉しいです！実際に入社してみていかがですか？"},{"type":"answer","text":"年収やキャリアなど期待していた以上にプラスの変化がありました。特に年収は200万円以上上がりました！笑 実際に案件に参画するまでは、営業の皆さんから続々と案件が紹介され、その量にも驚きましたし、『営業力の高さ』を実感しました。これまでは会社都合で案件が決まる環境でしたが、Visionary AIの案件選択制では、自分の得意分野のスキルを伸ばしたり、新たな分野に挑戦したりと自分の意思で選べる点が良いなと思いました！"},{"type":"question","text":"「仕事を楽しみながらキャリアを築いていきたい」思いのあるKさんにとってマッチした環境で良かったです！その他入社後のギャップなどはありましたか？"},{"type":"answer","text":"入社して一番良い意味でギャップを感じたのは、社内のコミュニケーションが想像以上に活発だったことです！私は北海道で暮らしているので、普段皆さんと会う機会はないのですが、Slackのコミュニケーションが盛んなので、所属する様々なメンバーについて知ることができることが嬉しいです。 前職では数ヶ月に一度の飲み会くらいしかなく「どんな人と一緒に働いているんだろう」と知る機会があまりありませんでした。組織やカルチャーも大きく変化し、向上心が高く、日々勉強していることや学んだことを発信するカルチャーも素敵だと思います。資格を取得に向けて励んでいるメンバーなども多く、刺激をもらっています。 また、先日の全社会では、実際に多くのエンジニアメンバーと直接会い、その熱量の高さに驚きました。普段Slackで見ていた方々と話すことができ、とても有意義な時間を過ごせました。毎月開催されるオフラインの社内イベントも、東京に行く機会があればぜひ参加したいです！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"是非ご参加お待ちしております！現場でも活躍されていると伺っていますが、今後Kさんはどのようなキャリアを築きたいと考えているのでしょうか？"},{"type":"answer","text":"現在のプロジェクトではメンバーとして参画していますが、今後はリーダーやマネジメントに挑戦し、お客様と直接関わる立場を担いたいと思っています。 前職でもリーダー経験があるのでチームを引っ張っていける存在を目指していきたいですね。現場でパフォーマンスを発揮し、Visionary AIのメンバーの増員依頼をもらったり、そこからチームを作っていけたら良いなと考えています！"},{"type":"heading","text":"最後に"},{"type":"question","text":"Kさんがリーダーはとても頼もしいですね！今後もキャリアの実現へサポートできればと思います！最後に候補者に一言お願いします。"},{"type":"answer","text":"Visionary AIは入って絶対に後悔しない会社です！クリアな評価制度や高単価の案件、向上心のあるメンバーが揃っているので、スキルを磨いていける環境が整っています。 私も何度か転職を経験していますが、Visionary AIは本当に自分の成長を実感し希望を実現できる場所です。急成長中の会社と一緒に成長していける経験もできると思うので、ぜひ応募してみてください！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
