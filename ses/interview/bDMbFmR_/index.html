    <script id="interview-data" type="application/json">{"slug":"bDMbFmR_","role":"エンジニア","skills":"Java, CA","initial":"S.S","title":"望む仕事に集中！理想のエンジニアライフへ","tags":["高還元","評価制度","チーム参画","理念共感","社内業務なし","人と社風が好き"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/6d26ff040a7d442b9258d1360b572f2c/s-600x412_513ea081-4fea-41f7-8f9e-8f0f40e31056.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/52a75267bfe84189926f268a95f236db/interview-bDMbFmR_-top.webp","alt":"望む仕事に集中！理想のエンジニアライフへ"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"新卒からエンジニアとして約10年間経験を積んでいて、JavaとC#を中心に、基本設計〜結合テストまで幅広く経験してきました。現在は、上流から案件に参画し、医療向けのWebアプリやデータ連携のAPI開発（Java／Spring）を担当しています。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"エンジニアとして10年以上活躍されているSさんが、転職活動を始めたのはどのようなきっかけがあったのでしょうか？"},{"type":"answer","text":"転職活動は、社内の評価制度や給与制度の曖昧さに不信感を抱くようになったことに加え、社内業務量が増えてしまい、負担を感じるようになったことをきっかけに始めました。自分の評価に対してというよりは、客先常駐である以上、同じ現場で働いていない部下メンバーを私が評価するという仕組みに違和感を感じていました。 また、昇給の仕組みや案件情報の詳細も社内で開示されていないため、幹部と部下の板挟みになりながら双方と会話を求められる立場であり、正直エンジニアとして働く上で本来やりたいことに集中できる環境ではなかったです。"},{"type":"question","text":"そういった経緯があったんですね。役職があるからこその葛藤の中、新たな環境としてVisionary AIを選んだ決め手を教えてください！"},{"type":"answer","text":"内定を頂いた後はすぐに入社を決めました。決め手となったのは、①社内の無駄な業務がなく自分のやりたいことに集中できて自由に働けること、②高還元率であること、この2点です。 また、面談で代表から熱量のこもった思いや、それぞれの仕組みの背景を伺い「エンジニアとして希望のキャリアを築くために、これ以上の環境はない」と強く実感しました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/1ee09d189e374550a8895a7f9dbd7784/interview-bDMbFmR_-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"Sさんが内定承諾をしてくださったと伺ったときに、社内もとても盛り上がりました！実際に入社してみて、ギャップはなかったですか？"},{"type":"answer","text":"入社前に想定していたこととギャップはなく、ポジティブな気付きは多くあります。最も驚いたのは、年収が前職と比較し約240万円もUPしたことです(笑)　面接時にも伺ってはいましたが、本当にここまで収入UPするとは思っていなかったので...。早速、好きなオーダーメイドのスーツやゲーム用の椅子を新たに購入しました！ また、Visionary AIはエンジニアチームに役職がなくフラットな組織なので、社内業務や望まない仕事からも開放されて、プレッシャーなくのびのびと働けるようになりました。 営業メンバーのサポート頻度も自分の希望に合わせて実施いただいているので、不安な点もなく働くことができています。前職だと、案件に参画する直前と最後しか営業と関わる機会がなかったので、エンジニア一人ひとりを気にかけていただいているんだなと実感しますね。"},{"type":"question","text":"プライベートや働き方でも素敵な変化があり、とても嬉しいです！人間関係やカルチャーについての印象もお聞きしたいです！"},{"type":"answer","text":"そうですね。社内は若手の優秀なエンジニアメンバーも多くとても活気があり、帰属意識も高いことにも驚きました。勝手な印象ですが、還元率の高いSES企業は給与が高い分、組織での交流等は少なく、ドライな社風だったり、サバサバとしたエンジニアが多い印象だったので。 前職だとQiitaの執筆や社内の勉強会開催も会社からの指示で実施していたのですが、Visionary AIのエンジニアメンバーは主体的に学んだことをアウトプットする方が多く、常にSlackが活発に動いていることも凄いなと思います。 もちろん、社内交流も強制参加ではないのですが、組織に属する一員として他のメンバーのことも覚えたい、自分も覚えていただきたいなと思い、都合がつくときには社内イベントにも参加しています。様々な経験を持つエンジニアと話すことが出来るのでとても有意義です！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"社内イベントにも参加いただき、ありがとうございます！今後、エンジニアとしてはどのようなキャリアを描いていきたいと考えているのでしょうか？"},{"type":"answer","text":"これまで経験してきたことを活かして着実にスキルアップし、エンジニアとしての市場価値を上げていきたいですね。今までは基本設計〜携わる機会が多かったので、今後は要件定義、PM・PLなどプロジェクト全体を見る仕事にも挑戦していきたいと思います。"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"エンジニアとして「スキルアップがしたい」「正当な評価制度のもと、収入を上げたい」「自分のやりたいことに集中して仕事がしたい」等の希望がある方には、特に最適な環境だと思います。SESで働くエンジニアにとっては、自分のように社内業務を苦に感じる方も多いと思います。やりたいことがある方にとっては、それを叶える組織と仕組みが整っているVisionary AIをおすすめしたいです。 先日、一緒の案件にチーム参画している後輩と飲みに行ったのですが、「この会社に入れてよかったね」という話をしました！転職を考えている友人のエンジニアにも、次会うときに声をかけたいと思います！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
