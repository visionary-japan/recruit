    <script id="interview-data" type="application/json">{"slug":"JZUd8uYW","role":"エンジニア","skills":"Java, C#","initial":"A.K","title":"一人ひとりの思いが大切にされる組織！働き方もキャリアもカスタマイズ","tags":["案件選択制","人と社風が好き","ワークライフバランス","好きな場所で働く","社内業務なし","評価制度","チーム参画"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/9d476b9ff75e46f29f55e3d3ef321879/s-600x412_ed93f90f-914a-4e79-8fb7-9c1362d003d0.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/63b8dd2aa7f549f3bce1b71285c32874/interview-JZUd8uYW-top.webp","alt":"一人ひとりの思いが大切にされる組織！働き方もキャリアもカスタマイズ"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴を教えてください！"},{"type":"answer","text":"はじめまして！エンジニア歴は今年で11年目になり、主にJavaやC#でのWebアプリケーションの開発に携わっていました。経験年数は長くなりつつありますが、未熟な点もまだまだあり、新しいことに挑戦したいなと思いVisionary AIに入社しました。 現在は、モノづくりを支える企業のECサイトのリプレイス案件にチームで参画しています。Javaはこれまでも長く使ってきているのですが、ECサイトは初めての領域でして、色々とインプットしながら進めています。 ECサイトは使用するユーザーの幅が広いため、誰でも使いやすいように作ることを意識して取り組んでいます。想定外の動きがあってもエラーが生じないよう細部まで配慮して設計しなければならないので考えることは多いのですが、その分やりがいや成長機会にも繋がっています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"クライアントからの評価もとても高く優秀なKさんのお話を聞くのを楽しみにしておりました！これまで大手企業でキャリアを築かれていたと思いますが、転職を考えたきっかけを伺えますか？"},{"type":"answer","text":"よろしくお願いします！これまでは大手SIerに勤めていました。一つの業種やクライアントと長く一緒に仕事をすることがメインで、しっかり信頼関係を築くことのできる楽しさを経験してきました。 ただ、エンジニアとしての今後を考えた時に『今後はもっと色々なことに挑戦してみたい、経験してみたい』という気持ちがありまして...。今の環境だと、ルールやキャリアマップも可視化されている分、すぐに自分のやりたいことや希望を実現するのが難しいだろうと思ったんです。 「案件の自由度の高さ」「給与・評価制度」「カルチャー」を考えた結果、SESの方が今の自分が求める環境にマッチしているのではないかと思い、転職活動を始めました。"},{"type":"question","text":"様々な思いや経験があって、今後は新たな環境に進もうと考えたのですね！転職活動を進めていく中で、Visionary AIを選ばれた理由を教えていただけますか？"},{"type":"answer","text":"案件選択制や高還元の仕組みなどにも魅力を感じていましたが、最終的な決め手は代表の小野さんでした。面談を通して『この代表が創る会社で働いてみたいな』と率直に思ったんです。 また、面談で「社内の雰囲気を知りたい」と伝えたところ、実際にSlackを使ったコミュニケーションやエンジニア同士がコミュニケーションを取っている様子なども紹介いただき、「こんな活気あふれる会社があるんだ」と驚きました。「逆にこのカルチャーに馴染めるかどうか不安もあります」と相談したところ、小野代表から「Visionary AIは一人ひとりの思いや価値観を大切にしているので、無理に合わせる必要はない。Kさんも自分の価値観を大切に、自分らしくいてほしい」と言っていただけたのがとても嬉しかったんです。『必ずしも枠に合わせる必要がなく、自分の考えや仕事の価値観を尊重してもらえるんだ』という安心に繋がりました。"},{"type":"question","text":"Visionary AIの理念としても、一人ひとりの価値観を大切にしているので共感いただけてとても嬉しいです！大手SIerからベンチャー企業に転職することに懸念はありませんでしたか？"},{"type":"answer","text":"もちろん私の中でも大きな決断ではありましたし、当初不安もありました！ ただ、選考途中に社員インタビューを拝見し、多くのメンバーが生き生きと楽しそうに働いていることがわかり、その不安は解消されました...！Qiitaも会社の取り組みとして注力されていて、技術力も向上心も高いメンバーが多い印象を受けましたし、入社前からたくさんの社員の顔や活躍、働き方がわかったことがより安心に繋がりました。 大手企業だからこそ良い点もたくさんありましたが、大手企業ならではのルールや社内業務の多さ、評価制度の曖昧さなども解消されるので、ベンチャーにはベンチャーの良さがあるなと思いました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/06b91acca35e4d4e8e1ae77ffa322c28/interview-JZUd8uYW-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"多くの企業がある中で、Visionary AIを選んでいただきありがとうございます！実際に入社してみていかがですか？"},{"type":"answer","text":"社内業務の負担がなく、エンジニアの仕事に集中できる環境が整っていることに感動しました...！営業チームの皆さんのサポートも充実していて、希望に合った案件を10件ほど紹介いただき、その中から元々興味のあったECサイト分野で、上流工程やJavaの経験を活かせる案件に参画することができました。 また、これまでの会社では案件によって、いつクライアントから連絡が来るかわからず、休みの日も携帯が手放せない...なんてこともあったんです。今は残業もほとんど無いですし、土日もゆっくり過ごすことができるので、メリハリのある生活を実現できています。現在は兵庫県で夫と暮らしているのですが、旅行が好きなので週末は出かけることも多いです！ 年収が上がったことも嬉しいですね！単価連動型で、自分の市場価値がダイレクトに収入に繋がるのでモチベーションにもなります。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Kさんの希望のキャリアや働き方を実現できて良かったです！ビジネスパーソンとしても、エンジニアとしても優秀なKさんですが、今後はどのようなキャリアを築きたいと考えているのでしょうか？"},{"type":"answer","text":"これまで様々な経験を積み重ねてきましたが、技術的にはまだまだ学ぶべきことが多いと感じています。今後はフロントや、AWSなどのクラウド領域の知見も深め、フルスタックエンジニアを目指していきたいと考えています！技術の専門性を高めるのはもちろんですが、要件定義などの上流工程やマネジメント領域にも興味はあるので、経験を活かして様々なキャリアを検討していきたいなと考えています。 そのためにも、まずはそれぞれのプロジェクト先で求められる人材となり、成果を残していくことに集中していきたいです！顧客と近い距離で仕事をしていた頃から「誰かのためになる仕事がしたい」と思い、感謝されることが一番のやりがいだと感じていました。これからも成果を残し続けて、顧客や開発チームに貢献できる人材として活躍できたら良いなと思っています。"},{"type":"heading","text":"最後に"},{"type":"question","text":"今後のKさんの活躍が楽しみですし、Visionary AIのメンバーも今後どんどん任せていきたいなと思います！最後に、転職を考えている候補者に一言お願いします！"},{"type":"answer","text":"求人情報やHPだけでは、実際の雰囲気やカルチャーまで伝わりにくいかもしれませんが、まずは面談で小野代表と話してみてほしいです！新しい会社、環境に対する不安は誰しもあると思いますが、入社してみて私はマイナスのギャップは一つもありませんでした。営業の方も、エンジニアの皆さんも信頼できる良い方なので、不安を感じている方がいれば「大丈夫ですよ」と自信を持ってお伝えしたいです！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
