    <script id="interview-data" type="application/json">{"slug":"tA7fPjKq","role":"エンジニア","skills":"JavaScript, PHP","initial":"S.S","title":"SESの懸念を解消！心強い営業チーム","tags":["営業力の高さ","スキルアップ支援","心理的安全性","人と社風が好き","サポート体制"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/958c91616a684f4f8a8a163f3468b324/s-1024x683_v-fs_webp_29095ebe-1f51-409c-8a0a-da55d5a0c4af.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/a50e828548954efabc3c7863e0b6aff1/interview-tA7fPjKq-top.webp","alt":"SESの懸念を解消！心強い営業チーム"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"簡単に自己紹介をお願いします。"},{"type":"answer","text":"元々雑貨店で接客業に従事していたのですが、どこでも働ける技術を身に付けたくエンジニアに転身を決意し、SES企業に入社しました！ その後、Visionary AIに転職し、今は旅行会社のHPに新機機能を追加・修正したりするプロジェクトに参画しています。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"早速ですが、Visionary AIに入社する前は、SESにあまりよくないイメージを持っていたと伺いましたが、、"},{"type":"answer","text":"前職のSES企業では案件がなかなか見つからなかったり、希望する案件が見つかっても入るまでに待機があったり、、、。 また、未経験からエンジニアに転身したのでフォロー体制やスキルアップ環境も重視していましたが、実際には何も整っていなかったりと、SESという業態に不信感や不安が募っていました。"},{"type":"question","text":"そんな中でもVisionary AIを選んだ理由は何ですか？"},{"type":"answer","text":"正直、それまでの経験もあり、フォローが万全な受託企業を選ぼうと考えていました。その中で唯一選考を受けたSESであるVisionary AIに入社したのは、案件参画前後の『サポート体制』と『スキルアップ環境』が決め手でした！ 社長をはじめ、役員や営業のフォローの手厚さ、一人ひとりのエンジニアと向き合う姿勢など、徹底的に寄り添うサポート体制に惹かれました。その中でも一番驚いたのはレスポンスの速さです。 印象的だったのは、、、一次面接の日に「弊社の営業メンバーなら安心してキャリアを任せられると思うので、是非一度会ってみませんか」と社長に言われ、その当日に営業との面談も行われた事です（笑）候補者や社員としっかり向き合い、本気で考え、一人ひとりを大切にしているんだなということが伝わってきました。"},{"type":"question","text":"『スキルアップ環境』はどうですか？"},{"type":"answer","text":"案件選択が自由なので、身に着けたいスキルから逆算して自分で案件を選ぶことができます。 例えば私の場合、いつかは地元に戻りたいので、フルリモートでも働けるくらいスキルを高めたいと思っています。そのためには「今何をするべきか、どんなスキルを身に着けるべきか」が明確になるので、そのスキルを身に付けられる案件を選びました！ また、意欲的なメンバーが多く、情報発信や自発的な勉強会も沢山行われています。現場や独学で得た知識をQittaで発信したり、Slackで技術に関する相談をすると他のメンバーからすぐにアドバイスをもらえたりと、積極的な情報交換が行われています。 自発的な勉強会に関しては、週に3回現場や独学で学んだ知識をアウトプットする場として開催されています。「最近新しく学んだことを、来週共有していい？」など、自発的なコミュニケーションがとても多く、ナレッジ共有も盛んです！勉強会主催者には手当が出るのも嬉しいですね！ 正直、前職の経験から不安もありましたが、すぐにマッチする案件を探してくれたり、面談対策を実施してくれたり、こまめに連絡してくれたので不安はすぐに解消されました。案件毎に環境も異なるので戸惑うこともありますが、いつも役員や営業が気にかけてくれ、案件先への働きかけやフォローをしてくれるのは本当に助かっています！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/220f409b0c294fa8b82e83ed3d4ff1d0/interview-tA7fPjKq-body.webp","alt":""},{"type":"heading","text":"今後の目標"},{"type":"question","text":"今後、Visionary AIでどんなことをやっていきたいですか？"},{"type":"answer","text":"ゆくゆくは自社メンバーと一緒に、自社プロダクトの開発にチャレンジしたいです！ 後輩の面倒を見るのも好きなので、PMやPL等にも挑戦できるようになりたいですね！その為にもまずは、今の案件でしっかりスキルアップをしたいと考えています！"},{"type":"heading","text":"最後に"},{"type":"question","text":"転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"ここまで社員一人ひとりと向き合ってくれる会社は他にはないと思います。 経験値、スキルアップ環境、年齢、金銭面、人生の転機…色々な理由でキャリアに迷うと思いますが、エンジニアをはじめ、役員・営業が全力でサポートしてくれる環境なので、1歩を踏み出したい方にこそVisionary AIをおすすめします！"},{"type":"question","text":"素敵なメッセージを有難う御座いました！"}],"featuredOrder":1}</script>
