    <script id="interview-data" type="application/json">{"slug":"RFY5b83A","role":"エンジニア","skills":"Network","initial":"H.S","title":"頑張ることだけが正解じゃない。自分のペースで働ける場所","tags":["評価制度","リモートワーク","心理的安全性","サポート体制","人と社風が好き","ワークライフバランス"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/6163164774e942deb7671dea2e806938/s-600x412_95e51f52-69c9-4c05-8b45-e4b4ee142f2e.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/2d77898fbe654af693a731da27616352/interview-RFY5b83A-top.webp","alt":"頑張ることだけが正解じゃない。自分のペースで働ける場所"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"元々水族館の飼育員だったと伺いました！飼育員からエンジニアになるってとても大胆なキャリアチェンジで驚きました...！"},{"type":"answer","text":"そうですよね（笑）エンジニアへのキャリアチェンジは全く考えていなかったのですが、ある時家庭の事情で地方に引っ越す可能性が出まして...。地方飼育員の求人数の少なさや将来性を考えたときに「もっと長く働けて収入面も安定した仕事に就きたい」と思うようになり、自身のキャリアを見つめ直した事がきっかけでしたね。 当時はちょうどコロナ禍だったこともあり、将来性のあるIT業界でエンジニアにキャリアチェンジしようと決意しました。あと「エンジニアだったらリモートワークでも働けそうだな」と思ったのも理由の一つですね（笑） 今はネットワークエンジニアとして、大手キャリア向けの環境構築案件に参画していてリモートワークで働いています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"SさんがエンジニアにキャリアチェンジしてからはVisionary AIは2社目だと伺いました！なぜVisionary AIに転職したのでしょうか？"},{"type":"answer","text":"大きく2つの理由があります。1つ目は、その当時に参画していた案件でリモートワークが出来なくなってしまったからです。コロナが落ち着いてきた2023年から会社のルールとして出社が強制されてしまい...出社しないとできない作業でもないのに「会社のルールだから」という理由で、全員の出社が強制されることに対して違和感を感じ、転職を考えるようになりました。 2つ目は評価制度です。前職もSES企業だったのですが、評価基準が「現場業務」と「自社業務」の2軸で設けられていました。その中でもエンジニアの業務ではない自社業務の頑張りの評価比重が重く、どんなに現場で頑張ったりスキルアップで評価されたとしても、社内で展開されている学習動画の視聴や資格取得をしていないと、社内の評価には繋がらなかったんです。そういった環境に疑問を抱くようになった事が理由の2つ目です。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/f60315164f54492ca579d273b6edab45/interview-RFY5b83A-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"そういった背景があったのですね...。入社後にギャップは感じませんでしたか？"},{"type":"answer","text":"希望していた通りの働き方、仕事が実現できているので、ギャップは一切ないです！ 今参画してる案件は基本フルリモートで、1~2ヶ月に出社が1回あるかどうかという程度なので、希望通りの働き方をできています！私の技術レベル的にも、出社が必要ある案件がほとんどだと思っていたので、希望を叶えることができてとても嬉しいです。 また、面談に落ちてしまった時も、落ちた理由を教えてもらえますし、次回落ちないようにするためのフィードバックも詳しく営業の方から頂くことができます。希望通りの案件に入る為に、しっかりサポートしてくれるのはとても心強かったですね。 また、自社業務に関しても経費精算と勤怠申請の2つだけなので本当に満足してます！"},{"type":"question","text":"入社後も満足いただけて嬉しいです！私生活でも、新しい変化はありましたか？"},{"type":"answer","text":"寝る時間が1時間増えました！毎朝元気よく起きれる分、30分くらい散歩に行くことができたり、何も考えない時間を作ることでリフレッシュすることができたり...。私は“無になる”時間が好きなので、こういう時間を増やすことができて嬉しいです。 趣味の読書やヨガをする時間も以前より増やすことができたりと、心に余裕のある生活を送れるようになりました！"},{"type":"question","text":"日常のちょっとした幸せの時間が増えるってとても嬉しいですよね！転職時に重要視されていた評価制度に対してはどのような印象ですか？"},{"type":"answer","text":"そうですね。前職では会社から求められる事を頑張らないと評価に繋がらない会社だったのですが、弊社であれば、自分のペースで仕事をする人も、とにかく頑張りたい！という人もどちらも評価される会社なので、私らしくいられるなと感じます。 案件をエンジニア本人が自由に選べるので、働き方はもちろん、キャリアチェンジ・キャリアアップ等も自分次第で選択できるのはキャリアを築いていく上でもとても嬉しいです。 弊社であれば「エンジニアとしてスキルアップに集中したい」という頑張りたい時には成長重視の案件に入ったり、「プライベートを重視してゆっくり働きたい」という時には、リモートワークやフレックスタイム制の案件に入ったり...頑張る人だけが評価される会社ではなく、頑張りたい時は頑張って、のんびりしたい時はのんびりできる会社だと思います。ここまで自由に任せてもらえていることは、会社からもエンジニア一人ひとりがとても信頼されているんだなと思いますね。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"「一人ひとりの価値観を大切にしたい」という思いを形にした制度なので、そう言って頂けて嬉しいです！Sさんは今後どのようなキャリアを築いていきたいと考えているのでしょうか？"},{"type":"answer","text":"まずは目の前の仕事を一生懸命頑張って、将来的にはクラウド領域のAWSにも挑戦したいと考えています。プライベート面では、ゆくゆくは「週3〜4勤務や半年働いて半年休む」みたいな自由な働き方ができたらいいなと思いますね。"},{"type":"heading","text":"最後に"},{"type":"question","text":"Sさんの今後の活躍もとても楽しみです！最後に、転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"本当に自分の理想通りの働き方やキャリアが実現ができる会社だと思います。転職を考えている人はもちろん、具体的に転職を考えていない人でも、外に目を向けたら自分の希望を叶えられることに気づくと思うので、まずは一度話を聞きに来てほしいです！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
