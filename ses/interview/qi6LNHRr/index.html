    <script id="interview-data" type="application/json">{"slug":"qi6LNHRr","role":"エンジニア","skills":"Java","initial":"R.O","title":"転職フェアがきっかけに！透明度の高さと人に魅力を感じて","tags":["案件選択制","評価制度","リモートワーク","人と社風が好き","営業力の高さ","チーム参画"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/3b0308abbcc34537a906de5554e4ccb1/s-600x412_9f7d34fb-6a48-43f4-a3a9-a1f515b090cd.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/864a6640184f41a1ad306bb4ac0207d5/interview-qi6LNHRr-top.webp","alt":"転職フェアがきっかけに！透明度の高さと人に魅力を感じて"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"私は九州出身なのですが、2021年の夏にエンジニアを目指して東京に上京しました！新卒から2年間はメーカーの営業をしていましたが、コロナ禍で外に出る機会が減り、時間に余裕ができたことで「何か新しいことを始めたい」と思い、オンライン学習でRubyを学びました。その経験から「ものづくり」に興味を持ち、思い切ってキャリアチェンジしました。 現在は、大手銀行のtoB向けシステムの大規模プロジェクトの要件定義フェーズから携わっています！社内で仲の良いメンバーと共にチームで参画しており、目標にしていた上流から入ることもできたので大きなやりがいを日々感じています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"初めてOさんにお会いしたのは転職イベントでしたよね！転職フェアに足を運んだ理由や、ブースに来るきっかけになったエピソードはありますか？"},{"type":"answer","text":"そうですね！当時は転職活動を本格的に進めていたわけではなく、情報収集目的で転職フェアに参加しました。前職にもお世話になっていたのですが「職場で懸念に感じていることを解消できる環境があるのか」気になり、様々な会社を見てみようと思ったんです。そこで偶然、Visionary AIの採用担当の方に声をかけてもらい「試しに話を聞いてみよう」と思いブースに行きました。"},{"type":"question","text":"前職で「解消したい」と感じていたことはどのようなことだったのでしょうか？"},{"type":"answer","text":"「案件の自由度が低い」と「評価制度が曖昧である」の2点を解消したいなと感じていました。1点目の案件の選択については、エンジニアの希望を聞いてはくれるものの、会社都合で勝手に案件の延長が決まってしまうこともあり希望の実現はしていなくて…。会社員だしそのような状況も仕方ないとは思いつつ「もっとやりたいことに挑戦したい」という気持ちがあったので、主体的にキャリアを描ける環境が良いなと思っていました。 2点目の評価制度については、前職では”現場での活躍＋社内の様々な活動への貢献”が評価される制度でした。現場が一緒ではない上長から技術や業務のフィードバックなどを受ける環境でもあり、私としては「現場で自分の成長や活躍を知っている方から評価されたい」「エンジニアとしての成長が評価に繋がる環境で働きたい」と考えていたので、この2点が実現できる会社があれば、転職も検討したいなと思っていたんです。"},{"type":"question","text":"そうだったんですね！実際に転職フェアでも様々な企業の話を聞かれたり、面談を受けていたと思うのですが、最終的にVisionary AIに入社を決めたご理由を教えていただきたいです！"},{"type":"answer","text":"実際に転職フェアでも3~4社ほど話を聞きました！前職で懸念に感じていた2点を解消できる会社は他にもあったのですが、Visionary AIは開示いただく情報量や透明度の高さ、自分の希望に対して「こんなキャリアロードマップが良いのではないか」といった具体的な提案を頂けたことが信頼に繋がりました。「ここまで自分のことを真剣に考えてくれるんだ」ということにも本当に驚きました！ 面談後に代表からのメッセージにも共感し「この会社で働きたい」と強く思い入社を決めました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/6dc266093c6c437cbd6ce122b4579000/interview-qi6LNHRr-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"ありがとうございます！社内でもOさんの「Visionary AIらしさ」が話題になっていたので、内定承諾いただけたことが本当に嬉しかったです！実際に入社してみてどうでしょう？"},{"type":"answer","text":"案件が決まるまでの過程では、営業チームの営業力の高さを早速実感しました！自分の意思を尊重していただける点や、複数の案件の面談を同時進行で受けれる点などがエンジニアファーストだと感じましたし、希望していた上流工程の案件に入れたことがとても嬉しかったです！ 単価連動型のシンプルな評価制度も、仕事に取り組むうえでモチベーションに繋がりますし、年収が上がったので美味しいものも沢山食べに行けるようになりました（笑）"},{"type":"question","text":"希望の案件に参画することができて嬉しく思います！前職の環境と変わった点などはありますか？"},{"type":"answer","text":"一緒に働くメンバーやカルチャーが大きく変化したなと感じています。入社して一番驚いたのは『社員の熱量の高さ』でした！毎週のように勉強会が開催されていたり、日々技術や学んだことに関して発信しているメンバーが多く、仲間の頑張りが自分のモチベーションにも繋がっています。社内イベントでも同世代のJavaメンバーと繋がることができ、社内で新たな仲間と出会えたことがとても嬉しいです！"},{"type":"question","text":"いつも社内イベントにも来てくださってありがとうございます！先日開催された全社会に参加してみてどうでしたか？"},{"type":"answer","text":"とにかく、モチベーションが爆上がりしました！！現場やチームで活躍し表彰されているメンバーを見て、自分も頑張ろうと刺激を受けましたね。今後の会社の方向性やキャリアを築いていくうえで大切なポイントを知ることができ、今自分ができることから着実に取り組んでいきたいなと思いました。 前職では全社で集まる機会がなかったので参加できたことが嬉しかったですし、普段会うことのできない全国のエンジニアの仲間と話すことができて良かったです！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Visionary AIは九州出身や在住メンバーも多いので、共通点も多く盛り上がっていましたよね！今後の活躍が楽しみなOさんですが、エンジニアとしてはどのようなキャリアを築いていきたいのでしょうか？"},{"type":"answer","text":"入社当初から掲げている目標ではありますが、もっと上流工程をこなせるエンジニアを目指したいですね。しっかりスキルを身に着けたらマネジメントにも挑戦していきたいです！ ゆくゆくは、営業職で培ったコミュニケーション力なども活かして、よりユーザーと近いところで開発に携われるようなエンジニアになれたら良いなと考えています！"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます。キャリアの実現に向けて全力でサポートできればと思います！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"エンジニアは働く中で、キャリアに悩む方がとても多いのではないかと思います。Visionary AIであれば、その悩みに真摯に向き合ってくれる頼もしい営業やエンジニアが集まっているので、安心してキャリアを築くことができます！ また、Visionary AIは一人ひとりの価値観を大切にしてくれる会社なので、仕事はもちろん、プライベートの時間も大切にしながら、人生そのものをより豊かに充実させられると思います！ 少しでも興味を持っていただいた方は、ぜひ思い切って応募してみてください！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
