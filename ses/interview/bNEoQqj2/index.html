    <script id="interview-data" type="application/json">{"slug":"bNEoQqj2","role":"エンジニア","skills":"Java, JavaScript","initial":"R.K","title":"石川×フルリモート！東京水準の待遇や働き方を実現！","tags":["評価制度","スキルアップ支援","モダンな開発環境","好きな場所で働く","ワークライフバランス","リモートワーク"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/86c42f3f01ef462f92d1c30c1d884891/s-600x412_724fc13d-40de-48ab-af93-d3b7acdfe397.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/11c826f30d704403a31f0ea2afe72001/interview-bNEoQqj2-top.webp","alt":"石川×フルリモート！東京水準の待遇や働き方を実現！"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"簡単に自己紹介をお願いします。"},{"type":"answer","text":"新卒で入社した地元のIT企業で、エンジニアとして要件定義から保守対応まで7年間ほど勤務していました。親会社が東京にあった関係で、定期的に東京出張もしていました。 仕事自体にやりがいは感じていたのですが、自分のキャリアや給与などの希望が反映されにくい環境だったので、それを改善したいと思い、転職活動を始めました。 様々な会社を見ていく中で、Visionary AIの評価制度の透明性や自分の成長を可視化できる点に惹かれて転職を決めました。"},{"type":"question","text":"評価制度の透明性というと・・・"},{"type":"answer","text":"そうですね。前職では評価基準が不透明だったこともあり、「頑張っているね」という言葉はもらえても、”見える形”での評価はあまりなく、自分自身の成長を実感できませんでした。 Visionary AIは、単価連動制を導入しているので、スキルアップした分、キャリアも実現でき、給与も上がるので、モチベーションが維持しやすい環境だと思いました。"},{"type":"heading","text":"入社してみて"},{"type":"question","text":"モチベーションが維持しやすい環境なんですね！実際に入社して感じたことはありましたか？"},{"type":"answer","text":"とにかく成長機会が多い環境だと実感しています（笑）。 前職では会社が用意した案件に参画するような、自分の意見を言わなくても受け身な環境でした。Visionary AIでは豊富な案件の中から自分で選択するので、キャリアを見つめ直す機会になり、将来に対しても能動的に考えて行動するようになりました。 現在参画している案件でも、自分の意見を発信することができ、裁量を持って働ける環境なので、自分がチームの一員として貢献できることに対してやりがいを感じています！"},{"type":"heading","text":"働き方について"},{"type":"question","text":"今後のKさんの成長が楽しみです！現在は、新しい働き方にも挑戦しているんですよね！"},{"type":"answer","text":"そうなんです！ 以前は常駐＋定期的な東京出張もあり、なかなかプライベートの時間を作ることができませんでした、、、。 今は地元石川にいながら東京のモダンな案件にフルリモートで参画しています。フルリモートになれるまでは少し時間はかかりましたがだんだん慣れてきました！仕事が終わったらすぐに、大好きな愛犬の散歩に行けるのは嬉しいですね（笑） 大好きな地元にいながら、東京水準の待遇、東京のモダンな案件、自分らしい働き方の実現ができるとは思っていなかったので、驚きです！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/060321add70741268213bfb1732fad9f/interview-bNEoQqj2-body.webp","alt":""},{"type":"heading","text":"キャリア像について"},{"type":"question","text":"描いているキャリア像を教えてください。"},{"type":"answer","text":"前職では1年ほど、上流工程から離れていたので、設計〜開発工程に改めて挑戦していきたいです。 フルリモートでの働き方も含めて、まずは仕事に慣れる事を優先していますが、将来的にPMやPLになれるように徐々にスキルアップしていきたいです。"},{"type":"heading","text":"最後に"},{"type":"question","text":"転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"転職するにあたって、どうしても不安や迷いは生じると思います。 僕自身も7年勤務した会社から転職する際に沢山考えましたが、勇気をもって一歩を踏み出した結果、理想の働き方を手に入れられました。 「大好きな地元で働きたい」「エンジニアとしてこんな事に挑戦したい」など描いている理想があるのであれば、是非、勇気をもって一歩踏み出してみてください！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
