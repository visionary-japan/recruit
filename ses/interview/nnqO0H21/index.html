    <script id="interview-data" type="application/json">{"slug":"nnqO0H21","role":"エンジニア","skills":"Java","initial":"Y.Y","title":"友人が活き活きと働く姿に共感し、リファラル入社！","tags":["案件選択制","リモートワーク","人と社風が好き","チーム参画","リファラル入社","サポート体制"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/2582e712d67640daa2c334ad4188d7b5/s-600x412_8d7152c7-587d-4399-ae3b-0be0f2c73193.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/f7dcf7cd305f47e5991ec0db24178bf0/interview-nnqO0H21-top.webp","alt":"友人が活き活きと働く姿に共感し、リファラル入社！"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"公務員からエンジニアにキャリアチェンジし、友人の紹介でVISIONARY AIに入社しました！現在は、社内でも仲が良く尊敬しているメンバーと一緒に、大手銀行のtoB向けシステムのプロジェクトに参画しています。システムのリプレイスを担当し、要件定義を終え、これから基本設計に入っていくフェーズです。 画面ごとに設計書を書いて、日々レビューして頂きながら一つずつ学んでいます。私自身、上流工程は初挑戦なのでとても良い経験になっています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"持ち前の明るさと優しさで、VISIONARY AIを盛り上げてくれているYさん！早速ですが、転職活動を考えたきっかけを教えていただけますか？"},{"type":"answer","text":"前職では、未経験からエンジニアとして基礎を学ぶことができました。しかし、学んだスキルを実務で活かす機会がほとんどなく、会社都合で案件が決まってしまい、エンジニアとしてスキルを高めることができない案件状況でした...。「もっとエンジニアとして成長したい」という思いから転職活動を始めました。 そのタイミングで仲の良い友人と飲みに行く機会がありまして...！友人も最近転職したなと思い話を聞いてみたら「今俺がいる会社(VISIONARY AI)めっちゃ良いよ！！！」と言われたんです（笑）"},{"type":"question","text":"それが「VISIONARY AI」との出会いだったんですね...！嬉しい限りです！！"},{"type":"answer","text":"そうなんですよ（笑）話を聞いていくうちに、案件選択制や働き方、還元率の高さ、組織の雰囲気など様々な特徴に惹かれ「こんな理想の会社があるんだ」と思ったんです！ 友人に聞いたら「紹介できるよ」と言われて「そんな簡単に選考に進んでよいのか！？」と思いましたが、早速小野代表との面談の機会をいただけました！"},{"type":"question","text":"そうだったんですね！転職活動も進めていた中で、VISIONARY AIを選んでいただいた決め手を教えて下さい！"},{"type":"answer","text":"一番の決め手は、大切な友人からの紹介だったこともあり「全てにおいて信頼できる」と感じたことですね！ 当時は他にも各社様から有難く内定を頂いていたのですが、「今はもっと開発工程の経験を積みたい」思いがあった中で顧客折衝などの上流のみがメインだったり、他にも案件の参画期間が数年間と長期になり、希望のキャリアに応じて柔軟に環境を変えることができない点があったり、各社様毎に何かしらの不安を感じていました...。 VISIONARY AIは自分自身で案件を選び、希望のキャリアを作ることができる点、スキルアップや経験次第で給与が上がるというシンプルな評価制度が整っている点が自分の希望の働き方や仕事の価値観にマッチしている最適な環境だと思いました。 また、友人と一緒の会社で働けることも嬉しいなと思い入社を決意しました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/dc351859c18f471eaea32234ba4441ee/interview-nnqO0H21-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"Yさんに入社いただけて本当に良かったです！実際に入社してみてギャップなどはありませんでしたか？"},{"type":"answer","text":"ネガティブなギャップは全くなかったです！案件に参画するまでも、営業チームの皆さんから希望に合った案件を複数紹介いただき「エンジニアの意思が尊重され、自由に選ぶことができる」制度が本当に実現されているんだなと実感しました。エンジニアに寄り添って提案頂けるという姿勢もとても嬉しかったです。 また、前職では案件参画後に営業から連絡が来ることがほとんどなかったのですが、VISIONARY AIの営業チームはとても気にかけてくださるので、フォローの手厚さに驚きました...！"},{"type":"question","text":"Yさんは同年代のJavaエンジニアメンバーOさんとのチーム参画でしたよね！"},{"type":"answer","text":"そうなんです！Oさんは同世代のエンジニアメンバーなのですが、僕よりも経験が長いので頼れますし、同世代だからこそ自分自身も「もっと頑張ろう」と日々モチベーションにも繋がります。現場でも席が隣なので、わからないことが聞けたり、お昼を一緒に食べたりと、とても働きやすい環境でやりたいことに集中することができています！"},{"type":"question","text":"プライベートでも仲が良いと思いますし、一緒に頑張る仲間と働けるのって良いですね！Yさんは社内イベントにもよく参加していると思いますが、エンジニアチームの印象はいかがですか？"},{"type":"answer","text":"僕自身、人と関わることがとても好きなので、一緒の会社で働くメンバーとはたくさん関わりたいと思っています！エンジニアチームも聞いていた以上に活発的で、向上心の高いメンバーが多いと実感しますね。 特に社内でも技術に関する発信や勉強会を開催しているメンバーと話した際には「同じく異業種からのキャリアチェンジなのに、こんなに活躍しているなんて凄いな...」と刺激をもらいました！ 先日参加した全社会では、個人的に小野代表のスピーチが心に響きました！熱い思いが伝わりましたね。また、事業部マネージャーからの『エンジニアのキャリアの作り方』に関するテーマはとても勉強になりました！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"初めての開催で心配な点もあったのですが、全社会も有意義な時間になり良かったです！Yさんの今後の展望を教えて下さい！"},{"type":"answer","text":"まずはエンジニアとしてキャリアを築いていくために上流から開発工程までの経験をもっと積んでいきたいです！ 僕自身、これまでの全てのキャリアを通して「人のためになる仕事がしたい」という思いは変わらないので、ゆくゆくは更に上流で顧客折衝に携わり、それを開発工程にも落とし込めるようなエンジニアを目指していきたいです。お客様から「ありがとう」と感謝されるようになりたいですね！ また、個人的にはエンジニアとしてのスペシャリストよりも、コミュニケーションや対人スキルを活かしたマネジメント領域のほうが強みを活かせると思っているので、後輩を持ってチームを引っ張っていけるようになりたいです！"},{"type":"heading","text":"最後に"},{"type":"question","text":"Yさんらしい素敵な思いと目標ですね！今後の活躍を弊社一同楽しみにしています！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"VISIONARY AIは絶対に入って後悔しない会社です！迷わずに飛び込んできてください！ 自分の成長を実感できる環境が整っていますし、サポートも手厚いので安心してチャレンジできます！また、会社全体が自由で活気があり、一緒に働く仲間も素敵な人たちばかりなので、ぜひ一緒に成長していきましょう！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
