    <script id="interview-data" type="application/json">{"slug":"k1-2pp1m","role":"エンジニア","skills":"Dart, JavaScript","initial":"R.O","title":"フリーランスよりも働きやすい環境へ","tags":["リモートワーク","案件選択制","ワークライフバランス","キャリアアップ","フルリモート"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/64373dd21b544a6ebd846e38a47877e9/s-600x412_8294038d-e74d-410b-b7a5-2e7fa880b83f.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/42b2ba7fd7d14b8191a65bcba9daa743/interview-k1-2pp1m-top.webp","alt":"フリーランスよりも働きやすい環境へ"},"blocks":[{"type":"heading","text":"入社背景"},{"type":"question","text":"元々フリーランスとして働いていたそうですが、なぜVISIONARY AIに入社しようと思ったのですか？"},{"type":"answer","text":"代表との面談がきっかけです。 元々フリーランスとしてITスタートアップでアプリ開発やマネジメントなどに携わっていたのですが、何も整っていない中で進んでいくスピード感に疲れてしまい、エンジニアが働きやすい環境が整っている会社を探していました。 そんな中で当社代表と話す機会があり、私が働く中で大切にしている価値観や描いているライフプランを『どうやったら実現できるのか』と本気で寄り添って話していただき、VISIONARY AIでなら自分が望むライフプランを実現できると確信して、入社を決めました。"},{"type":"heading","text":"入社してみて"},{"type":"question","text":"フリーランス時代と比較して大きな変化はありますか？"},{"type":"answer","text":"自分のライフプランやキャリアプランが格段に立てやすくなった点ですね！フリーランス時代はエージェントを活用して案件を紹介して頂いていたのですが、マージンがパーセンテージでしか共有されないので、案件に入らないと正確な給料がわからなかったりと、知りたい情報が共有されない事が多かったです。 VISIONARY AIは案件に入る前に必要なスキルや単価、契約内容など明確に全て教えてくれます。『この単価の案件に入る為にはこのスキルを身に着ける必要がある』など、やるべきことも明確になり、より具体的なキャリア設計も一緒に行うので、迷うことも無くなりました。 あと、、、給料面がフリーランスと変わらないので驚きました！笑"},{"type":"question","text":"今後の目標や描いているキャリアプランを教えてください。"},{"type":"answer","text":"上流工程での経験・知識を身につけ、将来的には、PMやPLなどのマネジメントに挑戦していきたいです。その為にも今はデータモデルや画面設計の知識を学び、目の前の仕事を通して開発のスキルを身に着けていきたいです。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/7462ad7e65894fce87559ee2997125b3/interview-k1-2pp1m-body.webp","alt":""},{"type":"question","text":"今後の目標や描いているキャリアプランを教えてください。"},{"type":"answer","text":"上流工程での経験・知識を身につけ、将来的には、PMやPLなどのマネジメントに挑戦していきたいです。その為にも今はデータモデルや画面設計の知識を学び、目の前の仕事を通して開発のスキルを身に着けていきたいです。"},{"type":"heading","text":"最後に"},{"type":"question","text":"転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"代表をはじめ、メンバー全員が自分の希望の実現に全力でサポートしてくれます。元トップセールス揃いの営業チームが案件を獲得してくれるので、「フルリモートの案件がいい」「こんなスキルが身に着く案件を希望」など、全て叶うと思います！ 人生において大切にしたい価値観がある人はもちろん、これからライフプランやキャリアプランを設計して実現したい人こそオススメです！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
