    <script id="interview-data" type="application/json">{"slug":"jklQ4azT","role":"エンジニア","skills":"Java, Vue.js","initial":"S.M","title":"フリーランスや別業種の事業立上げ⇒正社員のエンジニアを選んだ理由","tags":["高還元","評価制度","チーム参画","人と社風が好き","リモートワーク","営業力の高さ"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/0e343ba6c8f748eda0881f3a857a48ea/s-600x412_6f09d369-1d64-40a4-a2a3-f5cccd538532.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/5c1e7c545574468aaf4d2060bc3b51a5/interview-jklQ4azT-top.webp","alt":"フリーランスや別業種の事業立上げ⇒正社員のエンジニアを選んだ理由"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"大学卒業後、SIerの会社に入社し、エンジニアとして様々なシステム開発を担当していました。3年ほど経験を積んだ後にすぐに独立し、フリーランスとして要件定義〜保守運用まで担当したり、全くエンジニアとは別業種の事業立ち上げに携わったりと異例のキャリアを築いてきたなと思います(笑)！ 様々な経緯はあるものの、改めてエンジニアとしてのキャリアを考え、Visionary AIでエンジニアの正社員として働くことにしました。今は行政の保険システム開発プロジェクトに参画し、チームリーダーとして設計書の取りまとめ、レビュー、チームメンバーのサポート等幅広く担当しています。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"フリーランスや別業種事業にも挑戦し、ビジネスパーソンとしても様々な経験を積んでいるMさんのお話を聞けるのを楽しみにしていました！改めて、正社員のエンジニアとして働こうと思ったきっかけを教えてください！"},{"type":"answer","text":"1年前くらいはエンジニアを休んでいて、副業でやっている事業を伸ばそうと考えていました。ただ、事業が伸び悩んでしまって...もう一度「自分ができることを見直して、立て直そう」と考えた結果、エンジニアに戻ることを決めました。SIerでの正社員エンジニア、フリーランスエンジニアを経験し、改めてSESで働くとなると「雇用形態は関係ない」と思ったので今回は正社員を選ぼうと思いました。 フリーランスだと、スタートアップ／ベンチャー企業のシステム開発案件参画が多く、エンジニア側に求められる裁量があまりにも大きいなと感じていました。整っていない環境で自身の実力不足を感じたり、フリーランスである以上は即戦力を求められるため、幅広い技術の習得が難しいなと思いました。 私は「Javaしかできない」という経歴コンプレックスを感じていたので「様々な技術に挑戦したい」「バックエンドだけではなくフロントエンドも経験したい」と考えたときに、SESの正社員が最適な環境だと感じました。"},{"type":"question","text":"様々なスタイルでエンジニアとしてご活躍されていたMさんだからこそのキャリア選びですね！多くのSESがある中で、Visionary AIを選んでいただけたの理由もお聞きしたいです！"},{"type":"answer","text":"転職活動中は、求人広告で様々な会社を見て、3社だけ応募しました。私のスタイルではありますが、比較すると迷いが出てしまい、意思決定ができないので「一番最初にオファーが出たところに行く、それが私の選択する道」と考えて進めていました。 Visionary AIを選んだのには3つ理由があります。 まず、最初に求人広告を見たときに「物凄く給料が高そうだな」と感じた点ですね(笑)！SESはどの会社を選んでも、参画する案件次第で働き方は異なるので「せっかくなら給料が高い会社が良い」と思い、とても魅力に感じました。 2点目はHPのエンジニアメンバーのインタビュー記事を見て「私も自分らしく働けそうだ」と感じたことですね。HPも全体的に良い印象で、メンバーがみんな活き活きと働いているなと思いましたし、リアルな社員の声を見て「この会社で、各々自分のやりたいワークライフスタイルを勝ち取っているんだな」と思いました。 3点目は冒頭でも伝えた通り「一番最初に内定をいただいた」からです(笑)！面談で代表の小野さんと話したのですが、面談後すぐに内定をいただいて...！代表の意思決定の速さが、会社が成長している理由なんだなと信頼にも繋がり、すぐにVisionary AIへの入社を決めました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/18043ef0561147abb675a8ed46066d35/interview-jklQ4azT-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"意思決定の速さが信頼につながる...！Mさんらしい決め方で素敵です！実際に入社してみていかがですか？"},{"type":"answer","text":"エンジニアチームもかなり規模が大きくなっていると思いますが、本当に様々なタイプのエンジニアが在籍し、それぞれが自分らしく働いているんだなぁと実感しています。業務をこなすことにのみ集中したい方、ワークライフバランスを重視したい方、業務＋αで自分で興味のある分野を開拓していく好奇心の強い方だったり...タイプは全く違うんですが、上手く共存している印象です。 私は業務で精一杯で、なかなか自己研鑽までたどり着けないのですが、Visionary AIはエンジニアメンバーも積極的に発信する方が多く、その影響を受けて自分から勉強する時間が増えました。社内のSlackは、いわば“技術情報のあふれているNewspicks”のような環境になっていて、色々な人のつぶやきをきっかけに、自分で気になったことを調べたりインプットしています。 「エンジニアとして、もっとこうなりたい」という思いが生まれたり、実際に行動に移せるようになったのは、自身の大きな変化の一つです。会社には「人が頑張ること」を後押ししてくれるカルチャーがありますし、それが社員同士のプラスのコラボレーションを生み出しているのかなと思います！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Mさんの中でも大きな変化があったのですね、嬉しいです！Visionary AIではどのようなキャリアを築いていきたいと考えているのでしょうか？"},{"type":"answer","text":"エンジニアとして、より自分が対応できる領域を増やしたいなと思っています。バックエンドだけではなくフロントエンド、Java以外の言語にも積極的に挑戦していきたいですね。 個人的には「まだ自分は真のエンジニアじゃない駆け出しエンジニアだ」と思っているんです。様々な環境で優秀なエンジニアの方をたくさん見てきた分、今の自分の現在地の見方が変わりましたね。 それこそ、社会人3年目くらいの時期は「自分は求められていることをきちんとこなすことができるエンジニアだ」と思っていたのですが、それは一つの会社、現場という閉鎖的な空間だったからこそ、盲目になっていただけなのかなと思っています。改めて今は、ソクラテスの『無知の知』を胸に刻み、「自分はまだ真のエンジニアではない」という心持ちで成長していきたいと考えています！"},{"type":"question","text":"俯瞰して自分の現在地を把握することは、ビジネスパーソンとしても本当に重要なスキルですよね...さすがです！PL・PM等、プロジェクトを管理する側としてのキャリアも考えているんでしょうか？"},{"type":"answer","text":"今のところは、PM・PL等のリーダーポジションがやりたい！という明確な目標はないです。結果的にその役割を求められるのであれば、取り組みたいなとは考えています。 現在、チーム参画でリーダーを任されていて、一つ高い視点で仕事に取り組めるようになったことはポジティブに感じています。メンバーから頼られる回数が増えたり、自分のサポートによってメンバーから感謝されると嬉しいなと思いますし、また頼ってもらえるときには自分の自信にも繋がりますね。もちろんやるべきことは増えるのですが、やりがいに繋がっています！"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます。エンジニアとしても人としても魅力的なMさんの今後の活躍が楽しみです。最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"SESで働きたいエンジニアにとって、Visionary AIはベストパフォーマンスの会社だと思います！自信を持って、転職を考えている方には紹介したい会社ですね。 個人的な印象ではありますが、案件が決まるまでの要素として①参画するエンジニアのスキル②営業チームの営業力の2点が重要だと考えています。一般的なSESでは、①エンジニアのスキル8割：②営業力2割程度の比率のところ、Visionary AIであれば、①エンジニアのスキル6割：②営業力4割程で案件を選ぶことができます！ 自身のスキルが不足していても、そこは営業力でカバーして望む案件を紹介してもらえるので、選択できる案件の幅が広がり「こんな案件にも挑戦できるんだ！」といった驚きがあります。安心して、自分の描く理想のキャリアを実現できる舞台として活用するのがオススメです！ また、エンジニアも営業も社員全員が良い方ですし、互いに高めあえるような人たちとも出会えます。今ってお金を払ってでもエンジニアのコミュニティに入ったりすることがあると思うんですけど、Visionary AIであれば高収入で案件も選べるし、魅力的なエンジニアコミュニティの一員になれるので「こんなに美味しい話ってないのでは？」と思っています(笑)！ あとは面談で代表に「良い方だな」と思ってもらえれば大丈夫...！是非、あなたらしさを表現して、代表をそそのかしてみてください(笑)！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
