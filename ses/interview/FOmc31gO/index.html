    <script id="interview-data" type="application/json">{"slug":"FOmc31gO","role":"エンジニア","skills":"Dart","initial":"Y.K","title":"希望のFlutterに挑戦！目標実現を支える仕組みと組織","tags":["人と社風が好き","案件選択制","高還元","モダンな開発環境","営業力の高さ","リファラル入社"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/670da43453f2480ba67c1c8f5e753df9/s-600x412_1e712dc0-cf58-44e9-a32d-e84d5371a124.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/39cb481630234fb3904d9d9ee33eabc5/interview-FOmc31gO-top.webp","alt":"希望のFlutterに挑戦！目標実現を支える仕組みと組織"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"新卒で入社した会社では決済サービスの営業をやっていて、その後ジョブチェンジをしてエンジニアになりました！ VISIONARY AIはSES企業としては2社目なのですが、現在はスタートアップ企業の店舗決済端末システムの開発メンバーとして、顧客折衝や上流工程から幅広く携わっています。元々希望していたDart／Flutterを触る案件に携わることができています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"営業としても新人賞を獲得していたりと、様々なキャリアで活躍されているKさん！VISIONARY AIにはリファラル入社と伺っているのですが、詳しいエピソードについて教えていただけますか？"},{"type":"answer","text":"そうなんです！プライベートで仲が良く信頼している友人と飲みに行ったときに、仕事の話になりまして...その中で「良い会社があるよ」とVISIONARY AIを紹介してもらったんです。当時は、転職活動を始めたばかりだったので、友人に「詳しく話を聞きたい」と伝え、代表とのカジュアル面談の機会をいただきました！"},{"type":"question","text":"ちょうど転職活動を進めていた時期だったんですね！転職活動を始めたきっかけは何でしょうか？"},{"type":"answer","text":"転職活動を始めたのは、今後を考えたときに、『収入』『キャリア』の2つの希望が叶えられる環境で働きたいと思ったことがきっかけでしたね。前職だと評価制度が曖昧で、入社後に収入を上げる手段が不明瞭であったり、組織が自分と合わないなと感じたりと働きにくさを感じてしまうこともありました。 また営業メンバーの人数が少なく、一人ひとりのエンジニアにリソースが割けないため、希望しているDart／Flutterの案件もなかなか見つからず...思うようにキャリアを築くのが難しいと感じたんです。"},{"type":"question","text":"そうだったんですね！転職活動の結果、VISIONARY AIに入社を決めた理由を教えていただけますか？"},{"type":"answer","text":"いくつか理由はあるのですが、仲の良い友人2名が実際にVISIONARY AIに入社して「働きやすい会社」と話していたことが何よりも信頼に繋がりましたね。実際に面談で代表と話してみて「この人と一緒に働きたい」と感じたことも決め手に繋がりました！新しい職場は『一緒に働く人』を重要視したいとも考えていましたし、面談を通して『自分と合う組織だな』と思ったんです。 また、還元率が高く自分のスキルアップや経験が収入にも直結するシンプルな評価制度はとても魅力的に感じました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/55fcbbce3c654f3986ad4f91bcc90d87/interview-FOmc31gO-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"ありがとうございます！実際、入社後にギャップに感じることはなかったでしょうか？"},{"type":"answer","text":"ネガティブな点は特にないのですが、ポジティブな点は多くありました！前職で実現が難しかった自分が希望しているDart／Flutter案件に参画できたことも嬉しかったですし、収入がかなりUPしたので、給料日に「こんなに上がるんだ」と驚きました！ また、VISIONARY AIの営業は専属ではなく、営業チーム全員がマッチした案件を探してくれるので、様々な営業メンバーと話しながら案件を決められたことが信頼に繋がりました。 まだまだエンジニアとしては未熟なので、環境を活用してスキルアップしながら様々なことに挑戦していきたいですし、年収も上げていきたいなと思います！"},{"type":"question","text":"営業チームもKさんの希望を叶えるために奮闘していましたので、希望が叶えられてよかったです...！実際に働いてみて、メンバーやカルチャーの印象はいかがでしょうか？"},{"type":"answer","text":"社内の雰囲気は、入社前に代表や友人から聞いていたイメージ通りでした！会社全体でやる気が満ち溢れているような熱量があり、各々働く環境が異なっていてもSlackやQiitaでのアウトプットがとても活発なので、凄いなと思いましたね。 今は参画している案件でのスキルアップに集中しているのですが、今後は組織への発信や社外へのアウトプットにも挑戦していきたいなと考えています！"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Kさんの発信もとても楽しみにしています！今後エンジニアとしてはどのようなキャリアを築いていきたいのでしょうか？"},{"type":"answer","text":"まずは今参画している案件でDart／Flutterの専門性を高めたいですね！できることを増やして、より上流工程の経験も積んでいきたいなと思いますし、Flutterを用いて自分でアプリ開発にも挑戦してみたいなと思います！ また、これまでの経験や自分自身の強みを活かして、ゆくゆくはマネジメント領域にも挑戦していきたいと考えています。エンジニアとしてのレベルを高めつつ、プロジェクト全体を管理していく側としてのマネジメントスキルも高めていきたいです！"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"VISIONARY AIに在籍しているエンジニアは、一人ひとりキャリアやプライベートの目標がある方が多い印象があります！「やってみたい」「〇〇を実現したい」という思いがある方や、能動的に行動できる方には特にオススメの環境です！ SESなのでそれぞれのメンバーが働く環境は異なりますが、社内の協力体制もとても整っているので、帰属意識を持ちながら働くことができます。営業メンバーと連携を取りながら、自分のペースで希望を実現していけると思いますよ！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
