    <script id="interview-data" type="application/json">{"slug":"ytXqp4-b","role":"セールス","skills":"ITSolution事業部 Chief","initial":"Y.O","title":"全員の価値観を尊重し、希望を実現するために","tags":["営業組織","案件選択制","コミュニケーション","サポート体制","チーム主義"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/7df802988030407c9727ea135ca00bbb/s-600x412_4c771148-65c1-4871-9807-cd5430d1c15d.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/fcfc5611e9844ce390a8bc17579bcf25/interview-ytXqp4-b-top.webp","alt":"全員の価値観を尊重し、希望を実現するために"},"blocks":[{"type":"heading","text":"入社背景"},{"type":"question","text":"前職でもSES営業に携わっていたそうですが、なぜ転職しようと思ったのですか？"},{"type":"answer","text":"一番の理由は、仕事に対する入社前後のギャップです。もともと学生時代からキャリアアドバイザーなど、人と関わる仕事に魅力を感じていて、人をサポートするような仕事に就きたいと考えていました。コロナ禍だったこともあり、業界が急速に成長し続けるIT業界に興味を抱き、『エンジニア一人ひとりに寄り添い、キャリアや働き方の希望を実現したい』と思い、SES営業に携わることに決めました。 しかし、実際にSES営業を経験していく中で、エンジニアの希望よりも営業成績や個々人の成果を追求するような仕事の在り方にモヤモヤを感じるようになり、もっと一人ひとりのエンジニアと向き合って働きたいと強く思うようになり、転職を決意しました。"},{"type":"heading","text":"営業組織の特徴"},{"type":"question","text":"Visionary AIの営業組織の特徴は何ですか？"},{"type":"answer","text":"大きく分けて、『個人主義＜チーム主義』『エンジニアとのコミュニケーション体制』の2点が特徴だと思います！ 1つ目の特徴、『個人主義＜チーム主義』についてお伝えします。「営業」といえばノルマやインセンティブがあり、どうしても一人ひとりが個々人の成果を求めるような個人プレーだと思われがちです。実際に、この業界ではエンジニアの希望よりも、営業都合のノルマや売上・インセンティブのために「会社都合の案件にアサインされる」「やりたいことが叶えられない」などの声が後を絶ちません。 しかし、弊社の営業組織は個人の成果を追い求めるような営業ではなく、エンジニア一人ひとりの希望を実現させるために、チーム一丸となってエンジニアをサポートしています！もちろん組織としての目標はありますが、個人の利益を追求するような仕事をしている人は一人もいませんね。"},{"type":"question","text":"業界に関わらず、営業職はどうしても個人の成果を追い求めがちになりますよね。なぜVisionary AIでは『個人主義＜チーム主義』が実現できているのでしょうか？"},{"type":"answer","text":"一番の理由としては、インセンティブ制度や売上目標等のノルマが設定されていないからです。 また、どんな案件でも、「会社の利益が10万円」で固定されているので、とにかく単価が高い案件など、営業や会社都合による案件の紹介は一切ありません。 エンジニアと心から向き合えるような仕組みが設計されています。"},{"type":"question","text":"営業の評価制度からも、エンジニアと心から向き合えるような仕組みになっているのですね。"},{"type":"answer","text":"そうですね。例えば、会社の利益を求めるのであれば、会社として利益の高い案件を紹介したり、最初にオファーが出た案件で決定したりすると思います。 ただ、弊社の場合、仮にオファーが出たとしてもエンジニアが受けるのかどうか選択できます。希望とマッチしていない場合は、他の案件を紹介し続けます。エンジニアは比較検討しながら、自分の希望と最もマッチした案件を選ぶことができます。"},{"type":"question","text":"「会社都合・営業都合の案件にアサインされるのでは？」等の業界の「あるある」な懸念が見事に解消されてますね。"},{"type":"answer","text":"そうですね（笑）！そして、2つ目の特徴は、エンジニアとのコミュニケーション体制です！ 弊社ではエンジニア一人ひとりに専用のSlackチャンネルが用意され、エンジニア一人に対し営業組織全員がサポートに入っています。エンジニア＋営業のみのチャンネルなので、キャリアや仕事の相談が気軽にできます。 このサポート体制によって、全エンジニアメンバーに平等に接することができ、「営業から返信が遅い」という事が起こることがありません。 また、一担当制を引いていない分、全員で営業活動ができるのでより多くの案件を紹介できます。営業からも定期的に声をかけているので、より相談しやすい環境が整っていると思います。日々営業とコミュニケーションを取ることで、信頼関係も構築しやすいなと感じています。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/484ff2955cbb4f7495dc0447718a9634/interview-ytXqp4-b-body.webp","alt":""},{"type":"heading","text":"“営業”に対する思い"},{"type":"question","text":"営業組織全体として、エンジニア一人ひとりに寄り添う仕組みができているんですね。営業に対するOさん個人の想い等はありますか？"},{"type":"answer","text":"『エンジニアに満足してもらえる環境を提供する』をミッションに、日々一人ひとりのエンジニアと向き合っています。 エンジニア本人はもちろん、エンジニアの家族の人生も担っているので、「Oさんがサポートしてくれて良かった」と思ってもらえるような心強い営業になりたいです。エンジニア全員が理想に妥協することなくのびのびと働ける環境を作りたいですね！ 現在も、「Oさんのおかげで理想の働き方ができています」と言ってもらえることが本当に嬉しいですし、やりがいにも繋がっています！"},{"type":"heading","text":"最後に"},{"type":"question","text":"転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"転職を考えるにあたって仕事内容や働き方はもちろんですが、フォロー体制やコミュニケーション、相談のしやすさ等、営業に対しても期待していることは多いと思います。 当然、弊社の営業メンバーは全員、皆さんの期待に必ず応えるので、遠慮なく頼ってくださいね！弊社を選んでいただいたら絶対に後悔させません！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
