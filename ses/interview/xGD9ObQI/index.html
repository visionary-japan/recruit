    <script id="interview-data" type="application/json">{"slug":"xGD9ObQI","role":"エンジニア","skills":"C#","initial":"H.N","title":"大手⇒高還元SESへ！明確な評価制度や一緒に頑張る仲間が魅力","tags":["リモートワーク","評価制度","人と社風が好き","リファラル入社","高還元","理念共感","サポート体制"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/69f905da7fbf4c1a9518b210da642d3f/s-600x412_bc759e65-0ece-411d-a8cf-da375c499d62.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/4b30137607ed43f5b17b99e9da07d335/interview-xGD9ObQI-top.webp","alt":"大手⇒高還元SESへ！明確な評価制度や一緒に頑張る仲間が魅力"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"情報系の大学を卒業してから、今までエンジニアとしてキャリアを歩んできました。前職の労働環境や人間関係に対して不満があったわけではないのですが、3年勤めたタイミングでキリも良かったので、新たなキャリアの選択肢として転職を考えるようになりました。 VISIONARY AIに入社してからは、自治体の役所手続き等で利用される申請システム開発案件に参画しています。PM補佐ポジションで、基本設計以降の工程、スケジュール管理やメンバーマネジメントまで幅広い業務を担当しています。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"Nさんの活躍は、営業メンバーからよく話に上がっていますよ！改めて、転職活動のエピソードについて詳しく教えてください！"},{"type":"answer","text":"「今すぐに転職したい」と思うほどの理由はなかったのですが、「ルールが多く『大手っぽい』社風が合わないな...」と、なんとなく感じていたことが転職を意識し始めたきっかけでしたね。 また、案件先では「期待しているよ」や「頑張ってね」等の言葉をかけていただいていたり、技術力も高く評価して頂いていたのですが、本社からはそういった言葉も評価もなく...受託やSESである以上、評価者が『働いている現場』を知らないことは仕方ないとは思いつつ、案件先と本社で評価が全く異なっていたことに違和感を感じたのも転職を決意した理由の一つです。"},{"type":"question","text":"評価制度は、企業方針が反映されるので難しい点ですよね。そのような思いを持って転職を考え始め、VISIONARY AIに入社した決め手を教えてください！"},{"type":"answer","text":"友人にVISIONARY AIに転職した方がいて、ちょうど会う機会があったので本格的な転職活動を行う前にまずは転職の相談をしようと思ったんです。 その友人からVISIONARY AIの仕組みや働くエンジニアメンバーについて聞くうちに「もっとVISIONARY AIのことを知りたい！」と思うようになり...代表と面談する機会を設けていただきました。 実際に代表と話す中で「高い還元率」「顧客の評価が社内評価に直結するシンプルな単価連動制」「営業のフォロー体制」「一緒に働く同世代のエンジニアメンバー」等に魅力を感じ、「この会社で働きたい」という思いがすぐに大きくなりました！ 転職先にはいくつか選択肢があったので、改めて自分のキャリアを見つめ直した結果、「VISIONARY AIなら自分の描いているキャリアや目標を叶えられる」と思い、入社を決めました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/03bf3614c44f404a8fab8c3ccedcbd81/interview-xGD9ObQI-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"実際に入社してみていかがでしょうか？"},{"type":"answer","text":"営業組織のサポートの手厚さに感動しました！前職では営業と関わる機会がほとんどなく、やりとりもメールだけだったので「名前は知ってるけど、顔がわからない」ような状況でした。VISIONARY AIでは自分から相談する前に「困ってることはない？」等、営業メンバーから定期的に状況を確認していただけるので、何かあった時に相談しやすいです。また、年収もかなり上がったので嬉しいですね。"},{"type":"question","text":"困った時に相談できる人がいないと不安になりますよね。カルチャーや一緒に働くメンバーに対する印象もお聞きしたいです！"},{"type":"answer","text":"エンジニアメンバーと関わる機会が多いのが当社の特徴の一つだと思います！ VISIONARY AIでは月に1回、参加自由のイベントが開催されているので、年齢が近い方や様々な技術領域のエンジニアメンバーと実際に会って話せるのは嬉しいです。話しやすい方ばかりなので、技術面だけではなく趣味の話でも盛り上がります！他の案件の話も聞けるのでとても刺激になりますね。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Nさんと話すことで学びになるメンバーも多くいると思います！今後はどのようなキャリアを築いていきたいですか？"},{"type":"answer","text":"とても魅力的なメンバーが多いので、ゆくゆくは他のVISIONARY AIのメンバーと一緒にチームで参画したいですね！ベテランメンバーから学んだり、経験の浅いメンバーの育成やマネジメントの機会があっても成長できるのではないかと思います。 今の案件ではPM補佐ポジションでプロジェクトの管理側を経験できているだけではなく、C#、Python、React、AWS等様々な技術領域も経験できているので、日々吸収しながらマネジメントとスペシャリストどちらを極めていくのかも考えていきたいなと思います。"},{"type":"heading","text":"最後に"},{"type":"question","text":"Nさんの今後の活躍がとても楽しみです！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"一人ひとりが働く上で、大切にしている価値観や大切にしたいものがあると思います。「『この会社なら自分が大切にしたいものを大切にできそう』と感じる点が必ずある」と自信を持ってお伝えできるので、転職活動に悩んでいる人こそ、ぜひ一度代表や営業メンバーと話してみて欲しいです！ その上で「いいな」と思っていただけたら、ぜひ入社していただきたいです！一緒に働ける日が来ることを楽しみにしています！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
