    <script id="interview-data" type="application/json">{"slug":"22IiWZVy","role":"エンジニア","skills":"JavaScript, PHP","initial":"Y.O","title":"バンドマンからエンジニア！？最速でキャリアアップできる環境","tags":["リモートワーク","評価制度","案件選択制","スキルアップ支援","人と社風が好き","ワークライフバランス"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/f1914c2aabd247d0a22069cbe64db777/s-600x412_79e441bf-bd4b-4512-b473-c79c687c29ce.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/b9c8f813e9304ef9b196c52e8706ef3e/interview-22IiWZVy-top.webp","alt":"バンドマンからエンジニア！？最速でキャリアアップできる環境"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"元バンドマンでエンジニアにキャリアチェンジをしたOさんの話を聞くのを楽しみにしていました！まずは簡単に自己紹介をお願いできますか？"},{"type":"answer","text":"珍しい経歴ですよね(笑)！20代のほとんどをバンド活動に捧げていました。20代後半にキャリアを見直す機会があり、バンドのHPを制作していたときの楽しさを思い出して、エンジニアにキャリアチェンジしました！ VISIONARY AIに入社した今は、営業の方が売上管理に使うシステムの開発案件に参画しており、JavaScriptとPHPを活用した機能追加や改修を担当しています。"},{"type":"heading","text":"入社背景"},{"type":"question","text":"バンド活動の経験を活かして、今はエンジニアとして活躍しているんですね！Oさんは、どのような経緯で転職活動を始められたのでしょうか？"},{"type":"answer","text":"前職でも様々な現場で経験を積むことができ、エンジニアとしての成長実感はあったのですが、『もっとフロントエンドの経験も積みたい』と考え始めたこと、会社と自分の『仕事に対する価値観のズレ』を感じるようになったことをきっかけに、転職を検討し始めました。"},{"type":"question","text":"希望のキャリアを考えたときに、実現が難しい環境だったんですね..."},{"type":"answer","text":"そうですね。そもそも案件を選べる環境ではなかったですし「案件がないから、とりあえず経験のあるPHPの案件に参画してほしい」という会社都合で案件が決まる環境でした。 実際に、営業の方に自分の希望を伝えても「探そう」という姿勢も行動もしてくれなかったので、「この環境だとPHP以外のスキルアップが難しい」と感じました。あまりコミュニケーションを取る機会もなかったので、相談をできる相手もいなかったですね...。"},{"type":"question","text":"「やりたいことができない」というのはキャリアアップをしたいOさんにとっては辛い環境ですよね...。『会社と自分の価値観のズレ』はどのような点に感じたのでしょうか？"},{"type":"answer","text":"具体的には、カルチャーと評価制度の2点に対して感じていました。私個人としては、エンジニアとしてスキルを高めていくことが評価に繋がると考えているのですが、会社の評価制度は『エンジニアのスキル』と『会社への貢献』の両方が評価項目として設けられていたので、スキルが高く現場で活躍しているメンバーよりも、スキルが低くても会社イベントに参加していたり、イベントを主催しているメンバーの方が評価が高く給与も上がる仕組みでした。 私はスキルアップしてエンジニアとしてもっと活躍したいと考えていたので、「この会社では自分の仕事の向き合い方だと評価されないのでは...」と感じるようになりましたね。 また、当時は残業も多く、帰宅が22時半〜終電になることがほとんどだったのですが、毎日帰宅後に週報も提出しなければいけなくて...。私なりにはしっかりと取り組んでいたと思っていたのですが、営業の方との面談で「もっと文章量を増やして提出してほしい」というフィードバックを頂いてしまいまして。「これではいつまでも独学の時間も作れない」と思いました。"},{"type":"question","text":"そのような思いをもって転職活動を始めたんですね...！様々な会社がある中、VISIONARY AIを選んで頂けた決め手を教えてください！"},{"type":"answer","text":"VISIONARY AIを選んだ理由は、評価制度と案件選択制に魅力を感じたからです！前職の経験を経て、「エンジニアとしてのスキルや現場の貢献をちゃんと評価されたい」と思っていたので、スキルUP→案件単価UP→収入UPというシンプルな仕組みに惹かれました！加えて、還元率もとても高かったので魅力的でした。 また、エンジニアとして挑戦したいことが色々と見えてきていたので、営業力の高い営業チームのサポートのもと、案件も自分で選べるという点も決め手としてかなり大きいです！ 面談では、それぞれの仕組みや実際に描けるキャリア等を代表に丁寧に伝えていただき、内定を頂いてからはすぐに入社を決めました。面談を受ける前から「この会社で内定をもらったら入りたい」と感じていたので、とても嬉しかったです！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/4605cd3f511d4fad83e5199ab999ebff/interview-22IiWZVy-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"Oさんが転職活動で実現したいことを全て叶えられる環境だったんですね！実際に入社してみて感じたことはありますか？"},{"type":"answer","text":"営業チームのサポート体制が想像以上でした！最初の案件が決まるまでは、ほぼ毎日複数の案件紹介があり、その数に驚きました(笑)！ 前職だと、案件が決まるまでに平均2件程しか紹介がなかったので...！案件紹介時には、単価や仕事内容等の案件情報も全て開示してもらえるので、実際の業務や給与等も自分で納得して選ぶことができましたね。 また、質問したことに対してレスが早いのも、とてもありがたいです！既読後も返信がなかったり、電話も出ていただけなかったりといった経験もあり『放置されている』と感じてしまうこともあったので...！"},{"type":"question","text":"日々働く環境も違うからこそ、レスが早いことは安心にも繋がりますよね！プライベートや働き方にも新たな変化はありましたか？"},{"type":"answer","text":"働き方も収入もかなり変化しました！これまでは常駐で週5出社だったのですが、今はフルリモートで働けているので、通勤時間がなくなった分、独学や運動にも時間を使えるようになりました！ 収入も前職よりはかなり上がったので、心にも余裕が生まれたなと思います。勉強用に自己投資ができたり、友達や彼女と遊びに行く機会も増えたり、貯金に回せる金額も増えたりと...嬉しいことばかりですね。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"プライベートも充実していてとても嬉しいです！VISIONARY AIではどのようなキャリアを描いていきたいですか？"},{"type":"answer","text":"今後はフロントエンドとバックエンド両方を担えるエンジニアを目指していきたいですね。最終的には「一人で全部できますよ」と言えるような、フルスタックエンジニアになりたいなと考えています！ 自分は管理側よりも、開発業務を経てシステムが上手く動くことを見るのが好きなので「Oさんがいれば全部対応できるし安心だね」と言われるレベルを目標に頑張っていきたいと思います！"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"VISIONARY AIは「やりたいことが実現できる会社」だなと思います。やりたい技術、働き方も自分で選ぶことができますし、キャリアに迷った時にも、相談に乗って一緒に設計するところからサポートしていただける環境です。エンジニアの方も、営業の方も、社内で会う人全員が、本当に“良い人”ばかりなのでオススメです！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
