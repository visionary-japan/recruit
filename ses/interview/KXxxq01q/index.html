    <script id="interview-data" type="application/json">{"slug":"KXxxq01q","role":"エンジニア","skills":"Java, PHP","initial":"Y.H","title":"社内業務は無し！自由な環境で自由に働く","tags":["高還元","評価制度","リモートワーク","リファラル入社","社内業務なし"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/460e3d484a784265b4be8850c9a5945b/s-600x412_c8cf9a84-539b-4375-b84c-a3cc01d344d4.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/9bddf9e214884f54b8032e71ab04a936/interview-KXxxq01q-top.webp","alt":"社内業務は無し！自由な環境で自由に働く"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！早速ですが、簡単に自己紹介やこれまでの経歴について教えてください！"},{"type":"answer","text":"元々エンジニアとして勤務をしていたのですが、途中1~2年別の仕事を経験していたため、エンジニア歴は9年目になります。現在は、通信系大手企業の社内システム開発の上流から下流まで幅広く対応しています。 Visionary AIで働いている友人から「転職して、希望が実現できた」と話を聞き、ちょうど転職を考え始めていた時期だったので、面談の機会を頂き、Visionary AIに入社しました！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"Hさんはリファラル入社だと伺っています！入社までのエピソードを詳しく教えてください！"},{"type":"answer","text":"そうなんです。元々転職を考えるようになったのは、前職の職場環境や制度、社風とのアンマッチを感じたことがきっかけでした。その前に別の仕事に従事していたため、エンジニアとしてのブランクがある分収入が減ることは想定していたのですが、社内の評価制度を見ると入社後に収入を上げる手段が少なく、毎日定時＋2~3時間の残業が当たり前で常に業務過多な状況でした。また、一度社員旅行の参加を断った事があったのですが、その際に周りからの風当たりも強く...。この出来事をきっかけに社風とマッチしていないかもしれないなと思いました。 そのタイミングにちょうど、Visionary AIに入社した友人と会う機会があったんです。転職を検討していることや、「こんな希望を叶えたい」という話をしたところ、Visionary AIについて紹介してもらいました。「興味があれば」ということだったのですが、友人が満足して働いている話を聞いてすぐにカジュアル面談の機会をもらいました！ 当時は複数の企業から内定をもらっていたのですが、Visionary AIの強みや特徴は自分の希望が全て叶えられる環境でしたし、最終的には友人のリアルなエピソードがある分、信頼できる点が決め手となって入社を決めました。"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/d49cd6f89a2e45ff9ce71c15c5cfb341/interview-KXxxq01q-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"互いを理解している友人の話は信頼出来ると思いますし、働くイメージも湧きやすいですよね！実際に、入社してみてギャップは感じませんでしたか？"},{"type":"answer","text":"ギャップはないですし、希望していたことがどれも実現できたので入社して良かったなと感じました。年収も副業分と合わせたくらいの水準まで増やすことができたので、地元北海道で暮らす両親への親孝行の機会も増やすことができました。 働き方は前職からフルリモートなのでそこまで変化はしていないのですが、自社のPCを使わなければいけないといったルールがなかったり、強制的な社内業務がないので、転職前に懸念に感じていたことも全て解消されました！"},{"type":"question","text":"ポジティブな変化がたくさんありとても嬉しいです！社風や組織の印象について教えてください！"},{"type":"answer","text":"エンジニアチームは役職等の上下関係がなく、フラットな組織なので風通しが良いなと思います。各々の個性が尊重され自由に活躍しているため、今風の会社だなという印象です(笑) 役員陣や営業チームも話しやすい方が多いので、何か問題があった際にも相談がしやすいなと思います。営業チームからのサポートも自分にとって最適な頻度で調整いただいているので、コミュニケーションも過不足なく行えていますし、簡単にSlackで報連相できるのがありがたいなと感じています。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"働く上で『人』も重要な観点の一つですよね！ちなみに、Hさんは今後どのようなキャリアを築いていきたいと考えているのでしょうか？"},{"type":"answer","text":"ブランク期間も解消されエンジニア歴も長くなってきたので、今後はエンジニアとしての技術スキルだけではなく、PM・PLといったリーダーポジションも積極的に担っていきたいなと考えています。会議等も自分が指揮を取って進められるように、総合的なスキルを身に着けて市場価値を上げていきたいです！"},{"type":"heading","text":"最後に"},{"type":"question","text":"ありがとうございます！Hさんの今後の活躍がとても楽しみです。最後に転職を考えている候補者の方に一言いただけないでしょうか？"},{"type":"answer","text":"「こんなことがやりたい」「こんな希望が叶えたい」「自由に働きたい」等の思いがある方には最適な環境じゃないかなと思います。既にエンジニアメンバーも100名を超えてきているので、経験が浅い方は自社の先輩エンジニアにもわからない点を気軽に聞くことができます。周りが気にかけてくれるような社風もあるので、経験の浅い方〜豊富な方それぞれが活躍しやすい環境だと思います。困ったことがあればとりあえずSlackに発信すると、誰かが必ず反応してくれます(笑) 収入も案件単価に直結しており、スキルアップがそのまま収入に反映される仕組みのため、モチベーション高く働きやすい環境ですね。営業メンバーも多くいるため、案件も選べる選択肢が豊富です！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
