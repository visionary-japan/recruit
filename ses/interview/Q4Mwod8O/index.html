    <script id="interview-data" type="application/json">{"slug":"Q4Mwod8O","role":"エンジニア","skills":"Python","initial":"S.K","title":"“帰属意識の高さ”に驚き！カルチャーや仕組みに惹かれて","tags":["心理的安全性","理念共感","社内業務なし","人と社風が好き","リモートワーク","評価制度"],"thumb":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/849560b5a9f14939ac5198b599c0eb8b/s-1200x825_ff1d1776-ee3a-4123-859f-685c97d00903.webp","hero":{"src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/196fbfc8949e482e83828237b0c440de/interview-Q4Mwod8O-top.webp","alt":"“帰属意識の高さ”に驚き！カルチャーや仕組みに惹かれて"},"blocks":[{"type":"heading","text":"自己紹介"},{"type":"question","text":"本日はよろしくお願いします！簡単に自己紹介やこれまでの経歴を教えてください！"},{"type":"answer","text":"エンジニア歴は5年ほどで、主にPythonを使ったバックエンド開発に携わってきました。 現在は、企業のサブスクリプション事業を支援するツールの開発や保守運用のプロジェクトに携わっています。最近は品質管理やテストの自動化にも取り組んでいます。業界で優位性を持つプラットフォームの開発に関われているので、忙しさもありますがやりがいを感じながら日々仕事しています！"},{"type":"heading","text":"入社背景"},{"type":"question","text":"PythonといえばKさんという印象があります！早速ですが、転職を考えたきっかけを教えていただけますか？"},{"type":"answer","text":"前職で同僚から「給与を上げるために転職する」と聞いたのがきっかけでした。最初は転職時期なども決めていなかったのですが、調べるうちに転職活動を進めたいと思うようになりました。 また前職では、強制参加の全体会議や社内業務、社内イベントなどが評価制度に含まれていて、エンジニアとしての貢献や成果が必ずしも評価や報酬に繋がらない環境でした。これが自分の仕事の価値観に合っていないと感じ、次に行く会社ではエンジニアとしての活躍が尊重される評価制度や、社内業務が少ない環境を求めるようになりました。"},{"type":"question","text":"そのような軸を持って転職活動を進められたんですね。たくさんの会社がある中で、Visionary AIを選んだ決め手は何だったのでしょうか？"},{"type":"answer","text":"単価連動型の評価制度や社内業務の少ない環境に惹かれたのはもちろんですが、一番の決め手は代表や会社の「外部への発信力の強さ」でした。 SES業界では外部への発信にリソースを割けないことが多いですが、Visionary AIは、代表のX（旧Twitter）や公式noteなどを使って「どんな会社か」「どんなエンジニアが働いているのか」を発信していました。 他の会社は面談で話さないと特長や強みがわからなかったのですが、Visionary AIは面談の前に会社や組織について把握できたので、選考を受ける側としても安心や信頼につながりました。 特に小野代表のXでの発信内容【会社や経営方針、エンジニアへの思い】に、自分の価値観と強く共感しました！"},{"type":"image","src":"https://images.microcms-assets.io/assets/8c988fbd96ea46238a9c81477d48fab7/9dbe6dc11aa0453c99460b2f7b76876e/interview-Q4Mwod8O-body.webp","alt":""},{"type":"heading","text":"入社してみて"},{"type":"question","text":"「発信力」は特に注力している取り組みなので、Kさんに共感いただけてとても嬉しいです。実際に入社してみてどうですか？"},{"type":"answer","text":"年収が上がって嬉しかったこともありますが、入社して最も驚いたのは「エンジニアメンバーの主体性の高さ」です。 入社前から勉強会を開催していることは知っていましたが、日常的にSlackでメンバーの発信が活発で、それに対してリアクションし合うカルチャーがとても素敵だなと思いました！他者への想像力が高いエンジニアがたくさん集まっているのがすごいですよね！"},{"type":"question","text":"人として魅力的なメンバーが本当に多いですよね！KさんのSlackの投稿もいつも楽しみにしています。社内のSlackを盛り上げてくださってありがとうございます。"},{"type":"answer","text":"いえいえ（笑）Visionary AIは価値観の尊重や自由は大前提ですが、評価とは関係なく行動も歓迎される組織だと思います。メンバーそれぞれ働く場所は異なっていても、自ら発信することでさまざまなメンバーと関わることができるので、とても嬉しいです。 前職では周囲にあまり興味を持たないエンジニアが多く、社内の雑談チャンネルも使われず、自ら発信してもリアクションがほとんどなく、コミュニケーションが取りにくい環境でした。今は一人ひとりの発信に対してのリアクションも驚くほど多く、心理的安全性も高く担保されていると実感しています。"},{"type":"question","text":"Kさんは社内イベントにもよく参加されていますよね。参加してエンジニアメンバーと会ってみてどうでしたか？"},{"type":"answer","text":"Slackだけでなくオフラインでも皆さんコミュニケーションが活発で、話したことがない人とも自然に関わりやすい雰囲気があります。技術や趣味など話題が尽きず、毎月新たに魅力的なメンバーが増えるので「また参加したいな」と思います。 これも、Visionary AIのメンバー一人ひとりの温かさや積極的なコミュニケーション、仲間意識があるからこそ実現していると思います。周囲でも「ここまで帰属意識の高いSESの組織は見たことがない」と話しています（笑） 今年4月の全社会も、かしこまった雰囲気ではなくセレモニーのような楽しい雰囲気で、全国で活躍する沢山のメンバーと会うことができてとても嬉しかったです。"},{"type":"heading","text":"今後の展望"},{"type":"question","text":"Kさんにそう言っていただけて嬉しいです。これまで様々なプロジェクトで活躍されてきたと思いますが、今後Visionary AIではどのようなキャリアを描いていきたいですか？"},{"type":"answer","text":"最近は詳細設計工程がメインなので、今後は基本設計にも関わりたいです。Pythonがメインですが、言語を問わず様々な技術もキャッチアップしていきたいですね。 将来的にはマネジメント側に進んで、プロジェクト全体をまとめる経験を積みたいと考えています。現在のプロジェクトでもサブリーダーポジションで進捗管理やメンバーのタスク管理を任されていますが、日々やりがいや面白さを感じています。機会があれば、Visionary AIの他のメンバーと参画して、若手のメンバーを育てることにも挑戦してみたいです。 ただ、今後も環境によってはスペシャリストとしての活躍を求められることもあるでしょうし、その時に「やりたい」と思うことを突き詰めていきたいですね。"},{"type":"heading","text":"最後に"},{"type":"question","text":"今後の活躍が楽しみですし、Visionary AIにとっても本当に頼もしい存在です！今後もKさんが理想のキャリアを築けるよう全力でサポートしていきたいと思います。最後に転職を考えている候補者の方に一言お願いします！"},{"type":"answer","text":"Visionary AIは温かい雰囲気で、一人ひとりが自分らしく働くことができる環境です。経営陣、営業、エンジニア、バックオフィスなどそれぞれの組織の垣根を超えて、日々コミュニケーションが取りやすいですし、互いに協力しながら支え合うカルチャーがあるので、安心して挑戦することができます。 Visionary AIであれば、キャリアやスキルアップも支えてくれる環境が整っているので、ぜひ気になる方はエントリーしてみてください！"},{"type":"question","text":"素敵なメッセージを有難うございました！"}]}</script>
